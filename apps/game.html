<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>XuePilot - AI 指挥官模拟舱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .hidden-step { display: none !important; }
        body { background-color: #030712; color: #f8fafc; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(59, 130, 246, 0.2); }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #4f46e5); transition: all 0.2s; cursor: pointer; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 🚀 新增：战术辅助面板 */
        .tactical-panel { border-left: 2px solid #3b82f6; background: rgba(30,58,138,0.2); }
    </style>
</head>
<body class="min-h-screen">
    
    <main class="max-w-6xl mx-auto p-6 mt-8 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <div class="lg:col-span-3">
            <!-- 步骤 0: 选年龄 -->
            <div id="step-0" class="glass-panel rounded-3xl p-10 text-center fade-in">
                <h2 class="text-4xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">指挥官资格核验</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div onclick="startCampaign('young')" class="bg-slate-900 p-8 rounded-2xl border border-emerald-500/30 cursor-pointer hover:scale-105 transition">
                        <div class="text-5xl mb-4">🍭</div><h3 class="font-bold">星际幼崽 (6-8岁)</h3>
                    </div>
                    <div onclick="startCampaign('mid')" class="bg-slate-900 p-8 rounded-2xl border border-blue-500/30 cursor-pointer hover:scale-105 transition">
                        <div class="text-5xl mb-4">🦖</div><h3 class="font-bold">少年先锋 (9-12岁)</h3>
                    </div>
                    <div onclick="startCampaign('old')" class="bg-slate-900 p-8 rounded-2xl border border-purple-500/30 cursor-pointer hover:scale-105 transition">
                        <div class="text-5xl mb-4">⚛️</div><h3 class="font-bold">银河领航员 (13-15岁)</h3>
                    </div>
                </div>
            </div>

            <!-- 步骤 1: 简报 (略，同前) -->
            <div id="step-1" class="hidden-step glass-panel rounded-3xl p-10 text-center fade-in">
                <div id="mission-icon" class="text-7xl mb-6 text-blue-500">🪐</div>
                <h2 id="mission-title" class="text-3xl font-black mb-4">载入中...</h2>
                <p id="mission-desc" class="text-slate-300 mb-8 max-w-xl mx-auto leading-loose"></p>
                <button onclick="goToStep(2)" class="btn-primary px-12 py-4 rounded-full font-bold shadow-lg">进入全息指挥台</button>
            </div>

            <!-- 步骤 2: 核心环节 (提问/判断/整合，此处逻辑已原生化) -->
            <div id="step-2" class="hidden-step glass-panel rounded-3xl p-8 fade-in">
                <h2 class="text-2xl font-black mb-6 text-blue-400">环节 1: 下达全局指令 (Prompting)</h2>
                <textarea id="game-prompt" class="w-full bg-black/60 p-6 rounded-xl border border-slate-700 h-48 mb-6" placeholder="输入你对 AI 建设团队的要求..."></textarea>
                <div class="flex justify-between items-center">
                    <div class="text-xs text-slate-500">提示：考虑环境中的重力、能源和维生系统</div>
                    <button onclick="goToStep(3)" class="btn-primary px-10 py-3 rounded-xl font-bold">提交指令给智脑群 ➔</button>
                </div>
            </div>
            
            <!-- 更多步骤... -->
        </div>

        <!-- 🚀 战术辅助侧边栏 (更深度的 AI 应用) -->
        <aside class="hidden lg:block space-y-6">
            <div class="glass-panel p-6 rounded-2xl tactical-panel">
                <h3 class="text-blue-400 font-bold text-xs uppercase mb-3 tracking-widest">AI 战术参谋</h3>
                <p class="text-[10px] text-slate-400 leading-relaxed mb-4">当前局势分析：任务环境复杂度为 85%，提议在指令中加入对“极端昼夜温差”的考量。</p>
                <button onclick="requestTacticalAid()" class="w-full py-2 bg-blue-900/40 border border-blue-500/30 rounded text-[10px] font-bold text-blue-300 hover:bg-blue-600 transition">申请算力支持</button>
            </div>
            <div class="glass-panel p-6 rounded-2xl border-emerald-500/20">
                <h3 class="text-emerald-400 font-bold text-xs uppercase mb-3 tracking-widest">指挥官技能点</h3>
                <div class="space-y-3">
                    <div class="flex justify-between text-[10px]"><span>提问力 (Prompt)</span><span>LV.4</span></div>
                    <div class="w-full bg-slate-800 h-1 rounded-full"><div class="bg-blue-500 h-1 w-3/4"></div></div>
                    <div class="flex justify-between text-[10px]"><span>判断力 (Judge)</span><span>LV.2</span></div>
                    <div class="w-full bg-slate-800 h-1 rounded-full"><div class="bg-emerald-500 h-1 w-1/4"></div></div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        const campaigns = { 
            'young': [{title:'棉花糖星球保卫战', icon:'🍭', desc:'坏坏的蛀牙怪兽要来吃掉糖果了！你需要建立一个自动防御基地。'}],
            'mid': [{title:'月球自动化矿场', icon:'🌖', desc:'建立一个无需人工干预的自动化开采阵列，注意微陨石撞击风险。'}],
            'old': [{title:'戴森球能源工程', icon:'⚛️', desc:'在太阳轨道建设恒星能量捕获系统，解决星际文明的终极能源危机。'}]
        };
        let activeC = null;
        function startCampaign(age) { 
            activeC = campaigns[age][0]; 
            document.getElementById('mission-title').innerText = activeC.title;
            document.getElementById('mission-desc').innerText = activeC.desc;
            document.getElementById('mission-icon').innerText = activeC.icon;
            goToStep(1); 
        }
        function goToStep(s) {
            document.querySelectorAll('main > div > div').forEach(d => d.classList.add('hidden-step'));
            document.getElementById(`step-${s}`).classList.remove('hidden-step');
        }
        function requestTacticalAid() {
            Swal.fire({ title: '正在呼叫 AI 参谋...', text: '建议关注资源的循环利用率，这是长期任务成功的核心。', icon: 'info', background: '#0f172a', color: '#fff' });
        }
    </script>
</body>
</html>
