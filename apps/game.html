<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>XuePilot - AI 指挥官模拟舱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .hidden-step { display: none !important; }
        body { background-color: #030712; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(59, 130, 246, 0.2); }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #4f46e5); transition: all 0.2s; cursor: pointer; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tactical-sidebar { border-left: 1px solid rgba(59, 130, 246, 0.2); background: rgba(30, 58, 138, 0.1); }
    </style>
</head>
<body class="min-h-screen">
    <main class="max-w-6xl mx-auto p-6 mt-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <div class="lg:col-span-3">
            <div id="step-0" class="glass rounded-3xl p-10 text-center fade-in">
                <h2 class="text-4xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">指挥官资格核验 (Multiverse)</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div onclick="startCampaign('young')" class="bg-slate-900 p-8 rounded-2xl border border-emerald-500/30 cursor-pointer hover:scale-105 transition"><div class="text-5xl mb-4">🍭</div><h3 class="font-bold">星际幼崽 (6-8岁)</h3></div>
                    <div onclick="startCampaign('mid')" class="bg-slate-900 p-8 rounded-2xl border border-blue-500/30 cursor-pointer hover:scale-105 transition"><div class="text-5xl mb-4">🦖</div><h3 class="font-bold">少年先锋 (9-12岁)</h3></div>
                    <div onclick="startCampaign('old')" class="bg-slate-900 p-8 rounded-2xl border border-purple-500/30 cursor-pointer hover:scale-105 transition"><div class="text-5xl mb-4">⚛️</div><h3 class="font-bold">银河领航员 (13-15岁)</h3></div>
                </div>
            </div>
            <div id="step-1" class="hidden-step glass rounded-3xl p-10 text-center fade-in">
                <div id="mission-icon" class="text-7xl mb-6 text-blue-500 drop-shadow-lg">🪐</div>
                <h2 id="mission-title" class="text-3xl font-black mb-4 uppercase">载入中...</h2>
                <p id="mission-desc" class="text-slate-300 mb-10 max-w-xl mx-auto leading-loose"></p>
                <button onclick="goToStep(2)" class="btn-primary px-12 py-4 rounded-full font-bold shadow-xl text-lg tracking-widest">进入战术指挥中心</button>
            </div>
            <div id="step-2" class="hidden-step glass rounded-3xl p-8 fade-in">
                <h2 class="text-2xl font-black mb-6 text-blue-400">Phase 1: 下达全局建设指令 (Prompting)</h2>
                <textarea id="game-prompt" class="w-full bg-black/60 p-6 rounded-2xl border border-slate-700 h-48 mb-6 text-slate-200 outline-none" placeholder="输入具体指挥指令..."></textarea>
                <div class="flex justify-end"><button onclick="goToStep(3)" class="btn-primary px-10 py-3 rounded-xl font-bold">发送指令 ➔</button></div>
            </div>
            <div id="step-3" class="hidden-step glass rounded-3xl p-8 fade-in text-center">
                <h2 class="text-2xl font-black mb-6 text-purple-400">Phase 2: 方案逻辑漏洞筛查 (Judging)</h2>
                <button onclick="goToStep(4)" class="mt-8 btn-primary px-12 py-4 rounded-xl font-bold shadow-lg">漏洞已掌握，开始重组 ➔</button>
            </div>
            <div id="step-4" class="hidden-step glass rounded-3xl p-10 text-center fade-in">
                <div class="text-6xl mb-6">🛰️</div>
                <h2 class="text-2xl font-black mb-6 text-emerald-400">Phase 3: 终极架构整合 (Integrating)</h2>
                <button onclick="finishSim()" class="btn-primary px-12 py-4 rounded-full font-bold shadow-2xl">部署最终方案 🚀</button>
            </div>
        </div>
        <aside class="hidden lg:flex flex-col gap-6">
            <div class="glass p-6 rounded-2xl tactical-sidebar"><h3 class="text-blue-400 font-bold text-[10px] uppercase mb-4 tracking-widest">AI Tactical Advisor</h3><p class="text-[10px] text-slate-400 leading-relaxed mb-6 font-mono">REAL-TIME SCAN: 任务复杂度 88%。提议：在指令中考虑闭环资源循环系统。</p><button onclick="Swal.fire('战术支援','已开启核心逻辑扫描','info')" class="w-full py-2.5 bg-blue-900/40 border border-blue-500/30 rounded-xl text-[9px] font-bold">申请算力支持</button></div>
            <div class="glass p-6 rounded-2xl border-emerald-500/20"><h3 class="text-emerald-400 font-bold text-[10px] mb-4">Commander Skills</h3><div class="space-y-4"><div><div class="flex justify-between text-[9px] mb-1"><span>提问 (Prompt)</span><span>LV.5</span></div><div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden"><div class="bg-blue-500 h-full w-3/4"></div></div></div></div></div>
        </aside>
    </main>
    <script>
        const campaigns = { 
            'young': [{title:'糖果星球', icon:'🍭', desc:'保护棉花糖星球不被怪兽吃掉！'}],
            'mid': [{title:'月球矿场', icon:'🌖', desc:'建立一个全自动化的月球资源采集中心。'}],
            'old': [{title:'戴森球工程', icon:'⚛️', desc:'建设捕获恒星能量的超大型戴森壳体。'}]
        };
        let activeC = null;
        function startCampaign(age) { activeC = campaigns[age][0]; document.getElementById('mission-title').innerText = activeC.title; document.getElementById('mission-desc').innerText = activeC.desc; document.getElementById('mission-icon').innerText = activeC.icon; goToStep(1); }
        function goToStep(s) { document.querySelectorAll('main > div > div').forEach(d => d.classList.add('hidden-step')); const target = document.getElementById(`step-${s}`); if(target) target.classList.remove('hidden-step'); }
        function finishSim() { Swal.fire('最高指挥权验证通过','任务圆满完成！','success').then(()=>location.reload()); }
        goToStep(0);
    </script>
</body>
</html>
