<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>XuePilot Pro - 核心星际教室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #030712; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .planet { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; position: absolute; transform: translate(-50%, -50%); z-index: 10; }
        .planet:hover { transform: translate(-50%, -50%) scale(1.1); filter: brightness(1.2); }
        .orbit { border: 1px dashed rgba(59, 130, 246, 0.1); border-radius: 50%; position: absolute; pointer-events: none; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .shelf-card { background: linear-gradient(135deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9)); border: 1px solid rgba(255,255,255,0.05); }
        .btn-nav { @apply w-full flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all duration-300 text-left text-sm font-bold border border-transparent; }
        .btn-nav:hover { @apply bg-slate-800/60 border-slate-700; }
        .input-dark { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.1); color: #fff; outline: none; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .drag-over { background-color: rgba(59, 130, 246, 0.2) !important; border-color: #3b82f6 !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 定制化高级富文本 UI */
        .ql-toolbar.ql-snow { border: 1px solid rgba(255,255,255,0.1); background: rgba(15,23,42,0.8); border-top-left-radius: 1.2rem; border-top-right-radius: 1.2rem; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .ql-container.ql-snow { border: 1px solid rgba(255,255,255,0.1); border-top: none; border-bottom-left-radius: 1.2rem; border-bottom-right-radius: 1.2rem; background: rgba(0,0,0,0.4); font-family: -apple-system, sans-serif; font-size: 0.9rem; color: #e2e8f0; }
        .ql-snow .ql-stroke { stroke: #94a3b8; } .ql-snow .ql-fill { fill: #94a3b8; } .ql-snow .ql-picker { color: #94a3b8; }
        .ql-editor { min-height: 380px; line-height: 1.8; padding: 1.5rem; }
        .ql-editor h3 { color: #60a5fa; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; font-size: 1.2rem;}
        .ql-editor ul { padding-left: 1.5rem; margin-bottom: 1rem; }
        .ql-editor p { margin-bottom: 0.75rem; }
        .ql-editor strong { color: #38bdf8; }
        .ql-editor img { border-radius: 0.5rem; max-width: 100%; margin: 1rem 0; }
        .ql-editor iframe.ql-video { width: 100%; height: 300px; border-radius: 0.5rem; margin: 1rem 0; }

        /* NOVA 漂浮导师 */
        .nova-float { width: 64px; height: 64px; position: fixed; z-index: 100; cursor: grab; user-select: none; touch-action: none; }
        .nova-float:active { cursor: grabbing; }
        .nova-orb-inner { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb, #1e3a8a); box-shadow: 0 0 30px rgba(37, 99, 235, 0.6); animation: novaBreath 3s infinite alternate; border: 2px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        @keyframes novaBreath { from { transform: scale(1); } to { transform: scale(1.05); } }
        .nova-chat-panel { position: fixed; width: 360px; height: 500px; z-index: 99; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body x-data="proApp()" class="flex h-screen overflow-hidden">

    <!-- 侧边栏 -->
    <aside class="w-[18rem] border-r border-slate-800 flex flex-col py-6 px-4 glass z-20 shrink-0 shadow-2xl relative">
        <button @click="toggleLang()" class="absolute top-6 right-4 text-xs font-bold text-slate-400 bg-slate-800/50 hover:bg-slate-700 px-2 py-1 rounded transition" x-text="lang === 'zh' ? 'EN' : '中'"></button>
        
        <button @click="goHome()" class="w-full mb-8 mt-6 flex items-center justify-center gap-2 px-4 py-3 bg-slate-800/60 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300 hover:text-white transition-all shadow-sm text-xs font-bold tracking-wider group">
            <span class="group-hover:-translate-x-1 transition-transform text-lg">⬅</span> <span x-text="i18n[lang].backHome"></span>
        </button>

        <div class="mb-8 px-2">
            <div class="font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 text-2xl tracking-tighter" x-text="i18n[lang].title"></div>
            <div class="text-[10px] text-slate-500 font-mono mt-1 tracking-widest uppercase" x-text="i18n[lang].subtitle"></div>
        </div>

        <nav class="flex-1 space-y-2 overflow-y-auto mt-2 px-1 scrollbar-hide">
            <button @click="view = 'galaxy'" class="btn-nav" :class="view==='galaxy'?'bg-blue-600/20 text-blue-400 border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.15)]':'text-slate-400'">
                <span class="text-xl w-6 text-center">🌌</span> <span x-text="i18n[lang].navMap"></span>
            </button>
            <button @click="showPlanner = true" class="btn-nav" :class="showPlanner?'bg-purple-600/20 text-purple-400 border-purple-500/30 shadow-[0_0_15px_rgba(168,85,247,0.15)]':'text-slate-400'">
                <span class="text-xl w-6 text-center">✨</span> <span x-text="i18n[lang].navPlanner"></span>
            </button>

            <div class="h-px bg-slate-800/50 my-4 mx-2"></div>

            <button @click="checkProFeature('writing')" class="btn-nav group relative" :class="view==='writing'?'bg-orange-600/20 text-orange-400 border-orange-500/30 shadow-[0_0_15px_rgba(249,115,22,0.15)]':'text-slate-400'">
                <span class="text-xl w-6 text-center">✍️</span> <span class="flex-1" x-text="i18n[lang].navWriting"></span>
                <span x-show="!isPro" class="text-[8px] bg-amber-500/20 text-amber-500 px-1.5 py-0.5 rounded absolute right-4">PRO</span>
            </button>
            
            <button @click="openReading('en')" class="btn-nav" :class="view==='reading-en'?'bg-indigo-600/20 text-indigo-400 border-indigo-500/30 shadow-[0_0_15px_rgba(99,102,241,0.15)]':'text-slate-400'">
                <span class="text-xl w-6 text-center">📘</span> <span x-text="i18n[lang].navEnTutor"></span>
            </button>
            <button @click="openReading('zh')" class="btn-nav" :class="view==='reading-zh'?'bg-emerald-600/20 text-emerald-400 border-emerald-500/30 shadow-[0_0_15px_rgba(16,185,129,0.15)]':'text-slate-400'">
                <span class="text-xl w-6 text-center">📙</span> <span x-text="i18n[lang].navZhTutor"></span>
            </button>
        </nav>
    </aside>

    <main class="flex-1 relative overflow-hidden bg-[#02040a]">
        
        <!-- 场景：星系地图 -->
        <div x-show="view === 'galaxy'" x-transition class="h-full relative flex items-center justify-center fade-in">
            <template x-for="r in [300, 500, 700]"><div class="orbit" :style="`width: ${r}px; height: ${r}px;`"></div></template>
            <template x-for="s in subjects" :key="s.id">
                <div class="planet flex flex-col items-center" :style="`left: calc(50% + ${Math.cos(s.angle) * s.radius}px); top: calc(50% + ${Math.sin(s.angle) * s.radius}px);`" @click="openSubjectDetail(s)">
                    <div class="w-16 h-16 rounded-full bg-slate-800 border-2 border-slate-700 shadow-[0_0_20px_rgba(59,130,246,0.3)] flex items-center justify-center text-3xl" x-text="s.icon"></div>
                    <span class="mt-3 text-[10px] font-bold text-slate-300 uppercase tracking-widest bg-black/60 px-2 py-1 rounded shadow-lg" x-text="s.title"></span>
                </div>
            </template>
            <div x-show="subjects.length === 0" class="text-center text-slate-600">
                <div class="text-6xl mb-4 opacity-20">🌌</div>
                <p class="font-mono text-xs uppercase tracking-widest" x-text="i18n[lang].emptyMap"></p>
            </div>
        </div>

        <!-- 场景：AI 启发式写作舱 -->
        <div x-show="view === 'writing'" x-cloak x-transition class="h-full flex p-8 gap-6 fade-in">
            <div class="flex-1 glass rounded-3xl flex flex-col overflow-hidden bg-slate-900/80 shadow-xl border border-orange-500/20">
                <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                    <h3 class="font-black text-xl text-orange-400 flex items-center gap-3"><span class="text-2xl">✍️</span> <span x-text="i18n[lang].writeTitle"></span></h3>
                    <div class="w-48"><div class="flex justify-between text-[10px] text-slate-500 mb-1 font-mono uppercase"><span x-text="i18n[lang].writeIntensity"></span><span x-text="`${cmdIntensity}%`"></span></div><div class="w-full bg-slate-800 rounded-full h-1.5"><div class="bg-orange-500 h-1.5 rounded-full transition-all" :style="`width: ${cmdIntensity}%`"></div></div></div>
                </div>
                <div class="flex-1 p-6 flex flex-col">
                    <textarea x-model="writingDraft" @input="updateIntensity()" class="flex-1 input-dark p-6 text-lg leading-relaxed resize-none rounded-2xl focus:border-orange-500" :placeholder="i18n[lang].writePlaceholder"></textarea>
                    <div class="mt-6 flex justify-end">
                        <button @click="runWritingCritique()" class="px-10 py-4 bg-orange-600 hover:bg-orange-500 text-white font-bold rounded-xl shadow-lg transition flex items-center gap-3" :disabled="isCritiquing || !writingDraft.trim()">
                            <span x-show="isCritiquing" class="animate-spin text-lg">↻</span> <span x-text="isCritiquing ? i18n[lang].writeParsing : i18n[lang].writeBtn"></span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="w-1/3 glass rounded-3xl flex flex-col overflow-hidden border border-slate-800">
                <div class="p-6 bg-slate-800/40 border-b border-slate-700 font-bold text-sm text-slate-300 flex items-center gap-2">💡 <span x-text="i18n[lang].writeFeedbackTitle"></span></div>
                <div class="flex-1 p-6 overflow-y-auto text-sm text-slate-300 leading-loose font-serif" x-html="writingFeedback || `<div class='text-center text-slate-600 mt-20'><div class='text-5xl mb-4'>💭</div>${i18n[lang].writeEmpty}</div>`"></div>
            </div>
        </div>

        <!-- 场景：伴读舱 (内置私享书架) -->
        <div x-show="view.startsWith('reading') && !activeBook" x-cloak x-transition class="h-full flex flex-col p-8 overflow-y-auto fade-in">
            <div class="flex justify-between items-center mb-8">
                <div class="flex items-center gap-4"><span class="text-4xl" x-text="view==='reading-en'?'📘':'📙'"></span><h2 class="text-3xl font-black" x-text="view==='reading-en' ? i18n[lang].navEnTutor : i18n[lang].navZhTutor"></h2></div>
                <button @click="checkProFeature('importBook')" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold shadow-[0_0_15px_rgba(37,99,235,0.4)] transition flex items-center gap-2">
                    📥 <span x-text="i18n[lang].importBtn"></span> <span x-show="!isPro" class="text-[8px] bg-amber-500/20 text-amber-300 border border-amber-500/50 px-1 rounded">PRO</span>
                </button>
            </div>
            
            <div class="text-xs font-bold text-slate-500 uppercase mb-6 flex items-center gap-2"><div class="w-2 h-2 bg-blue-500 rounded-full"></div> <span x-text="i18n[lang].shelfTitle"></span></div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <template x-for="book in filteredBooks" :key="book.title">
                    <div class="shelf-card p-6 rounded-3xl relative group hover:border-blue-500/50 transition hover:-translate-y-1 shadow-xl">
                        <div class="flex justify-between mb-4"><span class="text-4xl text-blue-400 opacity-80">📖</span><span class="text-[10px] font-mono text-emerald-400 bg-emerald-900/20 px-2 py-1 rounded-lg border border-emerald-500/20" x-text="`${i18n[lang].accuracy} ${book.accuracy}%`"></span></div>
                        <h3 class="font-bold text-lg mb-2 text-slate-200 line-clamp-2" x-text="book.title"></h3>
                        <div class="text-[9px] text-slate-500 mb-3 font-mono uppercase tracking-widest">PROGRESS: <span x-text="book.progress"></span>%</div>
                        <div class="w-full bg-slate-800 h-1.5 rounded-full mb-6 overflow-hidden"><div class="bg-blue-500 h-full" :style="`width: ${book.progress}%`"></div></div>
                        <button @click="startReading(book)" class="w-full py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-xs font-bold hover:bg-blue-600 hover:border-blue-500 text-slate-300 hover:text-white transition" x-text="i18n[lang].startReadBtn"></button>
                    </div>
                </template>
            </div>
        </div>

        <!-- 场景：伴读交互区 (Active Reading) -->
        <div x-show="view.startsWith('reading') && activeBook" x-cloak class="h-full flex p-8 gap-6 fade-in">
            <div class="w-1/2 glass rounded-3xl flex flex-col overflow-hidden border border-blue-500/20">
                <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                    <div class="flex items-center gap-3">
                        <button @click="activeBook = null" class="text-xs bg-slate-800 px-4 py-2 rounded-lg hover:bg-slate-700 transition shadow-lg font-bold" x-text="i18n[lang].exitRead"></button>
                        <h3 class="font-bold text-blue-300 text-lg truncate w-64" x-text="activeBook?.title"></h3>
                    </div>
                </div>
                <div class="flex-1 p-8 overflow-y-auto text-sm leading-loose text-slate-300 font-serif whitespace-pre-wrap" x-text="activeBook?.content || ''"></div>
            </div>
            <div class="flex-1 glass rounded-3xl flex flex-col relative border overflow-hidden" :class="view==='reading-en'?'border-indigo-500/30':'border-emerald-500/30'">
                <div class="h-14 border-b border-slate-800/50 flex items-center justify-center bg-slate-900/50">
                    <span class="uppercase text-sm font-black tracking-widest flex items-center gap-2" :class="view==='reading-en'?'text-indigo-400':'text-emerald-400'"><span class="text-xl">🤖</span> <span x-text="view==='reading-en'?'NOVA English Tutor':'NOVA 大语文导师'"></span></span>
                </div>
                <div class="flex-1 p-6 overflow-y-auto space-y-4" id="nova-reading-chat">
                    <template x-for="(msg,i) in readingChatLog" :key="i">
                        <div class="flex flex-col" :class="msg.role==='user'?'items-end':'items-start'">
                            <span class="text-[10px] text-slate-500 font-bold mb-1" x-text="msg.role==='user'? i18n[lang].commander : 'NOVA'"></span>
                            <div class="max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed shadow-lg" :class="msg.role==='user'?'bg-blue-600/30 text-blue-100 border border-blue-500/30 rounded-tr-none':'bg-slate-800 text-slate-200 border border-slate-700 rounded-tl-none'"><span x-html="msg.text"></span></div>
                        </div>
                    </template>
                    <div x-show="readingLoading" class="text-blue-400 animate-pulse text-[10px] font-mono" x-text="i18n[lang].novaLoading"></div>
                </div>
                <div class="p-4 bg-slate-900 border-t border-slate-800 flex gap-2">
                    <input type="text" x-model="readingInput" @keydown.enter="sendReadingText()" class="flex-1 input-dark px-4 py-3 rounded-xl text-sm" :placeholder="i18n[lang].readInput">
                    <button @click="sendReadingText()" class="px-6 py-3 bg-blue-600 rounded-xl font-bold shadow-lg disabled:opacity-50 transition hover:bg-blue-500" :disabled="readingLoading || !readingInput.trim()">🚀</button>
                </div>
            </div>
        </div>

        <!-- 🚀 大纲生成引擎 -->
        <div x-show="showPlanner" x-cloak class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-8 backdrop-blur-md">
            <div class="glass w-full max-w-xl rounded-3xl p-10 relative border border-purple-500/20 shadow-[0_0_50px_rgba(147,51,234,0.2)] fade-in">
                <button @click="showPlanner = false" class="absolute top-6 right-6 text-2xl text-slate-500 hover:text-white transition">✖</button>
                <div class="text-center mb-8"><div class="text-5xl mb-4">🔮</div><h2 class="text-2xl font-black text-purple-400 uppercase tracking-tighter" x-text="i18n[lang].plannerTitle"></h2>
                <p class="text-slate-500 text-[10px] mt-2" x-text="i18n[lang].plannerDesc"></p></div>
                <div class="space-y-5">
                    <select x-model="planConfig.curriculum" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl text-sm outline-none focus:border-purple-500">
                        <option>中国义务教育课标 (2022版)</option><option>美国 Common Core State Standards</option><option>英国 National Curriculum (KS2/KS3)</option>
                    </select>
                    <div class="grid grid-cols-2 gap-4">
                        <select x-model="planConfig.grade" class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-sm outline-none focus:border-blue-500">
                            <option value="Grade 3">Grade 3 / 三年级</option><option value="Grade 4">Grade 4 / 四年级</option><option value="Grade 5">Grade 5 / 五年级</option>
                        </select>
                        <select x-model="planConfig.term" class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-sm outline-none focus:border-blue-500">
                            <option value="Term 1">Term 1 / 上学期</option><option value="Term 2">Term 2 / 下学期</option>
                        </select>
                    </div>
                    <button @click="generateSemesterMap()" class="w-full py-5 bg-gradient-to-r from-purple-600 to-blue-600 rounded-2xl font-bold shadow-xl flex items-center justify-center gap-3 hover:scale-[1.02] active:scale-95 transition" :disabled="loading">
                        <span x-show="loading" class="animate-spin text-xl">↻</span> <span x-text="loading ? i18n[lang].plannerLoading : i18n[lang].plannerBtn"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 🚀 深度教案编辑区 (含 Quill) -->
        <div x-show="editingSubject" x-cloak class="fixed inset-0 bg-slate-950 z-40 p-6 md:p-10 overflow-y-auto">
            <div class="max-w-7xl mx-auto fade-in">
                <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
                    <div class="flex items-center gap-5"><span class="text-5xl" x-text="editingSubject?.icon"></span><h2 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-indigo-300" x-text="editingSubject?.title"></h2></div>
                    <button @click="closeSubjectDetail()" class="px-8 py-3 bg-slate-800 rounded-xl hover:bg-slate-700 font-bold transition" x-text="i18n[lang].backMap"></button>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    
                    <div class="lg:col-span-4 space-y-4">
                        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4" x-text="i18n[lang].satellites"></h3>
                        <template x-for="lesson in activeLessons" :key="lesson.id">
                            <div class="p-5 rounded-2xl border border-slate-800 bg-slate-900/50 hover:border-blue-500 transition cursor-pointer flex justify-between items-center" :class="currentLesson?.id === lesson.id ? 'border-blue-500 bg-blue-900/20 shadow-[0_0_15px_rgba(59,130,246,0.15)]' : ''" @click="selectLesson(lesson)">
                                <div class="font-bold text-sm text-slate-200" x-text="lesson.title"></div><span class="text-xs opacity-50" x-show="lesson.content">📝</span>
                            </div>
                        </template>
                        <button @click="generateLessons()" class="w-full py-4 border border-dashed border-slate-700 rounded-2xl text-xs text-slate-500 hover:text-blue-400 hover:border-blue-500 transition font-bold" :disabled="lessonLoading">
                            <span x-show="lessonLoading" class="animate-spin inline-block">↻</span> <span x-text="lessonLoading ? i18n[lang].genLessonLoad : i18n[lang].genLessonBtn"></span>
                        </button>
                    </div>

                    <div class="lg:col-span-8 glass rounded-[2rem] flex flex-col shadow-2xl relative bg-slate-900/40">
                        <template x-if="!currentLesson">
                            <div class="flex-1 flex flex-col items-center justify-center text-slate-600 opacity-60 min-h-[500px]"><div class="text-7xl mb-6">✍️</div><p class="font-bold tracking-widest text-sm" x-text="i18n[lang].selectLesson"></p></div>
                        </template>
                        <template x-if="currentLesson">
                            <div class="flex-1 flex flex-col w-full h-full relative">
                                <!-- 顶部工具栏整合，AI 按钮位置优化 -->
                                <div id="toolbar-container" class="flex flex-wrap items-center justify-between w-full">
                                    <div class="flex gap-2">
                                        <span class="ql-formats"><button class="ql-bold"></button><button class="ql-italic"></button><button class="ql-underline"></button></span>
                                        <span class="ql-formats"><button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button></span>
                                        <!-- 🚀 富文本补齐图片视频插件 -->
                                        <span class="ql-formats"><button class="ql-image"></button><button class="ql-video"></button></span>
                                    </div>
                                    <button @click="generateLessonContent()" class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 hover:scale-105 transition shadow-lg" :disabled="contentLoading">
                                        <span x-show="contentLoading" class="animate-spin text-sm">↻</span> <span x-text="contentLoading ? i18n[lang].genContentLoad : i18n[lang].genContentBtn"></span>
                                    </button>
                                </div>
                                <div class="px-6 pt-4"><input x-model="currentLesson.title" class="bg-transparent text-2xl font-black border-none outline-none text-blue-300 w-full transition"></div>
                                <div id="editor-container" class="flex-1"></div>
                                <div class="p-4 border-t border-slate-800 flex justify-end"><button @click="saveLessonContent()" class="px-8 py-3 bg-slate-800 hover:bg-emerald-600 border border-slate-700 hover:border-emerald-500 rounded-xl font-bold shadow-lg transition text-sm" x-text="i18n[lang].saveLesson"></button></div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- 🤖 全局 NOVA 导师 -->
        <div x-show="user" x-cloak>
            <div id="nova-draggable" class="nova-float" :style="`left: ${novaPos.x}px; top: ${novaPos.y}px;`" @mousedown="startDrag($event)">
                <div class="nova-orb-inner shadow-blue-500/50">🤖</div>
            </div>

            <div x-show="novaOpen" x-transition class="nova-chat-panel" :style="`left: ${Math.min(Math.max(20, novaPos.x), window.innerWidth-380)}px; top: ${Math.max(20, novaPos.y-510)}px;`" @click.away="novaOpen = false">
                <div class="p-4 bg-blue-900/40 border-b border-blue-500/30 flex justify-between items-center">
                    <span class="text-[10px] font-black uppercase text-blue-300 tracking-widest">Nova Advisor</span>
                    <button @click="novaOpen = false" class="text-slate-500 hover:text-white">✖</button>
                </div>
                <div class="flex-1 p-4 overflow-y-auto space-y-4 text-xs" id="nova-chat-content">
                    <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 leading-relaxed text-slate-300" x-text="i18n[lang].novaGlobalGreeting"></div>
                    <template x-for="m in novaMsgs">
                        <div :class="m.role==='user'?'text-right':'text-left'"><div class="inline-block p-3 rounded-2xl mt-2 shadow-lg" :class="m.role==='user'?'bg-blue-600 text-white':'bg-slate-800 border border-slate-700 text-slate-200'" x-text="m.content"></div></div>
                    </template>
                    <div x-show="novaLoading" class="text-blue-400 animate-pulse text-[10px] font-mono">Loading...</div>
                </div>
                <div class="p-3 border-t border-slate-800 bg-slate-900 flex gap-2">
                    <input type="text" x-model="novaInput" @keydown.enter="novaAsk()" class="flex-1 input-dark p-3 rounded-xl text-xs" :placeholder="i18n[lang].readInput">
                    <button @click="novaAsk()" class="bg-blue-600 p-3 rounded-xl shadow-lg hover:bg-blue-500 transition">🚀</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        window.quillEditor = null;

        document.addEventListener('alpine:init', () => {
            Alpine.data('proApp', () => ({
                isPro: localStorage.getItem('xp_is_pro') === 'true',
                lang: localStorage.getItem('xp_lang') || 'zh', // 🚀 真正记录多语言状态
                view: 'galaxy', subjects: [], showPlanner: false, 
                loading: false, lessonLoading: false, contentLoading: false,
                planConfig: { curriculum: '美国 Common Core State Standards', grade: 'Grade 4', term: 'Term 1' },
                editingSubject: null, activeLessons: [], currentLesson: null,
                
                // i18n 完整字典
                i18n: {
                    zh: {
                        backHome: '返回主控舱', title: 'XuePilot PRO', subtitle: 'Classroom Matrix',
                        navMap: '学期科目星系', navPlanner: '智能大纲引擎', navWriting: 'AI 启发写作舱', navEnTutor: '英文智能伴读', navZhTutor: '大语文传承', navTools: '全球AI资源探索',
                        emptyMap: '请启动智能引擎构建知识星图',
                        writeTitle: '指挥官起草区', writeIntensity: '思维发散强度', writePlaceholder: '记录你的思维或构架...', writeBtn: '🧠 获取深度启发反馈', writeParsing: '正在进行逻辑链解析...', writeFeedbackTitle: 'AI 导师启发墙', writeEmpty: '等待输入与解析...',
                        importBtn: '导入专属档案', shelfTitle: '专属书架 (LIBRARY)', accuracy: '掌握度', startReadBtn: '开启深度阅读', exitRead: '← 退出阅读', commander: '指挥官', novaLoading: '深入检索上下文...', readInput: '探讨核心思想...',
                        plannerTitle: 'Strategic Planner', plannerDesc: '系统将结合选定地区的教育标准，智能构建结构化的知识星图。', plannerBtn: '🚀 构建全局知识星图', plannerLoading: '正在深度解析教育大纲...',
                        backMap: '返回星图概览', satellites: '知识节点拆解 (Satellites)', genLessonBtn: '✨ 智能提取教学节点', genLessonLoad: '深度挖掘知识架构中...', selectLesson: '选择左侧节点，进入教案编辑器', genContentBtn: '✨ 智能生成启发式教案', genContentLoad: '结构化生成中...', saveLesson: '💾 保存节点档案',
                        novaGlobalGreeting: '你好，指挥官。我已解除位置锁定。有什么需要探讨的吗？'
                    },
                    en: {
                        backHome: 'Return to Command', title: 'XuePilot PRO', subtitle: 'Classroom Matrix',
                        navMap: 'Semester Galaxy Map', navPlanner: 'Curriculum Engine', navWriting: 'Socratic Writing Lab', navEnTutor: 'English AI Tutor', navZhTutor: 'Chinese Heritage', navTools: 'Global AI Resources',
                        emptyMap: 'Run the Engine to generate your knowledge map.',
                        writeTitle: 'Commander Draft Area', writeIntensity: 'Prompt Intensity', writePlaceholder: 'Record your thoughts or structure here...', writeBtn: '🧠 Get Deep Feedback', writeParsing: 'Analyzing logic chains...', writeFeedbackTitle: 'Socratic Feedback Wall', writeEmpty: 'Waiting for input...',
                        importBtn: 'Import Document', shelfTitle: 'Commander Library', accuracy: 'Accuracy', startReadBtn: 'Start Deep Reading', exitRead: '← Exit Reading', commander: 'Cmdr.', novaLoading: 'Retrieving context...', readInput: 'Explore core ideas...',
                        plannerTitle: 'Strategic Planner', plannerDesc: 'The system maps customized knowledge galaxies based on regional standards.', plannerBtn: '🚀 Build Knowledge Galaxy', plannerLoading: 'Parsing standards deeply...',
                        backMap: 'Back to Map', satellites: 'Learning Satellites', genLessonBtn: '✨ Extract Core Lessons', genLessonLoad: 'Mining knowledge architecture...', selectLesson: 'Select a node on the left to enter the editor.', genContentBtn: '✨ Gen Socratic Lesson', genContentLoad: 'Structuring content...', saveLesson: '💾 Save Node Data',
                        novaGlobalGreeting: 'Greetings, Commander. Position unlocked. What shall we explore today?'
                    }
                },

                writingDraft: '', writingFeedback: '', cmdIntensity: 10, isCritiquing: false,
                
                books: [ 
                    { title: 'The Little Prince (Chapter 1)', lang: 'en', progress: 45, accuracy: 88, content: 'Once when I was six years old I saw a magnificent picture...' }, 
                    { title: 'National Geographic: Mars', lang: 'en', progress: 10, accuracy: 95, content: 'Mars is the fourth planet from the Sun and the second-smallest planet in the Solar System...' },
                    { title: '《西游记》第一回', lang: 'zh', progress: 20, accuracy: 82, content: '混沌未分天地乱，茫茫渺渺无人见...' },
                    { title: '《论语》学而篇精选', lang: 'zh', progress: 100, accuracy: 96, content: '子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”' }
                ],
                activeBook: null, readingChatLog: [], readingInput: '', readingLoading: false,
                
                // 🚀 修复核心：补齐 user 和 novaLoading 初始状态
                user: { id: 1 },
                novaOpen: false, novaInput: '', novaMsgs: [], novaLoading: false, novaPos: { x: window.innerWidth - 100, y: window.innerHeight - 100 }, isDragging: false, dragStartPos: {x:0, y:0}, dragStartTime: 0, offset: {x:0, y:0},

                get filteredBooks() { return this.books.filter(b => b.lang === (this.view === 'reading-en' ? 'en' : 'zh')); },
                
                toggleLang() { this.lang = this.lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('xp_lang', this.lang); },
                goHome() { window.parent.postMessage({ type: 'GO_HOME' }, '*'); },
                openReading(lang) { this.view = 'reading-' + lang; this.activeBook = null; },

                checkProFeature(featureName) {
                    if (!this.isPro) { window.parent.postMessage({ type: 'UPGRADE_PRO' }, '*'); return; }
                    if (featureName === 'writing') this.view = 'writing';
                    if (featureName === 'importBook') this.executeImportBook();
                },

                // 🚀 NOVA 终极防误触算法 (距离+时间判定)
                startDrag(e) {
                    this.isDragging = false; 
                    this.dragStartTime = Date.now();
                    this.dragStartPos = { x: e.clientX, y: e.clientY };
                    this.offset.x = e.clientX - this.novaPos.x;
                    this.offset.y = e.clientY - this.novaPos.y;
                    
                    const move = (ev) => {
                        const dist = Math.hypot(ev.clientX - this.dragStartPos.x, ev.clientY - this.dragStartPos.y);
                        if (dist > 3) { // 极小容差
                            this.isDragging = true;
                            this.novaPos.x = ev.clientX - this.offset.x;
                            this.novaPos.y = ev.clientY - this.offset.y;
                        }
                    };
                    const stop = (ev) => {
                        window.removeEventListener('mousemove', move);
                        window.removeEventListener('mouseup', stop);
                        
                        const timeElapsed = Date.now() - this.dragStartTime;
                        const dist = Math.hypot(ev.clientX - this.dragStartPos.x, ev.clientY - this.dragStartPos.y);
                        
                        // 🚀 核心：只有未被标记为严重拖拽 且 按下时间极短，才认为是纯点击
                        if (!this.isDragging && timeElapsed < 300 && dist < 5) {
                            this.novaOpen = !this.novaOpen;
                        }
                        this.isDragging = false;
                    };
                    window.addEventListener('mousemove', move);
                    window.addEventListener('mouseup', stop);
                },

                async callAI(prompt, type = 'sys', customSysMsg = null) {
                    const prefix = type === 'sys' ? 'xp_sys' : 'xp_nova';
                    const key = localStorage.getItem(`${prefix}_key`) || localStorage.getItem('xp_sys_key'); 
                    const url = (localStorage.getItem(`${prefix}_url`) || localStorage.getItem('xp_sys_url') || '/proxy/groq') + '/chat/completions';
                    const model = localStorage.getItem(`${prefix}_model`) || localStorage.getItem('xp_sys_model') || 'llama-3.3-70b-versatile';
                    
                    if(!key) { Swal.fire('No Engine', `Missing ${type} API Key`, 'warning'); return null; }
                    let sysMsg = customSysMsg || (type === 'sys' ? 'You are an elite Socratic curriculum designer.' : 'You are NOVA Tutor. Guide thinking.');
                    
                    try {
                        const res = await fetch(url, { 
                            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, 
                            body: JSON.stringify({ model: model, messages: [{ role: 'system', content: sysMsg }, { role: 'user', content: prompt }] }) 
                        });
                        if(!res.ok) throw new Error('API Reject');
                        const data = await res.json(); 
                        return data.choices[0].message.content;
                    } catch(e) { Swal.fire('Error', 'API Connection Failed', 'error'); return null; }
                },

                // 🚀 算力映射 1：强力中英文约束
                async generateSemesterMap() { 
                    this.loading = true; 
                    const langInstruction = this.planConfig.curriculum.includes('中国') ? '必须全部使用纯正中文' : '[FATAL CONSTRAINT]: MUST Output STRICTLY in English ONLY. The subject titles MUST be standard local English terms (e.g. Language Arts, STEM). No Chinese characters allowed.';
                    
                    const prompt = `根据【${this.planConfig.curriculum}】的【${this.planConfig.grade}】【${this.planConfig.term}】标准，生成5个核心学科。
                    ${langInstruction}
                    仅返回JSON数组格式：[{"title": "学科名", "icon": "单字符emoji"}]。不准输出任何其他内容。`;
                    
                    const res = await this.callAI(prompt, 'sys');
                    if (res) {
                        try {
                            const cleanJson = res.replace(/```json/gi, '').replace(/```/gi, '').trim();
                            const parsedData = JSON.parse(cleanJson);
                            this.subjects = parsedData.map((s, i) => ({
                                id: Date.now() + i, title: s.title, icon: s.icon,
                                radius: 200 + (Math.floor(i / 3) * 150), angle: (i * (Math.PI * 2 / 5)) + (Math.random() * 0.5) 
                            }));
                            this.showPlanner = false;
                            Swal.fire({title: this.i18n[this.lang].plannerTitle, icon:'success', background:'#0f172a', color:'#fff'});
                        } catch (e) { Swal.fire('Error', 'Invalid AI format', 'error'); }
                    }
                    this.loading = false;
                },

                // 算力映射 2：强力中英文约束章节
                async generateLessons() {
                    this.lessonLoading = true;
                    const langInstruction = /^[A-Za-z\s]+$/.test(this.editingSubject.title) ? '[FATAL CONSTRAINT]: MUST Output STRICTLY in English ONLY.' : '全部使用中文。';
                    const prompt = `为【${this.editingSubject.title}】学科生成3个符合大纲的真实教学章节名称。
                    ${langInstruction}
                    仅返回JSON数组格式：[{"title": "章节名称"}]。不要其他文字。`;
                    const res = await this.callAI(prompt, 'sys');
                    if (res) {
                        try {
                            const cleanJson = res.replace(/```json/gi, '').replace(/```/gi, '').trim();
                            const lessons = JSON.parse(cleanJson);
                            this.activeLessons = lessons.map((l, i) => ({ id: Date.now() + i, title: l.title, content: '' }));
                        } catch (e) {}
                    }
                    this.lessonLoading = false;
                },

                // 算力映射 3：富文本生成
                async generateLessonContent() {
                    if (!this.currentLesson || !window.quillEditor) return;
                    this.contentLoading = true;
                    const langInstruction = /^[A-Za-z\s]+$/.test(this.editingSubject.title) ? 'Output the content entirely in English.' : '用中文输出内容。';
                    const prompt = `请为课程章节【${this.currentLesson.title}】编写一份详尽的“苏格拉底式教案”。
                    【格式极其严格的限制】：直接输出排版优美的 HTML 代码片段 (可使用 <h3>, <ul>, <li>, <p>, <strong>)。绝对不要包含 <html>、<body> 外层标签。不要使用 \`\`\`html 包裹！
                    ${langInstruction}`;
                    const res = await this.callAI(prompt, 'sys');
                    if (res) {
                        const cleanHtml = res.replace(/```html/gi, '').replace(/```/gi, '').trim();
                        window.quillEditor.root.innerHTML = cleanHtml;
                        this.currentLesson.content = cleanHtml;
                    }
                    this.contentLoading = false;
                },

                selectLesson(lesson) {
                    if (this.currentLesson && window.quillEditor) { this.currentLesson.content = window.quillEditor.root.innerHTML; }
                    this.currentLesson = lesson;
                    this.$nextTick(() => {
                        if (!window.quillEditor) {
                            window.quillEditor = new Quill('#editor-container', { 
                                theme: 'snow', 
                                placeholder: this.lang === 'zh' ? '在此编辑，或点击魔法按钮自动生成...' : 'Edit here or auto-generate...', 
                                modules: { toolbar: '#toolbar-container' } 
                            });
                        }
                        window.quillEditor.root.innerHTML = lesson.content || '';
                    });
                },

                saveLessonContent() {
                    if (this.currentLesson && window.quillEditor) {
                        this.currentLesson.content = window.quillEditor.root.innerHTML;
                        Swal.fire({toast: true, position: 'top-end', icon: 'success', title: 'Saved', showConfirmButton: false, timer: 1500});
                    }
                },

                openSubjectDetail(s) { this.editingSubject = s; this.activeLessons = []; this.currentLesson = null; window.quillEditor = null; },
                closeSubjectDetail() { if(this.currentLesson) this.saveLessonContent(); this.editingSubject = null; },

                updateIntensity() {
                    const text = this.writingDraft; let score = 10;
                    if (text.length > 20) score += 20; if (text.includes("?") || text.includes("？")) score += 20;
                    if (text.includes("如何") || text.includes("为什么") || text.includes("how") || text.includes("why")) score += 30;
                    this.cmdIntensity = Math.min(100, Math.max(10, score));
                },

                async runWritingCritique() {
                    if(!this.writingDraft.trim()) return; this.isCritiquing = true;
                    const res = await this.callAI(`作为严厉且睿智的导师，不要代写修改。请分3点提出启发性反问。\n我的原案：\n${this.writingDraft}`, 'sys');
                    if(res) this.writingFeedback = res.replace(/\n/g, '<br>');
                    this.isCritiquing = false;
                },

                executeImportBook() { 
                    Swal.fire({ 
                        title: this.lang==='zh'?'上传私密读本档案':'Import Documents',
                        html: `<div id="drop-zone" class="border-2 border-dashed border-blue-500/50 rounded-2xl p-8 mb-4 text-slate-400 hover:bg-blue-900/20 transition cursor-pointer"><span class="text-4xl mb-3 block">📄</span><span class="font-bold">点击或拖拽 .txt 档案至此</span><input type="file" id="file-input" class="hidden" accept=".txt,.md"></div><textarea id="paste-zone" class="w-full bg-black/50 border border-slate-700 rounded-xl p-4 text-sm mt-4 h-32" placeholder="直接粘贴文本..."></textarea><input type="text" id="book-title" class="w-full bg-black/50 border border-slate-700 rounded-xl p-4 text-sm mt-4 font-bold" placeholder="书名/文档名">`,
                        background: '#0f172a', color: '#fff', width: 600, showCancelButton: true, confirmButtonText: '入库',
                        didOpen: () => {
                            const dz = document.getElementById('drop-zone'), fi = document.getElementById('file-input'), pz = document.getElementById('paste-zone'), ti = document.getElementById('book-title');
                            dz.onclick = () => fi.click(); dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('drag-over'); }; dz.ondragleave = (e) => { e.preventDefault(); dz.classList.remove('drag-over'); };
                            const hf = (file) => { const r = new FileReader(); r.onload = (e) => { pz.value = e.target.result; if(!ti.value) ti.value = file.name.replace(/\.[^/.]+$/, ""); }; r.readAsText(file); };
                            dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove('drag-over'); if (e.dataTransfer.files.length) hf(e.dataTransfer.files[0]); };
                            fi.onchange = (e) => { if (e.target.files.length) hf(e.target.files[0]); };
                        },
                        preConfirm: () => {
                            const text = document.getElementById('paste-zone').value.trim(), title = document.getElementById('book-title').value.trim();
                            if (!text) return false;
                            return { text, title: title || '未命名档案' };
                        }
                    }).then(res => {
                        if(res.isConfirmed) { this.books.unshift({ title: res.value.title, lang: this.view==='reading-en'?'en':'zh', progress: 0, accuracy: 0, content: res.value.text }); }
                    }); 
                },

                startReading(book) {
                    this.activeBook = book;
                    this.readingChatLog = [{ role: 'nova', text: this.lang === 'en' ? `Commander, I've mapped <strong>"${book.title}"</strong>. Which logical fragment shall we dissect first?` : `指挥官，已将《${book.title}》映射至核心。你想探讨文中的哪个底层细节？` }];
                },

                async sendReadingText() {
                    const t = this.readingInput.trim(); if(!t || this.readingLoading) return;
                    this.readingInput = ''; this.readingChatLog.push({role: 'user', text: t}); this.readingLoading = true;
                    setTimeout(() => { const el = document.getElementById('nova-reading-chat'); if(el) el.scrollTop = el.scrollHeight; }, 100);
                    
                    const prompt = `背景材料:\n${this.activeBook.content.substring(0, 1500)}\n\n学生:${t}\n要求: 结合材料苏格拉底式反问，绝不直给答案。语言: ${this.view === 'reading-en' ? 'English' : 'Chinese'}`;
                    const reply = await this.callAI(prompt, 'nova');
                    if(reply) { this.readingChatLog.push({role: 'nova', text: reply.replace(/\n/g, '<br>')}); setTimeout(() => { const el = document.getElementById('nova-reading-chat'); if(el) el.scrollTop = el.scrollHeight; }, 100); }
                    this.readingLoading = false;
                },

                async novaAsk() {
                    const q = this.novaInput.trim(); if(!q || this.novaLoading) return;
                    this.novaInput = ''; this.novaMsgs.push({role:'user', content:q}); this.novaLoading = true;
                    try {
                        const res = await this.callAI(q, 'nova', this.lang === 'zh' ? '你是NOVA导师。引导思考。' : 'You are NOVA Tutor. Guide thinking.');
                        if (res) this.novaMsgs.push({role:'assistant', content: res});
                    } catch(e) { this.novaMsgs.push({role:'assistant', content: 'Error.'}); }
                    this.novaLoading = false;
                    setTimeout(() => { const c = document.getElementById('nova-chat-content'); if(c) c.scrollTop = c.scrollHeight; }, 100);
                }
            }));
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

</html>
