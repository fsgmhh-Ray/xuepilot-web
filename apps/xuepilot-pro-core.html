<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>XuePilot Pro - 核心母舰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #030712; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .planet { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        .planet:hover { transform: scale(1.1); filter: brightness(1.2); }
        .orbit { border: 1px dashed rgba(59, 130, 246, 0.1); border-radius: 50%; position: absolute; pointer-events: none; }
        .shelf-card { background: linear-gradient(135deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9)); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body x-data="proApp()" class="flex h-screen">

    <!-- 侧边栏 -->
    <aside class="w-64 border-r border-slate-800 flex flex-col py-6 glass z-20">
        <div class="px-6 mb-8 font-black text-blue-400 text-xl tracking-tighter">XuePilot PRO</div>
        <nav class="flex-1 px-3 space-y-1">
            <button @click="view = 'galaxy'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition" :class="view==='galaxy'?'bg-blue-600/20 text-blue-400 border border-blue-500/30':'text-slate-400'">🌌 学期科目星系</button>
            <button @click="view = 'bookshelf'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mt-2" :class="view==='bookshelf'?'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30':'text-slate-400'">📚 指挥官书架</button>
        </nav>
        <div class="p-4 mt-auto">
            <div class="bg-slate-900 rounded-xl p-3 border border-slate-800">
                <div class="text-[10px] text-slate-500 font-bold mb-1 uppercase">学情统计</div>
                <div class="flex justify-between text-[10px] text-blue-400"><span>本周进步</span><span>+12.5%</span></div>
                <div class="w-full bg-slate-800 h-1 mt-1 rounded-full"><div class="bg-blue-500 h-1 w-2/3"></div></div>
            </div>
        </div>
    </aside>

    <main class="flex-1 relative overflow-hidden">
        
        <!-- ================= 场景 1: 学期科目星系 (Semester Galaxy) ================= -->
        <div x-show="view === 'galaxy'" class="h-full relative flex items-center justify-center">
            <div class="orbit w-[400px] h-[400px]"></div>
            <div class="orbit w-[700px] h-[700px]"></div>
            
            <template x-for="subject in subjects">
                <div class="planet absolute flex flex-col items-center" 
                     :style="`left: calc(50% + ${Math.cos(subject.angle) * subject.radius}px); top: calc(50% + ${Math.sin(subject.angle) * subject.radius}px);`"
                     @click="openSubjectDetail(subject)">
                    <div class="w-16 h-16 rounded-full bg-slate-800 border-2 border-slate-600 shadow-xl flex items-center justify-center text-3xl" x-text="subject.icon"></div>
                    <span class="mt-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest" x-text="subject.title"></span>
                </div>
            </template>

            <div class="absolute bottom-10 right-10 flex gap-4">
                <button @click="showPlanner = true" class="px-8 py-4 bg-purple-600 rounded-full font-bold shadow-2xl hover:scale-105 transition">✨ 启动学期全科目规划</button>
            </div>
        </div>

        <!-- ================= 场景 2: 书架系统 (Commander Bookshelf) ================= -->
        <div x-show="view === 'bookshelf'" x-cloak class="p-8 h-full overflow-y-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black text-white">指挥官个人书架</h2>
                <button @click="importBook()" class="px-6 py-2 bg-emerald-600 rounded-lg font-bold">📥 导入新读本</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <template x-for="book in books">
                    <div class="shelf-card p-6 rounded-2xl relative group cursor-pointer hover:border-emerald-500/50 transition">
                        <div class="text-4xl mb-4">📖</div>
                        <h3 class="font-bold text-lg mb-1" x-text="book.title"></h3>
                        <div class="text-[10px] text-slate-500 mb-4">阅读进度: <span x-text="book.progress"></span>%</div>
                        <div class="w-full bg-slate-800 h-1 rounded-full mb-4"><div class="bg-emerald-500 h-1" :style="`width: ${book.progress}%`"></div></div>
                        <button class="w-full py-2 bg-slate-700 rounded-lg text-xs font-bold group-hover:bg-emerald-600 transition">开启伴读交互</button>
                    </div>
                </template>
            </div>
        </div>

        <!-- ================= 🚀 全新 Mission Planner (三段式逻辑) ================= -->
        <div x-show="showPlanner" x-cloak class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-8 backdrop-blur-md">
            <div class="glass w-full max-w-2xl rounded-3xl p-10 relative border border-blue-500/20">
                <button @click="showPlanner = false" class="absolute top-6 right-6 text-2xl">✖</button>
                
                <template x-if="plannerStep === 1">
                    <div>
                        <h2 class="text-2xl font-black text-blue-400 mb-6 font-mono">STEP 1: 国家大纲与政策定位</h2>
                        <div class="space-y-6">
                            <select x-model="planConfig.curriculum" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-sm">
                                <option>中国义务教育课标 (2022版)</option>
                                <option>英国 National Curriculum (KS2/KS3)</option>
                                <option>美国 Common Core State Standards</option>
                            </select>
                            <select x-model="planConfig.grade" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-sm">
                                <option>小学三年级</option><option>小学四年级</option><option>初中一年级</option>
                            </select>
                            <button @click="generateSemesterMap()" class="w-full py-5 bg-blue-600 rounded-2xl font-bold shadow-xl flex items-center justify-center gap-3">
                                <span x-show="loading" class="animate-spin">↻</span> 一键生成学期全科目星图
                            </button>
                        </div>
                    </div>
                </template>

                <template x-if="plannerStep === 2">
                    <div class="text-center">
                        <div class="text-5xl mb-6">🌌</div>
                        <h2 class="text-2xl font-black text-white mb-2">全科目星系已生成</h2>
                        <p class="text-slate-400 text-sm mb-8">AI 已根据大纲自动规划了语文、数学、英语、科学、艺术等核心科目。</p>
                        <div class="flex flex-wrap justify-center gap-3 mb-8">
                            <template x-for="s in subjects">
                                <span class="bg-blue-900/40 border border-blue-500/30 px-3 py-1 rounded-full text-xs" x-text="s.title"></span>
                            </template>
                        </div>
                        <button @click="showPlanner = false; plannerStep = 1" class="px-10 py-4 bg-emerald-600 rounded-full font-bold">进入星图开始微调</button>
                    </div>
                </template>
            </div>
        </div>

        <!-- 科目详情与内容编辑器 -->
        <div x-show="editingSubject" x-cloak class="fixed inset-0 bg-slate-950 z-40 p-8 overflow-y-auto">
            <div class="max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
                    <div class="flex items-center gap-4">
                        <span class="text-4xl" x-text="editingSubject?.icon"></span>
                        <h2 class="text-3xl font-black" x-text="editingSubject?.title"></h2>
                    </div>
                    <button @click="editingSubject = null" class="px-6 py-2 bg-slate-800 rounded-lg">返回星图</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <!-- 左侧：章节卫星列表 -->
                    <div class="space-y-4">
                        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest">课程章节章节 (Satellites)</h3>
                        <template x-for="lesson in activeLessons">
                            <div class="p-4 rounded-xl border border-slate-800 bg-slate-900/50 hover:border-blue-500 transition cursor-pointer" @click="editLesson(lesson)">
                                <div class="font-bold text-sm" x-text="lesson.title"></div>
                            </div>
                        </template>
                        <button @click="generateLessons()" class="w-full py-3 border border-dashed border-slate-700 rounded-xl text-xs text-slate-500 hover:text-blue-400 hover:border-blue-500">一键生成基础教学章节</button>
                    </div>
                    <!-- 右侧：精修编辑区 -->
                    <div class="md:col-span-2 glass p-8 rounded-3xl min-h-[500px] flex flex-col">
                        <div x-show="!currentLesson" class="flex-1 flex flex-col items-center justify-center text-slate-600">
                            <div class="text-6xl mb-4">✍️</div>
                            <p>选择一个章节或卫星节点进行精修编辑</p>
                        </div>
                        <div x-show="currentLesson" class="flex-1 flex flex-col">
                            <input x-model="currentLesson.title" class="bg-transparent text-2xl font-black border-none outline-none mb-4">
                            <div id="editor" class="flex-1 bg-black/20 p-6 rounded-xl text-sm leading-relaxed overflow-y-auto border border-slate-800" contenteditable="true">
                                加载章节核心内容...
                            </div>
                            <div class="mt-6 flex justify-end gap-4">
                                <button class="px-6 py-2 bg-blue-600 rounded-lg font-bold">保存并同步至 AI 导师</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('proApp', () => ({
                view: 'galaxy', subjects: [], showPlanner: false, plannerStep: 1, loading: false,
                planConfig: { curriculum: '中国义务教育课标 (2022版)', grade: '小学四年级' },
                editingSubject: null, activeLessons: [], currentLesson: null,
                books: [
                    { title: '《小王子》英文导读', progress: 45, accuracy: 88 },
                    { title: '《论语》精选二十章', progress: 12, accuracy: 92 }
                ],

                async generateSemesterMap() {
                    this.loading = true;
                    // 模拟 AI 生成过程
                    setTimeout(() => {
                        this.subjects = [
                            { id:1, title:'语文', icon:'🇨🇳', radius:200, angle: 0 },
                            { id:2, title:'数学', icon:'📐', radius:200, angle: 2.1 },
                            { id:3, title:'英语', icon:'🇬🇧', radius:200, angle: 4.2 },
                            { id:4, title:'自然科学', icon:'🧪', radius:320, angle: 1.05 }
                        ];
                        this.loading = false;
                        this.plannerStep = 2;
                    }, 2000);
                },

                openSubjectDetail(s) { this.editingSubject = s; this.activeLessons = []; this.currentLesson = null; },
                
                generateLessons() {
                    this.activeLessons = [
                        { title: '第一章：核心概念定义' }, { title: '第二章：批判性思维练习' }, { title: '第三章：跨学科整合实践' }
                    ];
                },
                
                editLesson(l) { 
                    this.currentLesson = l;
                    document.getElementById('editor').innerText = "AI 已为您准备好该章节的苏格拉底式教案：\n\n1. 核心问题引导...\n2. 盲点排查逻辑...\n3. 知识迁移挑战...";
                },

                importBook() {
                    Swal.fire({ title: '导入文档', input: 'textarea', inputPlaceholder: '将书籍内容或文档文本粘贴于此...', background: '#0f172a', color: '#fff' })
                    .then(res => {
                        if(res.value) {
                            this.books.unshift({ title: '新导入读本 ' + (this.books.length + 1), progress: 0, accuracy: 0 });
                            Swal.fire('成功', '文档已存入书架并建立索引', 'success');
                        }
                    });
                }
            }));
        });
    </script>
</body>
</html>
