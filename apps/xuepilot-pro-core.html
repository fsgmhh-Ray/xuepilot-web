<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XuePilot Pro - 核心母舰 v8.7 (指挥官训练版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #030712; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .orbit { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px dashed rgba(59, 130, 246, 0.15); border-radius: 50%; pointer-events: none; }
        .planet { position: absolute; transform: translate(-50%, -50%); transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; z-index: 10; }
        .planet:hover { transform: translate(-50%, -50%) scale(1.2); }
        
        /* 🚥 指令强度计特效 */
        .intensity-bar { height: 4px; transition: all 0.5s ease; border-radius: 2px; }
        .log-entry { border-left: 2px solid #3b82f6; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .nova-orb { width: 140px; height: 140px; border-radius: 50%; margin: 0 auto; background: radial-gradient(circle at 30% 30%, #38bdf8, #2563eb, #1e3a8a); box-shadow: 0 0 40px rgba(37, 99, 235, 0.4); transition: all 0.4s ease; }
        .nova-listening { background: radial-gradient(circle at 30% 30%, #c084fc, #9333ea, #4c1d95); animation: pulse 1.5s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.1); } }

        .input-dark { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.1); color: #fff; outline: none; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 10px; }
    </style>
</head>
<body x-data="proApp()" class="flex h-screen relative">

    <div class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_50%_50%,rgba(17,24,39,1)_0%,rgba(3,7,18,1)_100%)]"></div>

    <aside class="w-72 border-r border-slate-800 flex flex-col py-6 z-20 glass-panel">
        <div class="px-6 mb-6 font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300 tracking-tighter text-xl">XuePilot PRO</div>
        
        <nav class="flex-1 px-3 space-y-1 overflow-y-auto">
            <div class="text-[10px] text-slate-500 font-bold px-4 mb-2 uppercase tracking-widest">Command Center</div>
            <button @click="currentView = 'map'" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl transition" :class="currentView === 'map' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800/50'"><span class="text-lg">🗺️</span><span class="text-sm font-bold">探索星图</span></button>
            <button @click="currentView = 'writing'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition group" :class="currentView === 'writing' ? 'bg-orange-900/40 text-orange-200 border border-orange-500/50' : 'bg-slate-800/40 text-slate-300'"><span class="text-xl">✍️</span><div class="text-left font-bold text-sm">AI 启发式写作</div></button>
            <button @click="openNova('en')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition mb-2" :class="currentView === 'nova-en' ? 'bg-indigo-900/40 border border-indigo-500/50' : 'bg-slate-800/40'"><span class="text-xl">🇬🇧</span><div class="text-left font-bold text-sm">英文伴读舱</div></button>
            <button @click="openNova('zh')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition" :class="currentView === 'nova-zh' ? 'bg-emerald-900/40 border border-emerald-500/50' : 'bg-slate-800/40'"><span class="text-xl">🇨🇳</span><div class="text-left font-bold text-sm">大语文传承</div></button>

            <!-- 📜 思维指挥日志 -->
            <div class="mt-8 px-4">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] text-slate-500 font-bold uppercase">思维指挥日志</span>
                    <span class="text-[9px] bg-blue-600 px-1.5 py-0.5 rounded text-white" x-text="`LV.${commanderLevel}`"></span>
                </div>
                <div class="space-y-3 max-h-64 overflow-y-auto pr-2">
                    <template x-for="log in commandLogs" :key="log.id">
                        <div class="log-entry pl-3 py-1 text-[10px] text-slate-400">
                            <div class="text-blue-400 font-bold" x-text="log.time"></div>
                            <div class="leading-relaxed mt-0.5" x-text="log.content"></div>
                        </div>
                    </template>
                    <div x-show="commandLogs.length === 0" class="text-[10px] text-slate-600 italic">等待指挥官下达指令...</div>
                </div>
            </div>
        </nav>
    </aside>

    <main class="flex-1 relative overflow-hidden">
        
        <!-- 星图 -->
        <div x-show="currentView === 'map'" x-transition class="absolute inset-0 flex items-center justify-center">
            <template x-for="r in [180, 320, 460]"><div class="orbit" :style="`width: ${r*2}px; height: ${r*2}px;`"></div></template>
            <template x-for="planet in planets" :key="planet.id">
                <div @click="openEditor(planet)" class="planet w-14 h-14 rounded-full bg-slate-900 border-2 border-slate-700 shadow-lg flex items-center justify-center group" :style="`left: calc(50% + ${Math.cos(planet.angle) * planet.radius}px); top: calc(50% + ${Math.sin(planet.angle) * planet.radius}px);`"><span class="text-2xl" x-text="planet.icon"></span><div class="absolute -bottom-8 whitespace-nowrap text-[10px] font-bold text-slate-400 opacity-0 group-hover:opacity-100 bg-black/50 px-2 py-1 rounded" x-text="planet.title"></div></div>
            </template>
            <button @click="showAiPlanner = true" class="absolute bottom-10 right-10 p-4 bg-blue-600 rounded-full shadow-2xl hover:scale-110 transition active:scale-95 text-white z-30">✨ 规划新航线</button>
        </div>

        <!-- 写作舱 (带强度计) -->
        <div x-show="currentView === 'writing'" x-cloak x-transition class="absolute inset-0 flex p-6 gap-6">
            <div class="flex-1 glass-panel rounded-2xl flex flex-col overflow-hidden bg-slate-900/80 shadow-xl border border-orange-500/20">
                <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                    <h3 class="font-bold text-sm text-orange-200">📝 协作指挥区</h3>
                    <div class="w-48">
                        <div class="flex justify-between text-[9px] text-slate-500 mb-1 font-mono"><span>COMMAND STRENGTH</span><span x-text="`${cmdIntensity}%`"></span></div>
                        <div class="w-full bg-slate-800 rounded-full h-1">
                            <div class="intensity-bar" :style="`width: ${cmdIntensity}%; background-color: ${intensityColor}`"></div>
                        </div>
                    </div>
                </div>
                <div class="flex-1 p-6 flex flex-col relative">
                    <textarea x-model="writingDraft" @input="updateIntensity()" class="flex-1 input-dark p-6 text-lg leading-relaxed resize-none rounded-xl" placeholder="在这里输入你的原始想法或指挥指令..."></textarea>
                    <button @click="runWritingCritique()" class="mt-4 py-4 bg-orange-600 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2" :disabled="isCritiquing">
                        <span x-show="isCritiquing" class="animate-spin">↻</span><span x-text="isCritiquing ? 'AI 正在解析指令...' : '下达启发式批阅指令'"></span>
                    </button>
                </div>
            </div>
            <div class="w-1/3 glass-panel rounded-2xl flex flex-col overflow-hidden border border-slate-800">
                <div class="p-4 bg-slate-800/50 font-bold text-sm">💡 导师建议 (思维跳板)</div>
                <div class="flex-1 p-6 overflow-y-auto text-sm leading-loose text-slate-300 font-serif" x-html="writingFeedback || '等待指挥官草稿...'"></div>
            </div>
        </div>

        <!-- NOVA 伴读舱 -->
        <div x-show="currentView.startsWith('nova')" x-cloak x-transition class="absolute inset-0 flex p-6 gap-6">
            <div class="w-1/3 glass-panel rounded-2xl flex flex-col"><div class="p-4 bg-slate-800 text-sm font-bold">📖 阅读素材注入</div><textarea x-model="novaContext" class="flex-1 input-dark p-4 text-sm resize-none"></textarea><button @click="saveContext()" class="m-3 py-2 bg-blue-600 text-xs rounded-lg font-bold">💾 保存并同步 AI 大脑</button></div>
            <div class="flex-1 glass-panel rounded-2xl flex flex-col relative border" :class="novaLang==='en-US'?'border-indigo-500/30':'border-emerald-500/30'">
                <div class="h-16 border-b border-slate-800/50 flex items-center px-6 uppercase text-sm font-bold text-blue-400" x-text="novaLang==='en-US'?'English Tutor Engine':'大语文传承引擎'"></div>
                <div class="flex-1 flex flex-col items-center justify-center"><div class="w-32 h-32 rounded-full border-4 flex items-center justify-center cursor-pointer transition" :class="novaState==='listening'?'border-purple-500 animate-pulse':'border-blue-900'" @click="toggleNovaListening()"><span class="text-5xl" x-text="novaState==='idle'?'🎙️':'👂'"></span></div><button @click="toggleNovaListening()" class="mt-8 px-10 py-4 bg-blue-600 rounded-full font-bold shadow-xl">点击指挥 AI</button></div>
                <div class="h-56 border-t border-slate-800 bg-slate-900/90 p-4 overflow-y-auto" id="nova-chat-box"><template x-for="(msg,i) in novaChatLog" :key="i"><div class="mb-3 flex flex-col" :class="msg.role==='user'?'items-end':'items-start'"><span class="text-[10px] text-slate-500 font-bold" x-text="msg.role==='user'?'指挥官':'NOVA'"></span><div class="max-w-[80%] p-3 rounded-2xl text-sm" :class="msg.role==='user'?'bg-slate-700':'bg-slate-800 text-indigo-100 border border-slate-700'"><span x-text="msg.text"></span></div></div></template></div>
            </div>
        </div>

        <!-- 🚀 规划器 (下拉框版) -->
        <div x-show="showAiPlanner" x-cloak class="absolute inset-0 bg-black/90 z-50 flex items-center justify-center p-8 backdrop-blur-sm">
            <div class="glass-panel w-full max-w-xl rounded-2xl p-8 border border-purple-500/30">
                <div class="flex justify-between items-center mb-6 font-mono text-xl text-purple-400">MISSION PLANNER</div>
                <div class="space-y-5">
                    <select x-model="aiSpec.curriculum" class="w-full input-dark p-3 rounded-xl text-sm"><option>中国义务教育课标</option><option>英国国家大纲 (National Curriculum)</option><option>美国 Common Core</option></select>
                    <div class="grid grid-cols-2 gap-4">
                        <select x-model="aiSpec.grade" class="w-full input-dark p-3 rounded-xl text-sm"><option>3年级</option><option>4年级</option><option>5年级</option><option>6年级</option></select>
                        <select x-model="aiSpec.subject" class="w-full input-dark p-3 rounded-xl text-sm"><option>语文</option><option>数学</option><option>英语</option><option>科学</option></select>
                    </div>
                    <input type="text" x-model="aiSpec.topic" placeholder="具体主题..." class="w-full input-dark p-3.5 rounded-xl text-sm">
                    <button @click="runAiPlanning()" class="w-full py-4 bg-purple-600 text-white font-bold rounded-xl" :disabled="isPlanning">🚀 启动星际生成</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        window.proApp = function() {
            function safeGet(k, d = '') { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
            function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
            function wash(u) { if (!u) return ''; let r = u.trim(); if(r.endsWith('/')) r = r.slice(0,-1); const s = ['/chat/completions', '/v1']; s.forEach(x => { if(r.endsWith(x)) r = r.substring(0, r.length - x.length); }); return r + '/v1'; }

            const sbUrl = 'https://cywslfalbedraeeggryj.supabase.co';
            const sbKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5d3NsZmFsYmVkcmFlZWdncnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDg5NjEsImV4cCI6MjA5MTYyNDk2MX0.uZoL3JiHGuw_8XNOHKu4mA4z4tsEH7T9czQCkYrb0x0';
            let client = null;
            try { if (window.supabase) client = window.supabase.createClient(sbUrl, sbKey); } catch (e) {}

            return {
                currentView: 'map', planets: [], showAiPlanner: false, isPlanning: false, isCritiquing: false,
                aiSpec: { curriculum: '中国义务教育课标', grade: '4年级', subject: '数学', topic: '' },
                novaState: 'idle', novaLang: 'en-US', novaChatLog: [], novaContext: '', writingDraft: '', writingFeedback: '',
                
                commandLogs: [], commanderLevel: 1, cmdIntensity: 10,
                get intensityColor() { return this.cmdIntensity < 40 ? '#ef4444' : (this.cmdIntensity < 80 ? '#f59e0b' : '#10b981'); },

                async init() {
                    this.novaContext = safeGet('xuepilot_nova_context');
                    if(client) { try { await this.loadPlanets(); } catch(e) {} }
                    try { this.initSpeechAPI(); } catch(e) {}
                    this.addLog("指挥系统启动。当前的教育模式：苏格拉底接生术。");
                },

                addLog(content) {
                    this.commandLogs.unshift({ id: Date.now(), time: new Date().toLocaleTimeString(), content });
                    if(this.commandLogs.length > 20) this.commandLogs.pop();
                    this.commanderLevel = 1 + Math.floor(this.commandLogs.length / 5);
                },

                updateIntensity() {
                    const text = this.writingDraft;
                    let score = 10;
                    if (text.length > 20) score += 20;
                    if (text.includes("？") || text.includes("?")) score += 20;
                    if (text.includes("如何") || text.includes("为什么") || text.includes("定义")) score += 30;
                    if (text.includes("帮我写") || text.includes("直接给我")) score -= 30;
                    this.cmdIntensity = Math.min(100, Math.max(10, score));
                },

                openNova(m) { this.currentView = m==='en'?'nova-en':'nova-zh'; this.novaLang = m==='en'?'en-US':'zh-CN'; this.novaState = 'idle'; this.novaChatLog = [{role:'nova', text: m==='en'?"Commander, give me an order based on the text.":"指挥官，请基于素材对我下达教学指令。"}]; },
                saveContext() { safeSet('xuepilot_nova_context', this.novaContext); this.addLog("已注入新阅读语料，NOVA 思维已同步。"); Swal.fire({toast:true, icon:'success', title:'素材已注入'}); },
                async loadPlanets() { if(client){ const {data} = await client.from('planets').select('*').order('created_at',{ascending:true}); this.planets = data || []; } },
                
                async callAI(prompt, type = 'sys') {
                    const prefix = type === 'sys' ? 'xp_sys' : 'xp_nova';
                    const key = safeGet(`${prefix}_key`);
                    const url = wash(safeGet(`${prefix}_url`, 'https://api.openai.com/v1'));
                    const model = safeGet(`${prefix}_model`, 'gpt-4o-mini');
                    if(!key) { Swal.fire('请配置 API Key','','warning'); return null; }
                    try {
                        const res = await fetch(`${url}/chat/completions`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, body: JSON.stringify({ model, messages: [{ role: 'system', content: 'You are a Socratic tutor guiding an AI Commander.' }, { role: 'user', content: prompt }] }) });
                        const data = await res.json(); return data.choices[0].message.content;
                    } catch(e) { return null; }
                },

                async runAiPlanning() {
                    if(!this.aiSpec.topic) return; this.isPlanning = true;
                    this.addLog(`下达规划任务：基于${this.aiSpec.curriculum}规划“${this.aiSpec.topic}”学习航线。`);
                    const res = await this.callAI(`生成5个学习节点,仅返回JSON:[{"title":"标题","icon":"Emoji"}]`, 'sys');
                    if(res && client){ 
                        try { 
                            // 🚀 核心修复点：将特殊符号转为 Unicode，避免在渲染时炸毁 Markdown
                            const cleanRes = res.replace(/\u0060\u0060\u0060json/g, '').replace(/\u0060\u0060\u0060/g, '').trim();
                            const nodes = JSON.parse(cleanRes); 
                            const list = nodes.map((n,i)=>({...n, radius:180+(i%3)*120, angle:Math.random()*6, content:''})); 
                            await client.from('planets').insert(list); 
                            await this.loadPlanets(); 
                            this.showAiPlanner = false; 
                            this.addLog("航线规划生成成功，已部署至星图。"); 
                        } catch(e) {
                            console.error("Parse Error:", e);
                            Swal.fire('解析失败', 'AI 返回数据异常', 'error');
                        } 
                    }
                    this.isPlanning = false;
                },

                async runWritingCritique() {
                    if(!this.writingDraft) return; this.isCritiquing = true;
                    this.addLog(`正在指挥 AI 进行苏格拉底式批阅。指令强度：${this.cmdIntensity}%`);
                    const res = await this.callAI(`不代写,分3点启发式点评,多反问:\n${this.writingDraft}`, 'sys');
                    if(res) {
                        this.writingFeedback = res.replace(/\n/g, '<br>');
                        this.addLog("AI 导师已返回启发建议。指挥官开始下一轮思考。");
                    }
                    this.isCritiquing = false;
                },

                initSpeechAPI() {
                    const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return;
                    this.sr = new SR(); this.sr.onstart = () => { this.novaState = 'listening'; };
                    this.sr.onresult = async (e) => {
                        const t = e.results[0][0].transcript; this.novaChatLog.push({role:'user', text:t}); this.novaState = 'thinking';
                        this.addLog(`向 NOVA 下达口语指令：${t.substring(0,10)}...`);
                        const reply = await this.callAI(`背景:${this.novaContext}\n学生:${t}`, 'nova');
                        if(reply){ this.novaChatLog.push({role:'nova', text:reply}); this.speak(reply); } else this.novaState = 'idle';
                    };
                    this.sr.onend = () => { if(this.novaState==='listening') this.novaState = 'idle'; };
                },
                toggleNovaListening() { if(this.novaState==='idle') { this.sr.lang = this.novaLang; this.sr.start(); } else this.sr.stop(); },
                speak(t) { if(!window.speechSynthesis) return; this.novaState = 'speaking'; const u = new SpeechSynthesisUtterance(t); u.lang = this.novaLang; u.rate = 0.9; u.onend = () => { this.novaState='idle'; }; window.speechSynthesis.speak(u); }
            };
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
