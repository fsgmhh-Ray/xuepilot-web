<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>准入评估扫描仪 - XuePilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: transparent; color: #e2e8f0; font-family: -apple-system, sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        /* 恢复酷炫的玻璃拟物和光晕效果 */
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.1); }
        .btn-glow { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; } 
        .btn-glow::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); opacity: 0; transition: opacity 0.3s; transform: scale(0.5); }
        .btn-glow:hover::after { opacity: 1; transform: scale(1); }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(59, 130, 246, 0.5); transform: translateY(-2px); border-color: rgba(96, 165, 250, 0.8); }
        .btn-glow:active { transform: translateY(1px); box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        
        .progress-transition { transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .input-dark { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.2); color: #fff; transition: all 0.3s; }
        .input-dark:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); background: rgba(15, 23, 42, 0.8); }
    </style>
</head>
<body class="flex items-center justify-center p-4" x-data="radarApp()">

    <div class="glass-panel w-full max-w-2xl rounded-3xl p-8 md:p-10 relative overflow-hidden mt-8 mb-8">
        
        <header class="flex justify-between items-center border-b border-slate-700/50 pb-5 mb-8">
            <div class="flex items-center gap-3">
                <span class="text-3xl filter drop-shadow-[0_0_8px_rgba(59,130,246,0.8)]">📡</span>
                <div>
                    <h1 class="text-xl font-black text-white tracking-widest">准入评估扫描仪</h1>
                    <div class="text-[10px] text-blue-400 font-mono tracking-widest">ASSESSMENT RADAR v4.0</div>
                </div>
            </div>
            <div class="text-xs font-mono font-bold" :class="step === 2 ? 'text-emerald-400' : 'text-blue-400'">
                STATUS: <span class="animate-pulse" x-text="step === 2 ? 'ANALYZED' : 'SCANNING...'"></span>
            </div>
        </header>

        <div x-show="step === 0" x-transition.opacity.duration.500ms class="text-center py-10">
            <div class="text-7xl mb-8 animate-bounce">🛸</div>
            <h2 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 mb-6">准备好脱离重力圈了吗？</h2>
            <p class="text-slate-400 mb-10 leading-relaxed max-w-lg mx-auto text-sm md:text-base">家庭 AI 伴学是一场漫长而浪漫的星际航行。在引擎正式点火前，系统需要用 60 秒完成您的领航员资质扫描。</p>
            <button @click="startScan()" class="btn-glow px-10 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-full font-bold tracking-widest shadow-lg text-lg">启动引擎扫描 [SCAN]</button>
        </div>

        <div x-show="step === 1" x-cloak x-transition.opacity.duration.500ms>
            <div class="mb-4 flex justify-between items-center text-xs font-mono text-blue-400 font-bold tracking-widest">
                <span>SYSTEM QUERY: <span x-text="currentIndex + 1"></span>/10</span>
                <span><span x-text="Math.round((currentIndex / 10) * 100)"></span>%</span>
            </div>
            <div class="w-full bg-slate-800/80 rounded-full h-2 mb-10 overflow-hidden border border-slate-700">
                <div class="bg-gradient-to-r from-blue-500 to-indigo-400 h-2 rounded-full progress-transition relative shadow-[0_0_10px_rgba(59,130,246,0.8)]" :style="`width: ${(currentIndex / 10) * 100}%`"></div>
            </div>
            <div class="min-h-[140px] flex flex-col justify-center mb-8">
                <h3 class="text-2xl md:text-3xl font-medium text-white leading-relaxed text-center drop-shadow-md" x-text="questions[currentIndex].text"></h3>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button @click="answer(true)" class="btn-glow py-5 rounded-2xl bg-slate-800/60 border-2 border-slate-600 hover:bg-emerald-900/20 hover:border-emerald-500 hover:text-emerald-300 text-lg font-bold text-slate-300 transition-colors">🟢 是的 (YES)</button>
                <button @click="answer(false)" class="btn-glow py-5 rounded-2xl bg-slate-800/60 border-2 border-slate-600 hover:bg-rose-900/20 hover:border-rose-500 hover:text-rose-300 text-lg font-bold text-slate-300 transition-colors">🔴 否 (NO)</button>
            </div>
        </div>

        <div x-show="step === 2" x-cloak x-transition.opacity.duration.800ms>
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-white mb-3">领航员资质分析报告</h2>
                <div class="inline-block px-5 py-1.5 rounded-full text-sm font-bold shadow-lg" :class="resultData.badgeClass" x-text="resultData.badgeText"></div>
            </div>

            <div class="relative w-full max-w-[280px] mx-auto aspect-square mb-6">
                <canvas id="radarChart"></canvas>
            </div>

            <div class="bg-slate-800/40 rounded-xl p-5 border border-slate-700 mb-8 text-slate-300 text-sm leading-relaxed text-center shadow-inner" x-html="resultData.advice"></div>

            <div class="bg-gradient-to-br from-blue-900/40 to-purple-900/20 rounded-2xl p-6 md:p-8 border border-blue-500/40 shadow-[0_0_30px_rgba(59,130,246,0.15)] relative overflow-hidden">
                <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
                
                <h4 class="text-lg font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-indigo-300 mb-2 flex items-center gap-2">
                    <span class="text-xl">🚀</span> 一键生成云端档案并激活教室
                </h4>
                <p class="text-xs text-slate-400 mb-6 font-mono">为了永久保存您的评测数据和排课进度，请创建安全访问凭证。</p>
                
                <form @submit.prevent="autoRegister" class="space-y-5 relative z-10">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">您的称呼</label>
                            <input type="text" x-model="leadName" required placeholder="例：Peter" class="input-dark w-full p-3.5 rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">所在区域</label>
                            <select x-model="leadRegion" class="input-dark w-full p-3.5 rounded-xl text-sm text-slate-200">
                                <option value="国内">中国大陆 (侧重英语启蒙)</option>
                                <option value="海外">海外华人 (侧重中文传承)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">通讯邮箱 (登录账号)</label>
                        <input type="email" x-model="leadEmail" required placeholder="pilot@example.com" class="input-dark w-full p-3.5 rounded-xl text-sm font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">设置安全访问密钥 (登录密码)</label>
                        <input type="password" x-model="leadPassword" required minlength="6" placeholder="至少6位，用于下次登录系统" class="input-dark w-full p-3.5 rounded-xl text-sm font-mono tracking-widest">
                    </div>

                    <div class="pt-4 mt-2">
                        <button type="submit" class="w-full py-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:via-indigo-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-[0_0_20px_rgba(79,70,229,0.4)] transition transform hover:-translate-y-1 hover:scale-[1.02] flex items-center justify-center gap-3 text-lg" :disabled="isSubmitting">
                            <span x-show="isSubmitting" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                            <span x-text="isSubmitting ? '正在构建加密通信隧道...' : '🚀 免费激活档案，直达星际教室'"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('radarApp', () => ({
                step: 0, currentIndex: 0, chartInstance: null,
                scores: { time: 0, support: 0, mindset: 0, resource: 0, finance: 0 },
                
                leadName: '', leadEmail: '', leadPassword: '', leadRegion: '国内', isSubmitting: false,
                
                questions: [
                    { text: "我能每天抽出至少 2 小时用于引导孩子的学习吗？", dim: 'time' },
                    { text: "我的家庭成员，支持或不干涉我尝试新的AI伴学模式吗？", dim: 'support' },
                    { text: "我能接受孩子在转换学习模式初期，出现的焦虑或抗拒吗？", dim: 'mindset' },
                    { text: "我愿意为孩子寻找除了做题以外的兴趣或运动圈子吗？", dim: 'resource' },
                    { text: "我对孩子学习的核心诉求是“能力”而非短期的“分数”吗？", dim: 'mindset' },
                    { text: "我具备基本的心理韧性，去应对外界传统教育观念的质疑吗？", dim: 'mindset' },
                    { text: "我愿意花时间学习并筛选优质的数字化教育工具吗？", dim: 'resource' },
                    { text: "孩子平时对电子设备或新鲜事物抱有好奇心吗？", dim: 'support' },
                    { text: "如果这种伴学模式效果不好，我能心态平和地调整策略吗？", dim: 'finance' }, 
                    { text: "我愿意投资小额的资金在提升效率的数字工具上吗？", dim: 'finance' }
                ],

                get resultData() {
                    const total = Object.values(this.scores).reduce((a, b) => a + b, 0);
                    if (total >= 8) return { badgeText: "🚀 领航舱已就绪", badgeClass: "bg-emerald-500/20 text-emerald-400 border border-emerald-500/50", advice: "您的各项硬件与心理指标均已达标。您完全具备开启深度家庭 AI 伴学的条件。" };
                    else if (total >= 5) return { badgeText: "🔧 需边飞边调", badgeClass: "bg-amber-500/20 text-amber-400 border border-amber-500/50", advice: "您已具备基础航行条件。建议您先从每日 30 分钟的课后AI强效伴学开始，平稳过渡。" };
                    else return { badgeText: "⏸️ 建议轻量启动", badgeClass: "bg-rose-500/20 text-rose-400 border border-rose-500/50", advice: "当前雷达显示您的准备还不够充分。建议先利用我们的系统培养孩子的自主阅读习惯。" };
                },

                init() {
                    window.addEventListener('message', (event) => {
                        if (event.data && event.data.type === 'STOP_LOADING') {
                            this.isSubmitting = false;
                        }
                    });
                },

                startScan() { this.step = 1; },
                answer(isYes) {
                    if (isYes) this.scores[this.questions[this.currentIndex].dim] += 1;
                    if (this.currentIndex < this.questions.length - 1) this.currentIndex++; 
                    else { this.step = 2; setTimeout(() => this.renderChart(), 100); }
                },

                // 🚀 终极防克隆修复逻辑
                autoRegister() {
                    this.isSubmitting = true;
                    
                    // 手动提取纯原生数据，彻底抛弃 Alpine 的 Proxy 对象绑定
                    const rawPayload = {
                        name: String(this.leadName),
                        email: String(this.leadEmail),
                        password: String(this.leadPassword),
                        region: String(this.leadRegion),
                        scores: {
                            time: Number(this.scores.time),
                            support: Number(this.scores.support),
                            mindset: Number(this.scores.mindset),
                            resource: Number(this.scores.resource),
                            finance: Number(this.scores.finance)
                        }
                    };

                    // 将纯净的数据发给外层主系统
                    window.parent.postMessage({
                        type: 'AUTO_REGISTER',
                        payload: rawPayload
                    }, '*');
                },

                renderChart() {
                    const ctx = document.getElementById('radarChart').getContext('2d');
                    const data = [(this.scores.time / 1) * 100, (this.scores.support / 2) * 100, (this.scores.mindset / 3) * 100, (this.scores.resource / 2) * 100, (this.scores.finance / 2) * 100];
                    new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: ['时间与精力', '家庭共识', '心理韧性', '资源整合', '成长心态'],
                            datasets: [{
                                data: data, backgroundColor: 'rgba(59, 130, 246, 0.4)', borderColor: 'rgba(96, 165, 250, 1)', pointBackgroundColor: '#fff', borderWidth: 2, pointRadius: 4, pointHoverRadius: 6
                            }]
                        },
                        options: {
                            scales: { r: { angleLines: { color: 'rgba(255, 255, 255, 0.1)' }, grid: { color: 'rgba(255, 255, 255, 0.15)' }, pointLabels: { color: '#cbd5e1', font: { size: 11, family: 'monospace' } }, ticks: { display: false, min: 0, max: 100 } } },
                            plugins: { legend: { display: false } },
                            elements: { line: { tension: 0.3 } } // 让雷达图的线稍微平滑一点
                        }
                    });
                }
            }));
        });
    </script>
</body>
</html>
