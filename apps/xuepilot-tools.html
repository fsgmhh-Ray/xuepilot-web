<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球 AI 资源探索 - 派乐伴学 XuePilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { 
            background-color: transparent; /* 配合 iframe 透明背景 */
            color: #e2e8f0; 
            font-family: -apple-system, sans-serif;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
            min-height: 100vh;
        }
        
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* 3D 翻转卡片核心样式 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .card-hover:hover .transform-style-3d { transform: rotateY(180deg); }
        
        /* 霓虹发光边框 */
        .neon-border { position: relative; }
        .neon-border::before {
            content: ''; position: absolute; inset: -1px; rounded: inherit; z-index: -1;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #3b82f6);
            opacity: 0; transition: opacity 0.3s;
        }
        .card-hover:hover .neon-border::before { opacity: 0.5; filter: blur(8px); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="p-6 md:p-10" x-data="toolMapApp()">

    <div class="max-w-6xl mx-auto flex flex-col h-full min-h-[90vh]">
        
        <header class="glass-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-2xl">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                    🌍
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">全球 AI 资源探索</h1>
                    <div class="text-xs text-blue-400 font-mono mt-1">XUEPILOT RESOURCE MATRIX v3.5</div>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-2 justify-center">
                <template x-for="tag in filterTags" :key="tag.id">
                    <button @click="currentFilter = tag.id"
                            class="px-4 py-2 rounded-full text-sm font-bold transition-all duration-300 border"
                            :class="currentFilter === tag.id ? 'bg-blue-600 border-blue-400 text-white shadow-[0_0_10px_rgba(59,130,246,0.5)]' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'">
                        <span x-text="tag.icon" class="mr-1"></span>
                        <span x-text="tag.name"></span>
                    </button>
                </template>
            </div>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-12">
            <template x-for="tool in filteredTools" :key="tool.name">
                <div class="h-80 perspective-1000 card-hover group cursor-pointer">
                    <div class="relative w-full h-full transform-style-3d rounded-2xl shadow-xl neon-border">
                        
                        <div class="absolute w-full h-full backface-hidden bg-slate-900 border border-slate-700 rounded-2xl p-6 flex flex-col justify-between">
                            <div class="flex justify-between items-start">
                                <span class="text-5xl drop-shadow-lg" x-text="tool.icon"></span>
                                <span class="text-xs font-mono font-bold px-2 py-1 rounded bg-slate-800 text-slate-300" x-text="tool.age"></span>
                            </div>
                            <div>
                                <h3 class="text-2xl font-bold text-white mb-2" x-text="tool.name"></h3>
                                <p class="text-blue-300 text-sm font-medium mb-4" x-text="tool.slogan"></p>
                                <div class="flex gap-2 text-xs text-slate-400">
                                    <span class="bg-slate-800 px-2 py-1 rounded flex items-center gap-1">🏷️ <span x-text="tool.price"></span></span>
                                </div>
                            </div>
                            <div class="text-center text-xs text-slate-500 font-mono tracking-widest mt-4 opacity-50 group-hover:opacity-100 transition-opacity">
                                [ HOVER TO SCAN DETAILS ]
                            </div>
                        </div>

                        <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-slate-800 to-slate-900 border border-blue-500/30 rounded-2xl p-6 flex flex-col">
                            <div class="border-b border-slate-700 pb-2 mb-3 flex-1 overflow-y-auto">
                                <h4 class="text-xs font-bold text-blue-400 flex items-center gap-1 mb-1"><span>🎯</span> 核心优势</h4>
                                <p class="text-slate-300 text-xs leading-relaxed mb-3" x-text="tool.pros"></p>
                                
                                <h4 class="text-xs font-bold text-rose-400 flex items-center gap-1 mb-1"><span>⚠️</span> 局限须知</h4>
                                <p class="text-slate-300 text-xs leading-relaxed mb-3" x-text="tool.cons"></p>

                                <h4 class="text-xs font-bold text-emerald-400 flex items-center gap-1 mb-1"><span>💡</span> 领航员建议</h4>
                                <p class="text-slate-300 text-xs leading-relaxed" x-text="tool.advice"></p>
                            </div>
                            
                            <div class="mt-2 pt-3 border-t border-slate-700">
                                <a :href="tool.url" target="_blank" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-lg flex items-center justify-center gap-2 transition transform hover:-translate-y-0.5">
                                    <span>🌐</span> 访问资源官方站点
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </template>
        </main>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('toolMapApp', () => ({
                currentFilter: 'all',
                
                filterTags: [
                    { id: 'all', name: '全部探索', icon: '🌌' },
                    { id: 'platform', name: '顶级免费大平台', icon: '🏛️' },
                    { id: 'curriculum', name: '全球学制大纲', icon: '🌍' },
                    { id: 'tutor', name: 'AI 深度伴学', icon: '👨‍🏫' }
                ],

                tools: [
                    { 
                        name: 'Khan Academy (可汗学院)', category: 'platform', icon: '🏛️', age: '全年龄', price: '永久免费',
                        url: 'https://www.khanacademy.org/',
                        slogan: '全球公认的免费教育黄金标准',
                        pros: '涵盖从 K-12 到大学的全科。数学逻辑体系极其扎实，自带 AI 辅助和即时反馈。',
                        cons: '国内访问建议配合稳定网络。前沿科学内容目前英文较多。',
                        advice: '这是最适合作为伴学底座的资源。家长可将其作为“主食”，用 AI 进行中文讲解。'
                    },
                    { 
                        name: 'NASA Kids\' Club', category: 'platform', icon: '🚀', age: '4-12岁', price: '免费开源',
                        url: 'https://www.nasa.gov/kidsclub/index.html',
                        slogan: '让孩子从第一视角探索星辰大海',
                        pros: '权威的宇宙科学启蒙，有大量的互动小游戏、视频和真实的 STEM 动手实验手册。',
                        cons: '纯英文环境，对阅读能力有一定要求。',
                        advice: '完美契合派乐伴学的“星空”主题，适合作为自然科学课外拓展。'
                    },
                    { 
                        name: '美/加/澳 核心学制', category: 'curriculum', icon: '🌎', age: 'K-12', price: '课标开源',
                        url: 'https://www.corestandards.org/',
                        slogan: 'Common Core 州立通用核心标准',
                        pros: '美加侧重批判性思维与跨学科探究。澳洲采用四学期制。美加为秋/春双学期。',
                        cons: '各州/省有微调，衔接时需查阅具体州/省份的官方网站。',
                        advice: '海外华人家长必看。您可以根据此标准，用 AI 将国内教辅内容映射到当地大纲上。'
                    },
                    { 
                        name: '中/英 学制对比', category: 'curriculum', icon: '🇨🇳', age: 'K-12', price: '官方标准',
                        url: 'https://www.gov.uk/national-curriculum',
                        slogan: '扎实基础 vs 人文素养的平衡点',
                        pros: '中国学制理科极其深厚。英国学制在历史、文学及规则教育上极具优势。',
                        cons: '体系完全不同，建议国内家庭“理科走中国标，人文走英国标”。',
                        advice: '这是最适合做“中西合璧”规划的基础资料，利用派乐 AI 教室进行双线课程整合。'
                    },
                    { 
                        name: 'Khanmigo', category: 'tutor', icon: '👨‍🏫', age: '全年龄', price: '免费(需申请)',
                        url: 'https://www.khanacademy.org/khanmigo',
                        slogan: '最懂教育逻辑的苏格拉底式 AI 导师',
                        pros: '绝不直接给答案！它会像老师一样一步步启发孩子，培养独立解决问题的能力。',
                        cons: '需注册可汗学院账号。',
                        advice: '其教育内核与派乐伴学高度一致，是目前全球最佳的外部 AI 辅导引擎。'
                    },
                    { 
                        name: 'Epic / Raz-Plus', category: 'tutor', icon: '📚', age: '12岁以下', price: '约 $9.99/月',
                        url: 'https://www.getepic.com/',
                        slogan: '美国最大的儿童数字分级图书馆',
                        pros: '海量原版分级阅读资源，自带高质量有声书和阅读进度追踪系统。',
                        cons: '全英文环境，无中文释义。',
                        advice: '不要一上来就让孩子自己读。先从 "Read to Me" 功能开始磨耳朵，降低畏难情绪。'
                    }
                ],

                get filteredTools() {
                    if (this.currentFilter === 'all') return this.tools;
                    return this.tools.filter(tool => tool.category === this.currentFilter);
                }
            }));
        });
    </script>
</body>
</html>
