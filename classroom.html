<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XuePilot - Classroom</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #030712; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; perspective: 1000px; }
        .space-bg { position: fixed; inset: 0; z-index: -3; background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%); }
        .grid-bg { position: fixed; inset: 0; z-index: -2; background-image: linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.5; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        
        .btn-nav-class { display: flex; width: 100%; align-items: center; padding: 1rem 1.25rem; margin-bottom: 0.5rem; border-radius: 0.75rem; border: 1px solid transparent; font-size: 0.875rem; font-weight: 700; cursor: pointer; transition: all 0.3s; text-align: left; }
        .btn-nav-class:hover { background-color: rgba(30, 41, 59, 0.6); border-color: rgba(51, 65, 85, 1); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .nav-icon { width: 2.5rem; display: inline-flex; align-items: center; justify-content: flex-start; font-size: 1.25rem; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.07)); flex-shrink: 0; }
        
        /* 🚀 3D 星体与呼吸特效 (核心重制) */
        .planet-3d {
            background: radial-gradient(circle at 30% 30%, rgba(147, 197, 253, 0.9) 0%, rgba(37, 99, 235, 0.6) 40%, rgba(2, 6, 23, 0.95) 100%);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), inset 5px 5px 15px rgba(255,255,255,0.2), 0 0 20px rgba(59,130,246,0.3);
            border: 1px solid rgba(147, 197, 253, 0.3);
            border-radius: 50%;
        }
        .planet-core {
            background: radial-gradient(circle at 30% 30%, rgba(216, 180, 254, 0.9) 0%, rgba(147, 51, 234, 0.6) 40%, rgba(2, 6, 23, 0.95) 100%);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), inset 5px 5px 15px rgba(255,255,255,0.2), 0 0 30px rgba(168,85,247,0.5);
            border: 1px solid rgba(216, 180, 254, 0.3);
        }
        .planet-breath { animation: planetBreath 4s ease-in-out infinite alternate; }
        @keyframes planetBreath {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.05); filter: brightness(1.1); box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 35px rgba(59,130,246,0.6); }
        }
        
        /* 🚀 灵动连接线 */
        .galaxy-line { stroke: rgba(96, 165, 250, 0.4); stroke-width: 1.5; stroke-dasharray: 6 6; animation: dash 30s linear infinite; fill: none; }
        @keyframes dash { to { stroke-dashoffset: 1000; } }
        
        .orbit { border: 1px dashed rgba(59, 130, 246, 0.15); border-radius: 50%; position: absolute; pointer-events: none; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .planet-container { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; position: absolute; transform: translate(-50%, -50%); z-index: 10; }
        .planet-container:hover { z-index: 30; }
        
        .ql-toolbar.ql-snow { border: 1px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.9); border-radius: 1rem 1rem 0 0; padding: 10px; }
        .ql-container.ql-snow { border: 1px solid rgba(255,255,255,0.1); border-top: none; border-radius: 0 0 1rem 1rem; background: rgba(0,0,0,0.5); color: #e2e8f0; font-size: 1rem; }
        .ql-editor { min-height: 450px; line-height: 1.8; padding: 2rem; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.4); border-radius: 10px; }
        
        .nova-float { width: 64px; height: 64px; position: fixed; z-index: 100; cursor: grab; user-select: none; touch-action: none; }
        .nova-orb-inner { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb, #1e3a8a); box-shadow: 0 0 30px rgba(37, 99, 235, 0.6); display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid rgba(255,255,255,0.2); }
        .nova-chat-panel { position: fixed; width: 380px; height: 550px; z-index: 99; background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(25px); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; }
    </style>
</head>
<body x-data="classroomApp()" x-init="init()" class="flex h-screen w-screen relative overflow-hidden text-slate-200">
    <div class="space-bg"></div><div class="grid-bg"></div>

    <aside class="w-[19rem] border-r border-slate-800 flex flex-col py-8 px-4 glass-panel z-30 shrink-0 shadow-2xl relative">
        <button @click="toggleLang()" class="absolute top-6 right-6 text-xs font-bold text-slate-400 bg-slate-800/50 hover:bg-slate-700 px-2 py-1 rounded transition" x-text="lang === 'zh' ? 'EN' : '中'"></button>
        
        <button @click="goHome()" class="w-full mb-10 flex items-center justify-center gap-2 px-4 py-3 bg-slate-800/60 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300 hover:text-white transition-all shadow-sm text-xs font-bold uppercase tracking-wider group cursor-pointer">
            <span class="group-hover:-translate-x-1 transition-transform text-lg">⬅</span> <span x-text="dict.back"></span>
        </button>

        <div class="mb-8 px-3">
            <div class="font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 text-2xl tracking-tighter" x-text="dict.brand"></div>
            <div class="text-[9px] text-slate-500 font-mono tracking-widest uppercase mt-1">Multiverse Architecture</div>
        </div>

        <nav class="flex-1 overflow-y-auto mt-2 px-2 scrollbar-hide block w-full">
            
            <button @click="view = 'galaxy'" class="btn-nav-class" :class="view==='galaxy'?'bg-blue-600/20 text-blue-400 border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.15)]':'text-slate-400'">
                <span class="nav-icon">🌌</span> <span><span x-text="dict.navMap"></span></span>
            </button>
            <button @click="modals.planner = true" class="btn-nav-class" :class="modals.planner?'bg-purple-600/20 text-purple-400 border-purple-500/30 shadow-[0_0_15px_rgba(168,85,247,0.15)]':'text-slate-400'">
                <span class="nav-icon">✨</span> <span><span x-text="dict.navEngine"></span></span>
            </button>

            <div class="h-px bg-slate-800/40 my-6 mx-2 w-[90%]"></div>

            <div class="flex flex-col gap-4 w-full">
                <button @click="openReading('en')" class="btn-nav-class" :class="view==='reading-en'?'bg-indigo-600/20 text-indigo-400 border-indigo-500/30 shadow-[0_0_15px_rgba(99,102,241,0.15)]':'text-slate-400'">
                    <span class="nav-icon">📘</span> <span><span x-text="dict.navReadEn"></span></span>
                </button>
                <button @click="openReading('zh')" class="btn-nav-class" :class="view==='reading-zh'?'bg-emerald-600/20 text-emerald-400 border-emerald-500/30 shadow-[0_0_15px_rgba(16,185,129,0.15)]':'text-slate-400'">
                    <span class="nav-icon">📙</span> <span><span x-text="dict.navReadZh"></span></span>
                </button>
            </div>

            <div class="h-px bg-slate-800/40 my-6 mx-2 w-[90%]"></div>

            <button @click="view = 'writing'" class="btn-nav-class" :class="view==='writing'?'bg-orange-600/20 text-orange-400 border-orange-500/30 shadow-[0_0_15px_rgba(249,115,22,0.15)]':'text-slate-400'">
                <span class="nav-icon">✍️</span> <span><span x-text="dict.navWrite"></span></span>
            </button>

        </nav>
        
        <div class="p-4 border-t border-slate-800/50 text-[10px] font-mono text-center text-slate-500 shrink-0" x-text="dbConnected ? 'SUPABASE CONNECTED' : 'LOCAL FALLBACK'"></div>
    </aside>

    <main class="flex-1 relative overflow-hidden bg-transparent z-10">
        
        <!-- ================= 视图：星系地图 (多重宇宙核心重构) ================= -->
        <div x-show="view === 'galaxy'" x-transition.opacity.duration.500ms class="absolute inset-0 min-h-full">
            <!-- 空状态 -->
            <div x-show="galaxies.length === 0" class="absolute inset-0 flex flex-col items-center justify-center text-center opacity-40">
                <div class="text-8xl mb-4">🌌</div><p class="font-mono text-sm tracking-widest uppercase" x-text="dict.emptyMap"></p>
                <button @click="modals.planner = true" class="mt-8 px-8 py-3 bg-purple-600/20 text-purple-400 border border-purple-500/40 rounded-xl font-bold hover:bg-purple-600/30 transition shadow-lg">🚀 激活全局引擎</button>
            </div>

            <!-- 多重星系渲染 -->
            <template x-for="g in galaxies" :key="g.id">
                <div class="absolute transition-all duration-1000 ease-[cubic-bezier(0.25,1,0.5,1)]"
                     :style="g.id === activeGalaxyId ? 'left: 50%; top: 50%; transform: translate(-50%, -50%) scale(1); z-index: 20;' : `left: ${g.bgX}%; top: ${g.bgY}%; transform: translate(-50%, -50%) scale(0.2); z-index: 10; opacity: 0.6; cursor: pointer;`"
                     @click="if(g.id !== activeGalaxyId) activateGalaxy(g.id)">
                    
                    <!-- 灵动星际连线 (仅在中心向外发散) -->
                    <svg class="absolute pointer-events-none" style="width: 2000px; height: 2000px; left: -1000px; top: -1000px; z-index: 0;">
                        <template x-for="s in g.subjects" :key="s.id">
                            <line x1="1000" y1="1000" :x2="1000 + Math.cos(s.angle) * s.radius" :y2="1000 + Math.sin(s.angle) * s.radius" class="galaxy-line"></line>
                        </template>
                    </svg>

                    <!-- 轨道环 (仅激活状态显示以减少背景杂乱) -->
                    <div x-show="g.id === activeGalaxyId">
                        <template x-for="r in [200, 350, 500]">
                            <div class="orbit" :style="`width: ${r*2}px; height: ${r*2}px;`"></div>
                        </template>
                    </div>

                    <!-- 星系核心 (大纲标识) -->
                    <div class="absolute planet-core planet-breath rounded-full flex flex-col items-center justify-center border-2 border-purple-400/30 text-center shadow-2xl z-10"
                         :style="g.id === activeGalaxyId ? 'width: 140px; height: 140px; transform: translate(-50%, -50%);' : 'width: 200px; height: 200px; transform: translate(-50%, -50%);'">
                        <div class="text-3xl mb-1 drop-shadow-md">🔮</div>
                        <div class="text-[10px] font-black text-purple-200 px-3 leading-tight" x-text="g.title"></div>
                        <div x-show="g.id !== activeGalaxyId" class="mt-4 px-4 py-2 bg-blue-600 rounded-full text-xs text-white font-bold animate-pulse shadow-lg whitespace-nowrap">点击跃迁</div>
                    </div>

                    <!-- 学科行星群 -->
                    <template x-for="s in g.subjects" :key="s.id">
                        <div class="planet-container planet-breath flex flex-col items-center" 
                             :style="`left: ${Math.cos(s.angle) * s.radius}px; top: ${Math.sin(s.angle) * s.radius}px;`" 
                             @click.stop="g.id === activeGalaxyId ? openSubject(g, s) : activateGalaxy(g.id)">
                            
                            <!-- 3D星球 -->
                            <div class="w-20 h-20 planet-3d flex items-center justify-center text-4xl shadow-2xl transition hover:scale-110" x-text="s.icon"></div>
                            
                            <!-- 星球标识牌 (激活时显示真实信息，背景时显示模糊信息) -->
                            <span x-show="g.id === activeGalaxyId" class="mt-4 text-[11px] font-bold text-blue-100 bg-slate-900/80 backdrop-blur-md px-3 py-1.5 rounded-lg border border-blue-500/30 shadow-[0_5px_15px_rgba(0,0,0,0.5)] tracking-widest whitespace-nowrap" x-text="s.title"></span>
                            
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- ================= 视图：伴读书架与对话区 ================= -->
        <div x-show="view.startsWith('reading')" x-cloak class="absolute inset-0 flex flex-col p-10 overflow-y-auto fade-in">
            <div x-show="!activeBook">
                <div class="flex justify-between items-center mb-10">
                    <div class="flex items-center gap-5"><span class="text-5xl" x-text="view==='reading-en'?'📘':'📙'"></span><h2 class="text-4xl font-black text-slate-100" x-text="view==='reading-en' ? dict.navReadEn : dict.navReadZh"></h2></div>
                    <button @click="importBook()" class="px-8 py-3.5 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold shadow-[0_0_20px_rgba(37,99,235,0.4)] transition flex items-center gap-2">📥 <span x-text="dict.import"></span></button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                    <template x-for="book in filteredBooks" :key="book.id">
                        <div class="shelf-card p-8 rounded-[2.5rem] hover:border-blue-500/50 transition-all hover:-translate-y-2 shadow-2xl flex flex-col">
                            <div class="flex justify-between mb-6 items-start"><span class="text-5xl text-blue-400 opacity-90">📖</span><span class="text-[10px] font-mono text-emerald-400 bg-emerald-900/30 px-3 py-1 rounded-full border border-emerald-500/30" x-text="`${book.accuracy||0}%`"></span ></div>
                            <h3 class="font-bold text-xl mb-4 text-slate-100 line-clamp-2 leading-relaxed flex-1" x-text="book.title"></h3>
                            <div class="w-full bg-slate-800 h-1.5 rounded-full mb-8 overflow-hidden"><div class="bg-blue-500 h-full shadow-[0_0_8px_rgba(59,130,246,0.6)]" :style="`width: ${book.progress||0}%`"></div></div>
                            <button @click="startReading(book)" class="w-full py-4 bg-slate-800/80 border border-slate-700 rounded-2xl text-xs font-black tracking-widest hover:bg-blue-600 hover:border-blue-500 transition shadow-lg" x-text="dict.openBook"></button>
                        </div>
                    </template>
                </div>
            </div>

            <div x-show="activeBook" class="h-full flex gap-8 fade-in">
                <div class="w-1/2 glass-panel rounded-[2.5rem] flex flex-col overflow-hidden border border-slate-800 shadow-2xl">
                    <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                        <button @click="activeBook = null" class="text-xs bg-slate-800 px-5 py-2.5 rounded-xl hover:bg-slate-700 font-bold border border-slate-700 shadow-md">← <span x-text="dict.exit"></span></button>
                        <h3 class="font-bold text-blue-200 text-lg truncate w-64 tracking-wide" x-text="activeBook?.title"></h3>
                    </div>
                    <div class="flex-1 p-10 overflow-y-auto text-lg leading-[2.2] text-slate-300 font-serif whitespace-pre-wrap select-text" x-text="activeBook?.content"></div>
                </div>
                <div class="flex-1 glass-panel rounded-[2.5rem] flex flex-col relative border overflow-hidden shadow-2xl" :class="view==='reading-en'?'border-indigo-500/30':'border-emerald-500/30'">
                    <div class="h-16 border-b border-slate-800/50 flex items-center justify-center bg-slate-900/50">
                        <span class="uppercase text-xs font-black tracking-[0.3em] flex items-center gap-3" :class="view==='reading-en'?'text-indigo-400':'text-emerald-400'"><span class="text-2xl animate-pulse">🤖</span> <span x-text="view==='reading-en'?'NOVA English Companion':'NOVA 大语文导师'"></span></span>
                    </div>
                    <div class="flex-1 p-8 overflow-y-auto space-y-6" id="read-chat-box">
                        <template x-for="m in activeBook?.chatLog || []">
                            <div class="flex flex-col" :class="m.role==='user'?'items-end':'items-start'">
                                <span class="text-[9px] text-slate-600 font-black uppercase mb-1 tracking-widest" x-text="m.role==='user'?'Commander':'Advisor'"></span>
                                <div class="max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed shadow-lg" :class="m.role==='user'?'bg-blue-600/30 text-blue-100 border border-blue-500/30 rounded-tr-none':'bg-slate-800 text-slate-200 border border-slate-700 rounded-tl-none'" x-html="m.text"></div>
                            </div>
                        </template>
                        <div x-show="readLoading" class="text-blue-400 animate-pulse text-[10px] font-mono tracking-widest ml-2 uppercase">Analyzing Context...</div>
                    </div>
                    <div class="p-6 bg-slate-900 border-t border-slate-800 flex gap-3 shadow-[0_-10px_30px_rgba(0,0,0,0.3)]">
                        <input type="text" x-model="readInput" @keydown.enter="sendReadText()" class="flex-1 input-dark px-5 py-4 rounded-2xl text-sm" :placeholder="dict.readPlace">
                        <button @click="sendReadText()" class="px-8 py-4 bg-blue-600 rounded-2xl font-bold shadow-lg disabled:opacity-50 hover:bg-blue-500 transition">🚀</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= 视图：动态大纲编辑器 (Level 2->3->4->5) ================= -->
        <div x-show="editingSubject" x-cloak class="absolute inset-0 bg-slate-950 z-[55] p-6 flex flex-col fade-in">
            <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                <div class="flex items-center gap-5">
                    <div class="w-16 h-16 planet-3d flex items-center justify-center text-3xl shadow-xl" x-text="editingSubject?.icon"></div>
                    <div>
                        <h2 class="text-3xl font-black text-blue-300 tracking-tight" x-text="editingSubject?.title"></h2>
                        <div class="text-[10px] text-slate-500 font-mono tracking-widest uppercase mt-1" x-text="editingSubject?.region === 'CN' ? 'China Standard' : 'International Standard'"></div>
                    </div>
                </div>
                <button @click="closeSubject()" class="px-8 py-2.5 bg-slate-800 rounded-xl hover:bg-slate-700 font-bold transition text-sm border border-slate-700 shadow-md" x-text="dict.backMap"></button>
            </div>
            
            <div class="flex flex-1 gap-6 min-h-0">
                <!-- 左侧：全局排课树 -->
                <div class="w-80 flex flex-col gap-4 overflow-y-auto pr-2 scrollbar-hide">
                    <template x-for="unit in editingSubject?.units" :key="unit.id">
                        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-sm">
                            <div class="text-[10px] font-bold text-slate-500 uppercase mb-3 flex justify-between items-center border-b border-slate-800/50 pb-2">
                                <span x-text="unit.title"></span>
                                <span class="bg-blue-900/30 text-blue-400 px-1.5 py-0.5 rounded" x-text="`${unit.lessons.length}L`"></span>
                            </div>
                            <div class="space-y-2 mt-3">
                                <template x-for="lesson in unit.lessons" :key="lesson.id">
                                    <div @click="selectLesson(unit, lesson)" class="p-3 rounded-xl border border-slate-800 bg-slate-800/40 hover:border-blue-500/50 transition cursor-pointer flex justify-between items-center" :class="curLesson?.id === lesson.id ? 'border-blue-500 bg-blue-900/30 shadow-[0_0_10px_rgba(59,130,246,0.2)]' : ''">
                                        <span class="text-xs font-bold text-slate-200" x-text="lesson.title"></span>
                                        <span x-show="lesson.content" class="text-[10px] opacity-60">📝</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                    <button @click="generateUnits()" class="w-full py-5 border-2 border-dashed border-slate-800 rounded-2xl text-xs text-slate-500 hover:text-blue-400 hover:border-blue-500/50 transition font-bold bg-slate-900/20" :disabled="loading">
                        <span x-show="loading" class="animate-spin inline-block mr-2">↻</span> 
                        <span x-text="loading ? (lang==='zh'?'正在根据真实大纲查阅排课...':'Parsing true curriculum...') : (lang==='zh'?'✨ 获取官方学期大纲与课表':'✨ Fetch True Curriculum Plan')"></span>
                    </button>
                </div>

                <!-- 右侧：备课区 -->
                <div class="flex-1 glass-panel rounded-3xl p-6 flex flex-col relative bg-slate-900/40 border border-slate-800 shadow-2xl">
                    <template x-if="!curLesson">
                        <div class="flex-1 flex flex-col items-center justify-center text-slate-600 opacity-40"><div class="text-8xl mb-6">🖋️</div><p class="font-bold text-sm tracking-widest uppercase">Select a lesson to start</p></div>
                    </template>
                    <template x-if="curLesson">
                        <div class="flex flex-col h-full fade-in">
                            <div class="flex justify-between items-center mb-6 shrink-0 bg-indigo-900/10 p-4 rounded-2xl border border-indigo-500/10">
                                <div class="flex-1 mr-4">
                                    <div class="text-[10px] text-indigo-400 font-mono font-black uppercase mb-1">Active Lesson Planning</div>
                                    <input x-model="curLesson.title" class="bg-transparent text-2xl font-black border-none outline-none text-white w-full transition tracking-tight">
                                </div>
                                <button @click="generatePlan()" class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-3 rounded-xl text-xs font-bold shadow-[0_0_15px_rgba(59,130,246,0.4)] hover:scale-105 transition flex items-center gap-2" :disabled="loading">
                                    <span x-show="loading" class="animate-spin text-lg">↻</span> ✨ AI 生成苏格拉底教案
                                </button>
                            </div>
                            <div id="toolbar-container" class="shrink-0 mb-2">
                                <span class="ql-formats"><button class="ql-bold"></button><button class="ql-italic"></button><button class="ql-underline"></button></span>
                                <span class="ql-formats"><button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button></span>
                                <span class="ql-formats"><button class="ql-image"></button><button class="ql-video"></button></span>
                            </div>
                            <div id="editor-container" class="flex-1 overflow-y-auto mb-4 border border-slate-800 rounded-2xl bg-black/40"></div>
                            <div class="flex justify-end border-t border-slate-800 pt-4"><button @click="savePlan()" class="px-12 py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold shadow-lg transition text-sm flex items-center gap-2">💾 <span>同步存档至云端</span></button></div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- 🚀 弹窗：全球智能排课系统 -->
        <div x-show="modals.planner" x-cloak class="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-8 backdrop-blur-xl">
            <div class="glass-panel w-full max-w-xl rounded-3xl p-10 relative border border-purple-500/30 shadow-[0_0_50px_rgba(147,51,234,0.3)] fade-in">
                <button @click="modals.planner = false" class="absolute top-6 right-6 text-2xl text-slate-500 hover:text-white transition">✖</button>
                <div class="text-center mb-8">
                    <div class="text-6xl mb-4">🔮</div>
                    <h2 class="text-2xl font-black text-purple-400 uppercase tracking-widest" x-text="dict.planTitle"></h2>
                    <p class="text-slate-500 text-[10px] mt-2 tracking-widest uppercase">Global Standard Matrix Engine</p>
                </div>
                
                <div class="flex bg-slate-900/50 p-1.5 rounded-2xl mb-8 border border-slate-800 shadow-inner">
                    <button @click="planMode = 'standard'" class="flex-1 py-3 text-xs font-bold rounded-xl transition" :class="planMode === 'standard' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-500'">官方真题大纲</button>
                    <button @click="planMode = 'custom'" class="flex-1 py-3 text-xs font-bold rounded-xl transition" :class="planMode === 'custom' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-500'">自由主题建模</button>
                </div>

                <div class="space-y-6">
                    <template x-if="planMode === 'standard'">
                        <div class="space-y-4 fade-in">
                            <select x-model="planConfig.curriculum" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl text-sm outline-none text-slate-200 focus:border-purple-500 transition">
                                <template x-for="c in dict.curries"><option :value="c" x-text="c"></option></template>
                            </select>
                            <div class="grid grid-cols-2 gap-4">
                                <select x-model="planConfig.grade" class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-sm outline-none text-slate-200 focus:border-blue-500 transition"><template x-for="g in dict.grades"><option :value="g" x-text="g"></option></template></select>
                                <select x-model="planConfig.term" class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-sm outline-none text-slate-200 focus:border-blue-500 transition"><template x-for="t in dict.terms"><option :value="t" x-text="t"></option></template></select>
                            </div>
                        </div>
                    </template>
                    <template x-if="planMode === 'custom'">
                        <div class="fade-in">
                            <input type="text" x-model="customTheme" placeholder="例如：少儿AI启蒙、机器人学、达芬奇艺术..." class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl text-sm text-slate-200 outline-none focus:border-purple-500 transition shadow-inner">
                        </div>
                    </template>

                    <button @click="generateSemesterMap()" class="w-full py-5 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 rounded-2xl font-bold shadow-[0_0_20px_rgba(147,51,234,0.3)] flex items-center justify-center gap-3 transition text-white text-base tracking-widest" :disabled="loading">
                        <span x-show="loading" class="animate-spin text-xl">↻</span> <span x-text="loading ? '正在链接多重宇宙计算节点...' : '🚀 缔造新宇宙星系'"></span>
                    </button>
                    <button x-show="galaxies.length > 0 && !loading" @click="clearGalaxies()" class="w-full py-2 text-rose-500 text-[10px] font-bold uppercase tracking-widest underline mt-2 bg-transparent opacity-50 hover:opacity-100 transition">Reset Universe (危险操作)</button>
                </div>
            </div>
        </div>

        <!-- 🤖 NOVA 悬浮导师 -->
        <div id="nova-draggable" class="nova-float" :style="`left: ${novaPos.x}px; top: ${novaPos.y}px;`" @mousedown="startNovaDrag($event)" @touchstart="startNovaDrag($event)" @click="toggleNovaChat()">
            <div class="nova-orb-inner shadow-blue-600/40">🤖</div>
        </div>
        <div x-show="novaOpen" x-transition.origin.bottom.right class="nova-chat-panel border border-blue-500/30" :style="`left: ${Math.min(Math.max(20, novaPos.x), window.innerWidth-400)}px; top: ${Math.max(20, novaPos.y-560)}px;`" @click.away="novaOpen = false">
            <div class="p-5 bg-blue-900/40 border-b border-blue-500/30 flex justify-between items-center"><span class="text-[10px] font-black uppercase text-blue-300 tracking-widest">Nova Navigator</span><button @click="novaOpen = false" class="text-slate-500 hover:text-white transition text-lg">✖</button></div>
            <div class="flex-1 p-6 overflow-y-auto space-y-5 text-sm scrollbar-hide" id="nova-chat-box">
                <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 leading-relaxed text-slate-300 shadow-sm">指挥官，我是 NOVA。可以在教室里随时拖拽和呼叫我。</div>
                <template x-for="m in novaMsgs"><div class="flex flex-col fade-in" :class="m.role==='user'?'items-end':'items-start'"><div class="max-w-[85%] p-4 rounded-2xl mt-2 shadow-lg leading-relaxed text-sm" :class="m.role==='user'?'bg-blue-600 text-white rounded-tr-none':'bg-slate-800 border border-slate-700 text-slate-200 rounded-tl-none'" x-html="m.content"></div></div></template>
            </div>
            <div class="p-5 border-t border-slate-800 bg-slate-900 flex gap-3"><input type="text" x-model="novaInput" @keydown.enter="novaAsk()" class="flex-1 input-dark p-4 rounded-2xl text-sm" placeholder="输入疑惑或指令..."><button @click="novaAsk()" class="bg-blue-600 px-6 py-4 rounded-2xl hover:bg-blue-500 transition shadow-lg">🚀</button></div>
        </div>
    </main>

    <script>
        function classroomApp() {
            return {
                lang: localStorage.getItem('xp_lang') || 'zh', isPro: localStorage.getItem('xp_is_pro') === 'true',
                view: 'galaxy', loading: false, modals: { planner: false },
                
                // 🚀 多重宇宙状态架构
                galaxies: [], activeGalaxyId: null,
                
                planMode: 'standard', planConfig: { curriculum: '', grade: '', term: '' }, customTheme: '',
                editingSubject: null, curLesson: null,
                
                // 伴读状态
                books: [ 
                    { id: 'b1', title: 'The Little Prince (Chapter 1)', lang: 'en', progress: 45, accuracy: 88, content: 'Once when I was six years old I saw a magnificent picture in a book...', chatLog: [] }, 
                    { id: 'b2', title: '《西游记》第一回：灵根育孕源流出', lang: 'zh', progress: 20, accuracy: 82, content: '混沌未分天地乱，茫茫渺渺无人见...', chatLog: [] }
                ],
                activeBook: null, readInput: '', readLoading: false,
                
                novaOpen: false, novaInput: '', novaMsgs: [], novaPos: {x: window.innerWidth - 100, y: window.innerHeight - 100}, isDragging: false, start: {x:0,y:0}, offset: {x:0,y:0},
                supaClient: null, dbConnected: false,

                i18n: {
                    zh: {
                        brand: 'XuePilot PRO', back: '返回主控舱', navMap: '多元宇宙星系', navEngine: '全球大纲解析引擎', navWrite: 'AI 启发写作', navReadEn: '英文智能伴读', navReadZh: '大语文传承',
                        emptyMap: '星系空旷，请激活排课引擎缔造知识宇宙。', planTitle: '智能排课引擎',
                        curries: ['中国义务教育课标 (2022版)', 'US Common Core State Standards', 'UK National Curriculum', 'Singapore MOE Syllabus'],
                        grades: ['一年级', '二年级', '三年级', '四年级', '五年级', '六年级'], terms: ['上学期', '下学期'],
                        backMap: '返回多元宇宙', openBook: '开启深度阅读', import: '导入档案', exit: '退出阅读', readPlace: '探讨核心思想...'
                    },
                    en: {
                        brand: 'XuePilot PRO', back: 'Return', navMap: 'Multiverse Galaxies', navEngine: 'Curriculum Engine', navWrite: 'Writing Lab', navReadEn: 'English Tutor', navReadZh: 'Chinese Heritage',
                        emptyMap: 'Multiverse is empty. Activate engine to forge galaxies.', planTitle: 'Scheduling Engine',
                        curries: ['CN MOE Curriculum (2022)', 'US Common Core State Standards', 'UK National Curriculum', 'Singapore MOE Syllabus'],
                        grades: ['Grade 1', 'Grade 2', 'Grade 3', 'Grade 4', 'Grade 5', 'Grade 6'], terms: ['Term 1', 'Term 2'],
                        backMap: 'Back to Multiverse', openBook: 'Deep Reading', import: 'Import', exit: 'Exit', readPlace: 'Explore ideas...'
                    }
                },
                get dict() { return this.i18n[this.lang]; },
                get filteredBooks() { return this.books.filter(b => b.lang === (this.view === 'reading-en' ? 'en' : 'zh')); },
                get subjects() { return this.galaxies.find(g => g.id === this.activeGalaxyId)?.subjects || []; },

                async init() {
                    if(!this.isPro) window.location.href = 'index.html';
                    this.planConfig.curriculum = this.dict.curries[0]; this.planConfig.grade = this.dict.grades[2]; this.planConfig.term = this.dict.terms[0];
                    const url = localStorage.getItem('xp_supa_url'), key = localStorage.getItem('xp_supa_key');
                    if (url && key && window.supabase) {
                        try { this.supaClient = window.supabase.createClient(url, key); this.dbConnected = true; await this.loadFromCloud(); } catch (e) { this.fallbackLoad(); }
                    } else { this.fallbackLoad(); }
                },

                // 🚀 数据迁移与读取
                async loadFromCloud() {
                    try { const { data, error } = await this.supaClient.from('user_data').select('data').eq('id', 'commander_1').single();
                        if (!error && data?.data) this.applyLoadedData(data.data);
                    } catch (e) { this.fallbackLoad(); }
                },
                fallbackLoad() { 
                    const s = localStorage.getItem('xp_galaxies') || localStorage.getItem('xp_subjects'); 
                    if(s) {
                        let parsed = JSON.parse(s);
                        if (Array.isArray(parsed) && parsed.length > 0 && !parsed[0].subjects) {
                            // 旧版数据迁移
                            this.applyLoadedData({ subjects: parsed, books: this.books });
                        } else {
                            this.applyLoadedData({ galaxies: parsed, books: this.books });
                        }
                    }
                },
                applyLoadedData(data) {
                    if (data.galaxies) {
                        this.galaxies = data.galaxies;
                    } else if (data.subjects && data.subjects.length > 0) {
                        // 封装遗留数据为一个星系
                        this.galaxies = [{
                            id: 'gal_legacy', title: 'Legacy Universe', region: 'CN',
                            bgX: 50, bgY: 50, subjects: data.subjects
                        }];
                    }
                    this.books = data.books || this.books;
                    if(this.galaxies.length > 0 && !this.activeGalaxyId) this.activeGalaxyId = this.galaxies[0].id;
                },
                async sync() { 
                    if (this.supaClient) await this.supaClient.from('user_data').upsert({ id: 'commander_1', data: { galaxies: this.galaxies, books: this.books } });
                    localStorage.setItem('xp_galaxies', JSON.stringify(this.galaxies));
                },

                goHome() { window.location.href = 'index.html'; },
                toggleLang() { this.lang = this.lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('xp_lang', this.lang); },
                openReading(lang) { this.view = 'reading-' + lang; this.activeBook = null; },
                
                activateGalaxy(gid) { this.activeGalaxyId = gid; },

                extractJSONArray(str) { const s = str.indexOf('['), e = str.lastIndexOf(']'); return (s !== -1 && e !== -1) ? str.substring(s, e + 1) : '[]'; },

                async callAI(prompt, type = 'sys', customSys = null) {
                    const key = localStorage.getItem(`xp_${type}_key`) || localStorage.getItem('xp_sys_key');
                    const url = (localStorage.getItem(`xp_${type}_url`) || localStorage.getItem('xp_sys_url') || '/proxy/groq') + '/chat/completions';
                    const model = localStorage.getItem(`xp_${type}_model`) || localStorage.getItem('xp_sys_model') || 'llama-3.3-70b-versatile';
                    if(!key) { Swal.fire('Error', 'Missing API Key in Portal', 'warning'); return null; }
                    let sysMsg = customSys || 'You are an elite Socratic educator. NEVER give answers.';
                    try {
                        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, body: JSON.stringify({ model: model, messages: [{ role: 'system', content: sysMsg }, { role: 'user', content: prompt }] }) });
                        if(!res.ok) throw new Error();
                        const data = await res.json(); return data.choices[0].message.content;
                    } catch(e) { Swal.fire('请求失败', '网络或 API 接口存在异常', 'error'); return null; }
                },

                // 伴读对话逻辑
                async sendReadText() {
                    const t = this.readInput.trim(); if(!t || this.readLoading) return;
                    this.readInput = ''; this.activeBook.chatLog.push({ role: 'user', text: t }); this.readLoading = true;
                    this.$nextTick(() => { const b = document.getElementById('read-chat-box'); b.scrollTop = b.scrollHeight; });

                    const isEn = this.activeBook.lang === 'en';
                    const sysMsg = isEn ? "You are a Socratic English Tutor. Use the provided text to guide the student. 1. NEVER give direct answers. 2. End with an open-ended question. 3. STRICTLY English." : "你是一位苏格拉底大语文导师。1. 绝不直给答案。 2. 结尾必须抛出一个深刻的问题引导思考。 3. 必须全部使用中文。";
                    
                    const prompt = `Text Material:\n${this.activeBook.content.substring(0, 1500)}\n\nStudent says: ${t}`;
                    const res = await this.callAI(prompt, 'nova', sysMsg);
                    if(res) { this.activeBook.chatLog.push({ role: 'nova', text: res.replace(/\n/g, '<br>') }); this.sync(); }
                    this.readLoading = false;
                    this.$nextTick(() => { const b = document.getElementById('read-chat-box'); b.scrollTop = b.scrollHeight; });
                },

                startReading(book) { this.activeBook = book; if(this.activeBook.chatLog.length === 0) { this.activeBook.chatLog.push({ role: 'nova', text: this.lang === 'en' ? "Welcome, Commander. I've analyzed this piece. What intrigues you the most?" : "欢迎指挥官。我已经解析了这份卷宗，你对文中的哪个细节最感兴趣？" }); } },

                // 🚀 全局宏观建图 (创造一个星系)
                async generateSemesterMap() {
                    this.loading = true;
                    const isIntl = !this.planConfig.curriculum.includes('中国');
                    const targetLang = isIntl ? 'English' : 'Chinese';
                    const context = this.planMode === 'standard' ? `【${this.planConfig.curriculum}】在【${this.planConfig.grade}】` : `自定义探索领域：【${this.customTheme}】`;
                    
                    const prompt = `[FATAL CONSTRAINT]: Output STRICTLY in ${targetLang}.
作为全球顶尖教育大纲专家，请严格遵循${context}的官方最新课程标准（或逻辑结构）。
要求：
1. 输出该学期官方规定的所有核心标准学科（Subjects）。
2. 学科数量由该国真实大纲决定，不要自行增减或生搬硬套（例如中国课标必须有“语文”“道德与法治”等，决不能有机翻的“社会课”；美国课标必须包含 Language Arts 等原生术语）。
必须返回严格JSON格式: [{"title": "学科官方原生名称", "icon": "单字符emoji"}]`;

                    const res = await this.callAI(prompt);
                    if (res) {
                        try {
                            const parsed = JSON.parse(this.extractJSONArray(res));
                            const newGalaxy = {
                                id: `gal_${Date.now()}`,
                                title: this.planMode === 'standard' ? `${this.planConfig.grade} ${this.planConfig.curriculum.split(' ')[0]}` : this.customTheme,
                                region: isIntl ? 'INTL' : 'CN',
                                bgX: 10 + Math.random() * 80, // 星系深空散布 X 坐标 (10% - 90%)
                                bgY: 10 + Math.random() * 80, // 星系深空散布 Y 坐标
                                subjects: parsed.map((s,i)=>({ ...s, id: `sub_${Date.now()}_${i}`, radius: 220 + (Math.floor(i/3)*150), angle: (i*(Math.PI*2/Math.max(parsed.length, 1))) + Math.random()*0.2, units:[] }))
                            };
                            
                            this.galaxies.push(newGalaxy);
                            this.activeGalaxyId = newGalaxy.id;
                            await this.sync(); this.modals.planner = false;
                        } catch(e) { Swal.fire('Error', '格式解析失败，大模型返回异常', 'error'); }
                    }
                    this.loading = false;
                },

                openSubject(g, s) { this.editingSubject = { ...s, region: g.region }; this.curLesson = null; window.quillEditor = null; },
                closeSubject() { if(this.curLesson) this.savePlan(); this.editingSubject = null; },

                // 🚀 中微观拆解
                async generateUnits() {
                    this.loading = true;
                    const targetLang = this.editingSubject.region === 'INTL' ? 'English' : 'Chinese';
                    
                    const prompt = `[FATAL CONSTRAINT]: Output STRICTLY in ${targetLang}.
作为该地区的教育大纲编制专家，请严格根据该地区的官方最新教学大纲，为《${this.editingSubject.title}》科目规划完整的学期教学计划。
要求：
1. 单元(Units)和课时(Lessons)的数量必须严格符合该地区该学期的实际教学周数和标准课时量。
2. 内容必须系统、完整，不要遗漏官方大纲要求的核心知识点。
必须返回严格JSON格式: [{"title": "单元或周次名称: 主题", "lessons": [{"title": "课时具体名称"}]}]`;

                    const res = await this.callAI(prompt);
                    if (res) {
                        try {
                            const parsed = JSON.parse(this.extractJSONArray(res));
                            this.editingSubject.units = parsed.map((u, i) => ({ 
                                ...u, 
                                id: `unit_${i}_${Date.now()}`, 
                                lessons: u.lessons.map((l, j) => ({ ...l, id: `les_${i}_${j}_${Date.now()}`, content: '' })) 
                            }));
                            
                            // 更新当前活跃星系中的学科
                            const gIdx = this.galaxies.findIndex(g => g.id === this.activeGalaxyId);
                            if(gIdx !== -1) {
                                const sIdx = this.galaxies[gIdx].subjects.findIndex(s => s.id === this.editingSubject.id);
                                if(sIdx !== -1) {
                                    this.galaxies[gIdx].subjects[sIdx].units = this.editingSubject.units;
                                    await this.sync();
                                }
                            }
                            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: this.lang==='zh'?'真实大纲已下载并入库':'Curriculum synced', showConfirmButton: false, timer: 2000 });
                        } catch(e) {
                            Swal.fire('Error', this.lang==='zh'?'由于真实大纲数据过于庞大，大模型生成可能截断。请换个更强力的节点或重试。':'Failed to parse full curriculum. Try again.', 'error');
                        }
                    }
                    this.loading = false;
                },

                selectLesson(unit, lesson) {
                    if (this.curLesson && window.quillEditor) this.curLesson.content = window.quillEditor.root.innerHTML;
                    this.curLesson = lesson;
                    this.$nextTick(() => {
                        if (!window.quillEditor) window.quillEditor = new Quill('#editor-container', { theme: 'snow', modules: { toolbar: '#toolbar-container' } });
                        window.quillEditor.root.innerHTML = lesson.content || '';
                    });
                },

                async generatePlan() {
                    this.loading = true;
                    const targetLang = this.editingSubject.region === 'INTL' ? 'English' : 'Chinese';
                    const prompt = `[FATAL CONSTRAINT]: Output STRICTLY in ${targetLang}.\nCreate a Socratic lesson plan for "${this.curLesson.title}".\nHTML only (h3, ul, li, p). No markdown wrapper. Never give direct answers, use 3 questions to end.`;
                    const res = await this.callAI(prompt);
                    if (res) { window.quillEditor.root.innerHTML = res.replace(/```html/gi,'').replace(/```/gi,'').trim(); this.curLesson.content = window.quillEditor.root.innerHTML; }
                    this.loading = false;
                },

                savePlan() {
                    if (window.quillEditor) this.curLesson.content = window.quillEditor.root.innerHTML;
                    
                    const gIdx = this.galaxies.findIndex(g => g.id === this.activeGalaxyId);
                    if(gIdx !== -1) {
                        const sIdx = this.galaxies[gIdx].subjects.findIndex(s => s.id === this.editingSubject.id);
                        if(sIdx !== -1) {
                            this.galaxies[gIdx].subjects[sIdx].units = this.editingSubject.units;
                            this.sync(); 
                        }
                    }
                    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Saved to Database', showConfirmButton: false, timer: 1500 });
                },

                clearGalaxies() {
                    Swal.fire({ title: '引爆宇宙', text: '确认清除所有星系数据？此操作不可逆！', icon: 'warning', showCancelButton: true, background: '#0f172a', color: '#fff' }).then(res => {
                        if(res.isConfirmed) { this.galaxies = []; this.activeGalaxyId = null; this.sync(); this.modals.planner = false; }
                    });
                },

                // NOVA 拖拽
                startNovaDrag(e) {
                    if(e.type==='mousedown') e.preventDefault();
                    this.isDragging = false;
                    const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX, cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    this.start = {x:cx, y:cy}; this.offset = {x: cx - this.novaPos.x, y: cy - this.novaPos.y};
                    const move = (ev) => {
                        const mx = ev.type.includes('touch') ? ev.touches[0].clientX : ev.clientX, my = ev.type.includes('touch') ? ev.touches[0].clientY : ev.clientY;
                        if (Math.hypot(mx - this.start.x, my - this.start.y) > 5) { this.isDragging = true; this.novaPos.x = mx - this.offset.x; this.novaPos.y = my - this.offset.y; }
                    };
                    const stop = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); window.removeEventListener('touchmove', move); window.removeEventListener('touchend', stop); };
                    window.addEventListener('mousemove', move, {passive:false}); window.addEventListener('mouseup', stop); window.addEventListener('touchmove', move, {passive:false}); window.addEventListener('touchend', stop);
                },
                toggleNovaChat() { if(!this.isDragging) this.novaOpen = !this.novaOpen; this.isDragging = false; },
                async novaAsk() {
                    const q = this.novaInput.trim(); if(!q) return;
                    this.novaInput = ''; this.novaMsgs.push({role:'user', content: q}); this.loading = true;
                    const res = await this.callAI(q, 'nova', "You are NOVA, a Socratic Navigator. Guide thinking, never give answers.");
                    if(res) { this.novaMsgs.push({role:'assistant', content: res}); this.$nextTick(() => { const b = document.getElementById('nova-chat-box'); b.scrollTop = b.scrollHeight; }); }
                    this.loading = false;
                }
