<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XuePilot - Explorer Deck</title>
    <!-- PWA -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22XuePilot%20Explorer%22%2C%22short_name%22%3A%22Explorer%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23020617%22%2C%22theme_color%22%3A%22%23020617%22%7D">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #02040a; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; margin: 0; perspective: 1000px; }
        .glass-panel { background: rgba(10, 15, 30, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        
        .planet-3d, .planet-core { will-change: transform, box-shadow; backface-visibility: hidden; transform: translateZ(0); border-radius: 50%; position: relative; transition: transform 0.3s ease; }
        .planet-3d { background: radial-gradient(circle at 35% 35%, rgba(147, 197, 253, 1) 0%, rgba(37, 99, 235, 0.8) 45%, rgba(2, 6, 23, 0.95) 100%); border: 1px solid rgba(147, 197, 253, 0.4); }
        .planet-breath { animation: planetBreath 4s ease-in-out infinite alternate; }
        @keyframes planetBreath { from { box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 15px rgba(59,130,246,0.2); transform: scale(1); } to { box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 40px rgba(59,130,246,0.7); transform: scale(1.05); } }

        .planet-core { background: radial-gradient(circle at 35% 35%, #fffbeb 0%, #fde68a 20%, #f59e0b 45%, #9333ea 85%, #020617 100%); border: 1px solid rgba(253, 230, 138, 0.5); }
        .core-breath { animation: coreBreath 3s ease-in-out infinite alternate; }
        @keyframes coreBreath { from { box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 30px rgba(245, 158, 11, 0.5); transform: scale(1); } to { box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 120px rgba(147, 51, 234, 0.8); transform: scale(1.05); } }
        .planet-core:hover { transform: scale(1.15) !important; animation-play-state: paused; z-index: 50; }
        
        .orbit { border: 1px dashed rgba(59, 130, 246, 0.15); border-radius: 50%; position: absolute; pointer-events: none; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .no-select { user-select: none; -webkit-user-select: none; }
        .input-dark { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; outline: none; }
        
        /* 🚀 修复：引力丝线样式 */
        .galaxy-line { stroke: rgba(59, 130, 246, 0.2); stroke-width: 1.5; stroke-dasharray: 4; }

        #bg-starfield { position: fixed; inset: 0; z-index: -3; pointer-events: none; background: #02040a; }
        #network-canvas { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
    <script>
        window.safeStorage = {
            memory: {}, get(key) { try { return window.localStorage.getItem(key) || this.memory[key] || null; } catch(e) { return this.memory[key] || null; } },
            set(key, value) { this.memory[key] = value; try { window.localStorage.setItem(key, value); } catch(e) {} }
        };
    </script>
</head>
<body x-data="explorerApp()" x-init="init()" class="flex h-screen w-screen relative overflow-hidden text-slate-200">

    <canvas id="bg-starfield"></canvas>

    <!-- 🚀 返回主页按钮 (防误解版) -->
    <div @click="goHome()" class="absolute top-6 left-6 z-40 flex items-center gap-4 bg-slate-900/60 backdrop-blur-md p-3 rounded-2xl border border-slate-700 shadow-xl cursor-pointer hover:bg-slate-800 transition group">
        <button class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center group-hover:bg-slate-700 transition border border-slate-600 shadow-inner">🏠</button>
        <div>
            <div class="text-[10px] text-blue-400 font-mono tracking-widest uppercase">XuePilot Explorer</div>
            <div class="font-bold text-sm tracking-wide">返回主页面</div>
        </div>
    </div>

    <main class="flex-1 relative overflow-hidden bg-transparent z-10 w-full h-full">
        
        <!-- ================= 视图：3D 宇宙航线漫游 (遵循白皮书物理法则) ================= -->
        <div class="absolute inset-0 min-h-full no-select cursor-move" id="galaxy-viewport"
             @mousedown="startPan" @touchstart="startPan"
             @mousemove.window="doPan" @mouseup.window="endPan" 
             @touchmove.window="doPan" @touchend.window="endPan">
            
            <canvas id="network-canvas"></canvas>

            <!-- 空状态 -->
            <div x-show="galaxies.length === 0" class="absolute inset-0 flex flex-col items-center justify-center text-center opacity-40 pointer-events-none">
                <div class="text-8xl mb-4">🌌</div><p class="font-mono text-sm tracking-widest uppercase">等待指挥官 (家长) 部署星系任务...</p>
            </div>

            <!-- 星系容器：移除了全局 translate，实现真正的物理隔离 -->
            <div class="absolute w-full h-full pointer-events-none">
                <template x-for="g in galaxies" :key="g.id">
                    <!-- 🚀 独立星系根节点：仅对激活的星系应用 panX 和 panY -->
                    <div class="absolute flex items-center justify-center w-0 h-0 group transition-all ease-[cubic-bezier(0.25,1,0.5,1)]"
                         :class="[g.id !== activeGalaxyId ? 'pointer-events-auto' : 'pointer-events-none', isPanning && g.id === activeGalaxyId ? 'duration-0' : 'duration-1000']"
                         :style="g.id === activeGalaxyId 
                                 ? `left: 50%; top: 50%; transform: translate(${panX}px, ${panY}px) scale(1); z-index: 20; opacity: 1;` 
                                 : `left: ${g.bgX}%; top: ${g.bgY}%; transform: translate(0px, 0px) scale(0.12); z-index: 10; opacity: 0.6; cursor: pointer;`"
                         @click="if(g.id !== activeGalaxyId) activateGalaxy(g.id)">
                        
                        <!-- 🚀 逆向物理缩放名牌：scale(8.333) 抵消 0.12 缩放 -->
                        <div x-show="g.id !== activeGalaxyId" class="absolute opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none z-50 flex flex-col items-center" style="transform: scale(8.333); transform-origin: bottom center; bottom: 140px;">
                            <span class="bg-slate-900/95 text-amber-300 px-4 py-1.5 rounded-xl border border-amber-500/50 shadow-[0_0_20px_rgba(245,158,11,0.8)] text-xs font-black tracking-widest uppercase flex items-center gap-2 whitespace-nowrap"><span class="text-base animate-pulse">🔥</span> <span x-text="g.title"></span></span>
                            <div class="w-px h-6 bg-gradient-to-b from-amber-500/50 to-transparent mt-1"></div>
                        </div>

                        <!-- 引力背景圆 (仅激活) -->
                        <div x-show="g.id === activeGalaxyId" class="absolute rounded-full border-2 border-dashed border-blue-500/20 opacity-100 shadow-[inset_0_0_100px_rgba(59,130,246,0.1)]" style="width: 1600px; height: 1600px; left: 0; top: 0; transform: translate(-50%, -50%);"></div>

                        <!-- 轨道 (仅激活) -->
                        <div x-show="g.id === activeGalaxyId" class="absolute" style="left: 0; top: 0;">
                            <template x-for="r in [240, 380, 520, 660]"><div class="orbit" :style="`width: ${r*2}px; height: ${r*2}px;`"></div></template>
                        </div>

                        <!-- 🚀 引力丝线 (SVG) -->
                        <svg class="absolute overflow-visible pointer-events-none" style="left: 0; top: 0; z-index: 5;">
                            <template x-for="s in g.subjects" :key="s.id">
                                <line x1="0" y1="0" :x2="Math.cos(s.angle) * s.radius" :y2="Math.sin(s.angle) * s.radius" class="galaxy-line"></line>
                            </template>
                        </svg>

                        <!-- 星系核心恒星 -->
                        <div class="absolute z-30 flex flex-col items-center justify-start pointer-events-auto" style="left: 0; top: 0; transform: translate(-50%, -50%); padding-bottom: 80px; margin-bottom: -80px;">
                            <!-- 🚀 修复：智能点击路由，如果是远方星系点击核心也执行激活 -->
                            <div class="planet-core core-breath flex flex-col items-center justify-center text-center cursor-pointer shadow-2xl"
                                 :style="g.id === activeGalaxyId ? 'width: 140px; height: 140px;' : 'width: 250px; height: 250px;'"
                                 @click.stop="g.id === activeGalaxyId ? activateGalaxy(null) : activateGalaxy(g.id)">
                                <div class="mb-1 drop-shadow-md" :class="g.id === activeGalaxyId ? 'text-4xl' : 'text-8xl'">🔮</div>
                                <div x-show="g.id === activeGalaxyId" class="text-[10px] font-black text-purple-200 px-3 leading-tight" x-text="g.title"></div>
                                <div x-show="g.id === activeGalaxyId" class="mt-2 text-[8px] text-purple-300 bg-purple-900/60 uppercase tracking-widest px-2 py-0.5 border border-purple-500/50 rounded-full shadow-lg">退回全景 🌌</div>
                            </div>
                        </div>

                        <!-- 学科行星群 -->
                        <div x-show="g.id === activeGalaxyId" class="absolute pointer-events-none" style="left:0; top:0;">
                            <template x-for="s in g.subjects" :key="s.id">
                                <div class="absolute flex flex-col items-center z-20 transition-all hover:z-40 cursor-pointer pointer-events-auto" 
                                     :style="`left: ${Math.cos(s.angle) * s.radius}px; top: ${Math.sin(s.angle) * s.radius}px; transform: translate(-50%, -50%);`" 
                                     @click.stop="openMissionLog(s)">
                                    <div class="w-20 h-20 planet-3d planet-breath flex items-center justify-center text-4xl hover:scale-110 transition-transform shadow-[0_0_30px_rgba(0,0,0,0.9)]" x-text="s.icon"></div>
                                    <span class="mt-4 text-[11px] font-bold text-blue-100 bg-slate-900/90 backdrop-blur-md px-3 py-1.5 rounded-lg border border-blue-500/30 shadow-[0_10px_25px_rgba(0,0,0,0.6)] tracking-widest whitespace-nowrap" x-text="s.title"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- ================= 任务清单侧边栏 (Mission Log) ================= -->
        <div x-show="activeSubject && !activeLesson" x-cloak class="absolute right-0 top-0 bottom-0 w-96 bg-slate-900/80 backdrop-blur-2xl border-l border-blue-500/30 shadow-[-20px_0_50px_rgba(0,0,0,0.5)] flex flex-col z-40 transform transition-transform duration-500" x-transition:enter="translate-x-full" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="translate-x-full">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-black/40">
                <div class="flex items-center gap-3">
                    <span class="text-3xl" x-text="activeSubject?.icon"></span>
                    <div>
                        <h3 class="font-black text-blue-400 text-lg tracking-tight" x-text="activeSubject?.title"></h3>
                        <div class="text-[9px] text-slate-500 font-mono tracking-widest uppercase">Mission Log</div>
                    </div>
                </div>
                <button @click="activeSubject = null" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center hover:bg-slate-700 transition text-slate-400">✖</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-hide">
                <div x-show="!activeSubject?.units || activeSubject?.units.length===0" class="text-center text-slate-600 mt-10 text-sm italic">该星球暂未配置任务，请等待指挥官部署。</div>
                <template x-for="(unit, uIdx) in activeSubject?.units" :key="unit.id">
                    <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 shadow-inner">
                        <div class="text-[10px] font-bold text-slate-500 uppercase mb-3 flex items-center gap-2"><span>📂</span> <span x-text="unit.title"></span></div>
                        <div class="space-y-2">
                            <template x-for="(lesson, lIdx) in unit.lessons" :key="lesson.id">
                                <div @click="startLessonChat(lesson)" class="p-3 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-blue-600/20 hover:border-blue-500 transition cursor-pointer flex items-center gap-3 group">
                                    <div class="w-6 h-6 rounded-full bg-slate-950 flex items-center justify-center text-[10px] font-mono text-slate-500 group-hover:text-blue-400 border border-slate-700" x-text="lIdx+1"></div>
                                    <span class="text-sm font-bold text-slate-300 group-hover:text-white flex-1 truncate" x-text="lesson.title"></span>
                                    <span class="text-xs opacity-0 group-hover:opacity-100 transition">🚀</span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- ================= 苏格拉底交互舱 (Socratic Dialog Interface) ================= -->
        <div x-show="activeLesson" x-cloak class="absolute inset-0 bg-[#030712] z-50 p-6 md:p-10 flex flex-col fade-in">
            <div class="max-w-6xl w-full mx-auto flex-1 flex flex-col h-full bg-slate-900/60 rounded-3xl border border-blue-500/30 shadow-[0_0_50px_rgba(59,130,246,0.15)] overflow-hidden backdrop-blur-md">
                
                <!-- 顶部状态栏 -->
                <div class="h-16 bg-slate-950/80 border-b border-slate-800 flex justify-between items-center px-6 shrink-0">
                    <button @click="activeLesson = null" class="text-xs font-bold text-slate-400 hover:text-white bg-slate-800 px-4 py-2 rounded-lg transition border border-slate-700 shadow-sm flex items-center gap-2">
                        <span>⬅</span> 撤离轨道
                    </button>
                    <div class="flex flex-col items-center">
                        <div class="text-[10px] text-blue-500 font-mono tracking-widest uppercase font-black">COMM LINK ACTIVE</div>
                        <h3 class="font-black text-blue-300 text-sm tracking-wide" x-text="activeLesson?.title"></h3>
                    </div>
                    <div class="w-20"></div>
                </div>

                <div class="flex-1 flex min-h-0 relative">
                    <!-- 资料库面板 -->
                    <div class="w-1/3 border-r border-slate-800 p-6 overflow-y-auto bg-black/40 scrollbar-hide" x-show="showBriefing" x-transition>
                        <div class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-4 flex justify-between">
                            <span>Mission Briefing (教案背景)</span>
                            <button @click="showBriefing = false" class="text-slate-400 hover:text-white">隐藏</button>
                        </div>
                        <div class="text-sm leading-relaxed text-slate-300 font-serif prose-invert" x-html="activeLesson?.content || '<p class=text-center text-slate-600 mt-10>尚未部署教案资料。</p>'"></div>
                    </div>

                    <!-- NOVA 对话区 -->
                    <div class="flex-1 flex flex-col bg-slate-900/20 relative">
                        <button x-show="!showBriefing" @click="showBriefing = true" class="absolute top-4 left-4 z-10 text-[10px] bg-slate-800/80 text-slate-400 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700 shadow-lg flex items-center gap-2 backdrop-blur-md">
                            <span>📖</span> 查看学习资料
                        </button>

                        <div class="flex-1 p-6 md:p-10 overflow-y-auto space-y-6 scrollbar-hide" id="chat-container">
                            <template x-for="(msg, idx) in chatLog" :key="idx">
                                <div class="flex flex-col" :class="msg.role === 'user' ? 'items-end' : 'items-start'">
                                    <span class="text-[9px] font-bold text-slate-600 mb-1 tracking-widest uppercase" x-text="msg.role === 'user' ? 'Explorer' : 'NOVA 导师'"></span>
                                    <div class="max-w-[85%] p-4 md:p-5 rounded-2xl text-sm leading-relaxed shadow-lg" 
                                         :class="msg.role === 'user' ? 'bg-blue-600/30 text-blue-100 border border-blue-500/30 rounded-tr-none' : 'bg-slate-800/80 text-slate-200 border border-slate-700 rounded-tl-none backdrop-blur-sm'">
                                        <span x-html="msg.text"></span>
                                    </div>
                                </div>
                            </template>
                            <div x-show="chatLoading" class="flex items-start">
                                <div class="bg-slate-800/50 p-4 rounded-2xl rounded-tl-none border border-slate-700 text-blue-400 text-xs font-mono animate-pulse flex items-center gap-3">
                                    <span class="text-lg">🤖</span> NOVA 正在连接智库节点...
                                </div>
                            </div>
                        </div>
                        
                        <!-- 输入区 -->
                        <div class="p-6 bg-slate-950/80 border-t border-slate-800 shrink-0">
                            <div class="flex gap-3 max-w-4xl mx-auto relative">
                                <input type="text" x-model="chatInput" @keydown.enter="sendChatMessage()" class="flex-1 input-dark px-6 py-4 rounded-2xl text-sm shadow-inner" placeholder="向 NOVA 发送你的思考..." :disabled="chatLoading">
                                <button @click="sendChatMessage()" class="px-8 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-2xl font-bold shadow-[0_0_20px_rgba(59,130,246,0.3)] transition transform hover:scale-105 active:scale-95 disabled:opacity-50 flex items-center gap-2" :disabled="chatLoading || !chatInput.trim()">
                                    🚀 <span class="hidden md:inline">发送</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        function explorerApp() {
            return {
                dbConnected: false, supaClient: null,
                galaxies: [], activeGalaxyId: null,
                panX: 0, panY: 0, isPanning: false, startX: 0, startY: 0,
                
                activeSubject: null, activeLesson: null,
                showBriefing: false, chatLog: [], chatInput: '', chatLoading: false,

                config: {
                    nova: { key: window.safeStorage.get('xp_nova_key')||'', url: window.safeStorage.get('xp_nova_url')||'/proxy/nvidia', model: window.safeStorage.get('xp_nova_model')||'google/gemma-4-31b-it' },
                    supa: { key: window.safeStorage.get('xp_supa_key')||'', url: window.safeStorage.get('xp_supa_url')||'' }
                },

                async init() {
                    const url = this.config.supa.url; const key = this.config.supa.key;
                    if (url && key && window.supabase) {
                        try { this.supaClient = window.supabase.createClient(url, key); this.dbConnected = true; await this.loadFromCloud(); } catch (e) { this.fallbackLoad(); }
                    } else { this.fallbackLoad(); }
                    window.galaxyState = this;
                },

                async loadFromCloud() {
                    try { 
                        const { data, error } = await this.supaClient.from('user_data').select('data').eq('id', 'commander_1').single();
                        if (!error && data?.data?.galaxies) this.applyLoadedData({ galaxies: data.data.galaxies });
                    } catch (e) { this.fallbackLoad(); }
                },
                fallbackLoad() { 
                    const s = window.safeStorage.get('xp_galaxies'); 
                    if(s) { 
                        const p = JSON.parse(s); 
                        if(Array.isArray(p) && p.length>0 && p[0].subjects) this.applyLoadedData({ galaxies: p }); 
                    } 
                },

                applyLoadedData(data) {
                    if (data.galaxies) this.galaxies = data.galaxies;
                    if (this.galaxies.length > 0 && !this.activeGalaxyId) {
                        this.activateGalaxy(this.galaxies[0].id);
                    }
                },
                
                async sync() { 
                    if (this.supaClient) await this.supaClient.from('user_data').upsert({ id: 'commander_1', data: { galaxies: this.galaxies } });
                    window.safeStorage.set('xp_galaxies', JSON.stringify(this.galaxies));
                },

                goHome() { window.location.href = 'index.html'; },
                
                activateGalaxy(gid) { 
                    this.activeGalaxyId = gid; this.panX = 0; this.panY = 0; this.activeSubject = null;
                },

                startPan(e) {
                    if (e.target.closest('button') || e.target.closest('.planet-core') || e.target.closest('.planet-3d') || e.target.closest('.group-hover-delay') || this.activeSubject || this.activeLesson) return;
                    this.isPanning = true;
                    const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX; 
                    const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    this.startX = cx - this.panX; this.startY = cy - this.panY;
                },
                doPan(e) {
                    if (!this.isPanning) return;
                    const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX; 
                    const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    this.panX = Math.max(-2000, Math.min(2000, cx - this.startX)); 
                    this.panY = Math.max(-2000, Math.min(2000, cy - this.startY));
                },
                endPan() { this.isPanning = false; },

                async callAI(prompt) {
                    const key = this.config.nova.key || window.safeStorage.get('xp_sys_key');
                    const url = (this.config.nova.url || window.safeStorage.get('xp_sys_url') || '/proxy/groq') + '/chat/completions';
                    const model = this.config.nova.model || window.safeStorage.get('xp_sys_model') || 'llama-3.3-70b-versatile';
                    if(!key) { Swal.fire('Error', '伴读导师引擎未配置。', 'warning'); return null; }
                    try {
                        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, body: JSON.stringify({ model: model, messages: [{ role: 'system', content: 'You are NOVA, a Socratic AI tutor.' }, { role: 'user', content: prompt }] }) });
                        if(!res.ok) throw new Error(); const data = await res.json(); return data.choices[0].message.content;
                    } catch(e) { Swal.fire('Error', '导师引擎连接失败', 'error'); return null; }
                },

                openMissionLog(subject) { this.activeSubject = subject; },
                
                startLessonChat(lesson) {
                    this.activeLesson = lesson; this.showBriefing = false;
                    if (!lesson.chatLog || lesson.chatLog.length === 0) {
                        lesson.chatLog = [{ role: 'nova', text: `欢迎登舰。关于《${lesson.title}》，我已经读取了底层教案。你觉得我们应该从哪个核心切入点开启今日的推演？` }];
                    }
                    this.chatLog = lesson.chatLog;
                    this.$nextTick(() => { const el = document.getElementById('chat-container'); if(el) el.scrollTop = el.scrollHeight; });
                },

                async sendChatMessage() {
                    const t = this.chatInput.trim(); if(!t || this.chatLoading) return;
                    this.chatInput = ''; this.chatLog.push({role: 'user', text: t}); this.chatLoading = true;
                    this.$nextTick(() => { const el = document.getElementById('chat-container'); if(el) el.scrollTop = el.scrollHeight; });
                    
                    const isEnglish = /^[A-Za-z\s]+$/.test(this.activeSubject?.title || '');
                    const sysMsg = isEnglish ? `You are a Socratic Tutor. Guide the student based ONLY on the provided lesson plan. NEVER give direct answers. End with a thought-provoking question.` : `你是一位苏格拉底导师。请仅基于提供的教案内容引导学生。绝不直接给出答案，通过比喻和反问引导。每次回复的末尾必须抛出一个能引发深度思考的问题。`;
                    
                    const prompt = `【教案背景】：\n${this.activeLesson.content || '通用知识库模式'}\n\n【角色准则】：${sysMsg}\n\n【学生发言】：${t}`;
                    
                    const reply = await this.callAI(prompt);
                    if(reply) { 
                        this.chatLog.push({role: 'nova', text: reply.replace(/\n/g, '<br>')}); 
                        this.activeLesson.chatLog = this.chatLog;
                        this.sync(); 
                        this.$nextTick(() => { const el = document.getElementById('chat-container'); if(el) el.scrollTop = el.scrollHeight; }); 
                    }
                    this.chatLoading = false;
                }
            }
        }
    </script>

    <!-- 🚀 3D 星空渲染引擎 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const bgCanvas = document.getElementById('bg-starfield');
            const bgCtx = bgCanvas.getContext('2d');
            let stars = [];
            const numStars = 800;

            function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeBg); resizeBg();

            for (let i = 0; i < numStars; i++) {
                stars.push({ x: Math.random() * 2000 - 1000, y: Math.random() * 2000 - 1000, z: Math.random() * 2000 });
            }

            function animateBg() {
                bgCtx.fillStyle = '#02040a';
                bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
                const cx = bgCanvas.width / 2; const cy = bgCanvas.height / 2;

                stars.forEach(star => {
                    star.z -= 2; 
                    if (star.z <= 0) { star.z = 2000; star.x = Math.random() * 2000 - 1000; star.y = Math.random() * 2000 - 1000; }
                    const k = 128.0 / star.z;
                    const px = star.x * k + cx; const py = star.y * k + cy;
                    const size = (1 - star.z / 2000) * 2;
                    if (px >= 0 && px <= bgCanvas.width && py >= 0 && py <= bgCanvas.height) {
                        bgCtx.fillStyle = `rgba(255, 255, 255, ${1 - star.z/2000})`;
                        bgCtx.beginPath(); bgCtx.arc(px, py, size, 0, Math.PI * 2); bgCtx.fill();
                    }
                });
                requestAnimationFrame(animateBg);
            }
            animateBg();

            const netCanvas = document.getElementById('network-canvas');
            const netCtx = netCanvas.getContext('2d');
            let dustNodes = [];
            const numDust = 60; 
            let mouse = { x: -1000, y: -1000 };

            function resizeNet() { netCanvas.width = window.innerWidth; netCanvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeNet); resizeNet();

            window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

            for (let i = 0; i < numDust; i++) {
                dustNodes.push({
                    baseAngle: Math.random() * Math.PI * 2,
                    baseRadius: 100 + Math.random() * 800,
                    speed: (Math.random() - 0.5) * 0.002,
                    x: window.innerWidth / 2, y: window.innerHeight / 2,
                    size: Math.random() * 2 + 1
                });
            }

            function animateNet() {
                netCtx.clearRect(0, 0, netCanvas.width, netCanvas.height);
                
                const appState = window.galaxyState;
                if (appState && appState.activeGalaxyId) {
                    const activeG = appState.galaxies.find(g => g.id === appState.activeGalaxyId);
                    if (!activeG) return requestAnimationFrame(animateNet);

                    const cx = netCanvas.width / 2 + appState.panX;
                    const cy = netCanvas.height / 2 + appState.panY;
                    
                    const planets = activeG.subjects.map(s => ({
                        x: cx + Math.cos(s.angle) * s.radius,
                        y: cy + Math.sin(s.angle) * s.radius,
                        isPlanet: true
                    }));
                    const core = { x: cx, y: cy, isPlanet: true };
                    
                    dustNodes.forEach(node => {
                        node.baseAngle += node.speed;
                        let targetX = cx + Math.cos(node.baseAngle) * node.baseRadius;
                        let targetY = cy + Math.sin(node.baseAngle) * node.baseRadius;
                        const dx = mouse.x - targetX; const dy = mouse.y - targetY;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 250) {
                            const force = (250 - dist) / 250;
                            targetX += (dx / dist) * force * 120; 
                        }
                        node.x += (targetX - node.x) * 0.08;
                        node.y += (targetY - node.y) * 0.08;
                        netCtx.fillStyle = 'rgba(147, 197, 253, 0.8)';
                        netCtx.beginPath(); netCtx.arc(node.x, node.y, node.size, 0, Math.PI*2); netCtx.fill();
                    });

                    const allNodes = [core, ...planets, ...dustNodes];
                    for (let i = 0; i < allNodes.length; i++) {
                        for (let j = i + 1; j < allNodes.length; j++) {
                            const n1 = allNodes[i]; const n2 = allNodes[j];
                            const dx = n1.x - n2.x; const dy = n1.y - n2.y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            const threshold = (n1.isPlanet && n2.isPlanet) ? 400 : 150;
                            if (dist < threshold) {
                                const opacity = (1 - dist / threshold) * 0.3;
                                netCtx.beginPath();
                                netCtx.moveTo(n1.x, n1.y);
                                netCtx.lineTo(n2.x, n2.y);
                                netCtx.strokeStyle = `rgba(147, 197, 253, ${opacity})`;
                                netCtx.stroke();
                            }
                        }
                    }
                }
                requestAnimationFrame(animateNet);
            }
            animateNet();
        });
    </script>
