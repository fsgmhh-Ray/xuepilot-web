<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XuePilot - Classroom</title>
    <!-- PWA: 使用 Data URI 内联 Manifest -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22XuePilot%20PRO%22%2C%22short_name%22%3A%22XuePilot%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23020617%22%2C%22theme_color%22%3A%22%23020617%22%7D">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #02040a; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; margin: 0; perspective: 1000px; }
        
        .glass-panel { background: rgba(10, 15, 30, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        
        .btn-nav-class { display: flex; width: 100%; align-items: center; padding: 1rem 1.25rem; margin-bottom: 0.5rem; border-radius: 0.75rem; border: 1px solid transparent; font-size: 0.875rem; font-weight: 700; cursor: pointer; transition: all 0.3s; text-align: left; }
        .btn-nav-class:hover { background-color: rgba(30, 41, 59, 0.8); border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.2); }
        .nav-icon { width: 2.5rem; display: inline-flex; align-items: center; justify-content: flex-start; font-size: 1.25rem; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.2)); flex-shrink: 0; }
        
        /* 🚀 3D 星体特效 (无黑框物理渲染) */
        .planet-3d, .planet-core { will-change: transform, box-shadow; backface-visibility: hidden; transform: translateZ(0); border-radius: 50%; position: relative; }
        
        .planet-3d {
            background: radial-gradient(circle at 35% 35%, rgba(147, 197, 253, 1) 0%, rgba(37, 99, 235, 0.8) 45%, rgba(2, 6, 23, 0.95) 100%);
            border: 1px solid rgba(147, 197, 253, 0.4);
        }
        .planet-breath { animation: planetBreath 4s ease-in-out infinite alternate; }
        @keyframes planetBreath {
            from { box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), inset 5px 5px 15px rgba(255,255,255,0.2), 0 0 15px rgba(59,130,246,0.2); transform: scale(1); }
            to { box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), inset 5px 5px 15px rgba(255,255,255,0.6), 0 0 40px rgba(59,130,246,0.7); transform: scale(1.05); }
        }

        /* 🚀 核心恒星：加入淡淡的高温火焰光芒 */
        .planet-core {
            background: radial-gradient(circle at 35% 35%, #fffbeb 0%, #fde68a 20%, #f59e0b 45%, #9333ea 85%, #020617 100%);
            border: 1px solid rgba(253, 230, 138, 0.5);
        }
        .core-breath { animation: coreBreath 3s ease-in-out infinite alternate; }
        @keyframes coreBreath {
            from { box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), inset 5px 5px 15px rgba(255,255,255,0.5), 0 0 30px rgba(245, 158, 11, 0.5), 0 0 60px rgba(147, 51, 234, 0.4); transform: scale(1); }
            to { box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), inset 5px 5px 15px rgba(255,255,255,0.9), 0 0 60px rgba(245, 158, 11, 0.9), 0 0 120px rgba(147, 51, 234, 0.8); transform: scale(1.05); }
        }
        
        .orbit { border: 1px dashed rgba(59, 130, 246, 0.15); border-radius: 50%; position: absolute; pointer-events: none; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        
        .ql-toolbar.ql-snow { border: 1px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.9); border-radius: 1rem 1rem 0 0; padding: 10px; }
        .ql-container.ql-snow { border: 1px solid rgba(255,255,255,0.1); border-top: none; border-radius: 0 0 1rem 1rem; background: rgba(0,0,0,0.5); color: #e2e8f0; font-size: 1rem; }
        .ql-editor { min-height: 450px; line-height: 1.8; padding: 2rem; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.4); border-radius: 10px; }
        
        .shelf-card { background: linear-gradient(135deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9)); border: 1px solid rgba(255,255,255,0.05); }
        .no-select { user-select: none; -webkit-user-select: none; }
        
        /* 画布层级 */
        #bg-starfield { position: fixed; inset: 0; z-index: -3; pointer-events: none; background: #02040a; }
        #network-canvas { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        
        /* 悬停延迟工具类 */
        .group-hover-delay:hover .hover-delay-target { opacity: 1; transform: translateY(0); transition-delay: 400ms; pointer-events: auto; }
    </style>
    
    <!-- 🚀 核心防御：虚拟存储层 -->
    <script>
        window.safeStorage = {
            memory: {},
            get(key) {
                try { return window.localStorage.getItem(key) || this.memory[key] || null; } 
                catch(e) { return this.memory[key] || null; }
            },
            set(key, value) {
                this.memory[key] = value;
                try { window.localStorage.setItem(key, value); } catch(e) {}
            }
        };
    </script>
</head>
<body x-data="classroomApp()" x-init="init()" class="flex h-screen w-screen relative overflow-hidden text-slate-200">

    <!-- 🚀 3D 飞星宇宙背景层 -->
    <canvas id="bg-starfield"></canvas>

    <aside class="w-[19rem] border-r border-slate-800 flex flex-col py-8 px-4 glass-panel z-30 shrink-0 shadow-[10px_0_30px_rgba(0,0,0,0.5)] relative">
        <button @click="toggleLang()" class="absolute top-6 right-6 text-xs font-bold text-slate-400 bg-slate-800/50 hover:bg-slate-700 px-2 py-1 rounded transition" x-text="lang === 'zh' ? 'EN' : '中'"></button>
        
        <button @click="goHome()" class="w-full mb-10 flex items-center justify-center gap-2 px-4 py-3 bg-slate-800/60 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300 hover:text-white transition-all shadow-sm text-xs font-bold uppercase tracking-wider group cursor-pointer">
            <span class="group-hover:-translate-x-1 transition-transform text-lg">⬅</span> <span x-text="dict.back"></span>
        </button>

        <div class="mb-8 px-3">
            <div class="font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 text-2xl tracking-tighter" x-text="dict.brand"></div>
            <div class="text-[9px] text-slate-500 font-mono tracking-widest uppercase mt-1">Multiverse Matrix</div>
        </div>

        <nav class="flex-1 overflow-y-auto mt-2 px-2 scrollbar-hide block w-full">
            <button @click="view = 'galaxy'" class="btn-nav-class" :class="view==='galaxy'?'bg-blue-600/20 text-blue-400 border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.15)]':'text-slate-400'">
                <span class="nav-icon">🌌</span> <span><span x-text="dict.navMap"></span></span>
            </button>
            <button @click="modals.planner = true" class="btn-nav-class" :class="modals.planner?'bg-purple-600/20 text-purple-400 border-purple-500/30 shadow-[0_0_15px_rgba(168,85,247,0.15)]':'text-slate-400'">
                <span class="nav-icon">✨</span> <span><span x-text="dict.navEngine"></span></span>
            </button>

            <div class="h-px bg-slate-800/40 my-6 mx-2 w-[90%]"></div>

            <div class="flex flex-col gap-4 w-full">
                <button @click="openReading('en')" class="btn-nav-class" :class="view==='reading-en'?'bg-indigo-600/20 text-indigo-400 border-indigo-500/30 shadow-[0_0_15px_rgba(99,102,241,0.15)]':'text-slate-400'">
                    <span class="nav-icon">📘</span> <span><span x-text="dict.navReadEn"></span></span>
                </button>
                <button @click="openReading('zh')" class="btn-nav-class" :class="view==='reading-zh'?'bg-emerald-600/20 text-emerald-400 border-emerald-500/30 shadow-[0_0_15px_rgba(16,185,129,0.15)]':'text-slate-400'">
                    <span class="nav-icon">📙</span> <span><span x-text="dict.navReadZh"></span></span>
                </button>
            </div>

            <div class="h-px bg-slate-800/40 my-6 mx-2 w-[90%]"></div>

            <button @click="view = 'writing'" class="btn-nav-class" :class="view==='writing'?'bg-orange-600/20 text-orange-400 border-orange-500/30 shadow-[0_0_15px_rgba(249,115,22,0.15)]':'text-slate-400'">
                <span class="nav-icon">✍️</span> <span><span x-text="dict.navWrite"></span></span>
            </button>
        </nav>
        
        <div class="p-4 border-t border-slate-800/50 text-[10px] font-mono text-center text-slate-500 shrink-0" x-text="dbConnected ? 'SUPABASE CONNECTED' : 'LOCAL FALLBACK'"></div>
    </aside>

    <main class="flex-1 relative overflow-hidden bg-transparent z-10">
        
        <!-- ================= 视图：多重宇宙星系 ================= -->
        <div x-show="view === 'galaxy'" x-transition.opacity.duration.500ms 
             class="absolute inset-0 min-h-full no-select cursor-move" id="galaxy-viewport"
             @mousemove.window="doPan" @mouseup.window="endPan"
             @touchmove.window="doPan" @touchend.window="endPan">
            
            <!-- 🚀 拖拽感应层 (完全响应平移计算) -->
            <div class="absolute inset-0 z-0 bg-[rgba(0,0,0,0.01)]" @mousedown="startPan" @touchstart="startPan"></div>

            <!-- 🚀 浪漫神经网 Canvas 层 -->
            <canvas id="network-canvas"></canvas>

            <!-- 空状态 -->
            <div x-show="galaxies.length === 0" class="absolute inset-0 flex flex-col items-center justify-center text-center opacity-40 pointer-events-none">
                <div class="text-8xl mb-4">🌌</div><p class="font-mono text-sm tracking-widest uppercase" x-text="dict.emptyMap"></p>
                <button @click.stop="modals.planner = true" class="mt-8 px-8 py-3 bg-purple-600/20 text-purple-400 border border-purple-500/40 rounded-xl font-bold hover:bg-purple-600/30 transition shadow-lg pointer-events-auto">🚀 激活全局引擎</button>
            </div>

            <!-- 🚀 星系容器：利用绝对定位渲染每一颗星系 -->
            <div class="absolute w-full h-full pointer-events-none">
                
                <template x-for="g in galaxies" :key="g.id">
                    <!-- 🚀 独立星系根节点 (处理位置系切换与平移) -->
                    <div class="absolute flex items-center justify-center w-0 h-0 group transition-all ease-[cubic-bezier(0.25,1,0.5,1)]"
                         :class="[g.id !== activeGalaxyId ? 'pointer-events-auto' : 'pointer-events-none', isPanning && g.id === activeGalaxyId ? 'duration-0' : 'duration-1000']"
                         :style="g.id === activeGalaxyId 
                                 ? `left: 50%; top: 50%; transform: translate(${panX}px, ${panY}px); z-index: 20; opacity: 1;` 
                                 : `left: ${g.bgX}%; top: ${g.bgY}%; transform: translate(0, 0); z-index: 10; opacity: 0.6; cursor: pointer;`"
                         @click="if(g.id !== activeGalaxyId) activateGalaxy(g.id)">
                        
                        <!-- 🚀 远距离探测雷达 (永远 100% 原生尺寸，不受星系缩放影响) -->
                        <div x-show="g.id !== activeGalaxyId" class="absolute -top-16 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none z-50 whitespace-nowrap flex flex-col items-center">
                            <span class="bg-slate-900/95 text-amber-300 px-5 py-2 rounded-2xl border border-amber-500/50 shadow-[0_0_30px_rgba(245,158,11,0.6)] text-lg font-black tracking-widest uppercase flex items-center gap-2">
                                <span class="text-2xl animate-pulse">🔥</span> <span x-text="g.title"></span>
                            </span>
                            <div class="w-1 h-6 bg-gradient-to-b from-amber-500/50 to-transparent mt-1"></div>
                        </div>

                        <!-- 🚀 星系缩放微雕层 (控制星系内部星球的整体大小) -->
                        <div class="relative flex items-center justify-center w-0 h-0 transition-transform duration-1000 ease-[cubic-bezier(0.25,1,0.5,1)]"
                             :style="g.id === activeGalaxyId ? 'transform: scale(1);' : 'transform: scale(0.12);'">
                            
                            <!-- 隐形引力结界 -->
                            <div x-show="g.id === activeGalaxyId" class="absolute rounded-full border-2 border-dashed border-blue-500/20 opacity-100 shadow-[inset_0_0_100px_rgba(59,130,246,0.1)]"
                                 style="width: 1600px; height: 1600px; left: 0; top: 0; transform: translate(-50%, -50%);"></div>

                            <!-- 轨道环 (仅激活状态显示) -->
                            <div x-show="g.id === activeGalaxyId" class="absolute" style="left: 0; top: 0;">
                                <template x-for="r in [240, 380, 520, 660]"><div class="orbit" :style="`width: ${r*2}px; height: ${r*2}px;`"></div></template>
                            </div>

                            <!-- SVG 灵动连接线层 -->
                            <svg class="absolute overflow-visible pointer-events-none" style="left: 0; top: 0; z-index: 5;">
                                <template x-for="s in g.subjects" :key="s.id">
                                    <line x1="0" y1="0" :x2="Math.cos(s.angle) * s.radius" :y2="Math.sin(s.angle) * s.radius" class="galaxy-line"></line>
                                </template>
                            </svg>

                            <!-- 星系核心恒星 (高温火焰光芒) -->
                            <div class="absolute z-30 flex flex-col items-center justify-start pointer-events-auto group-hover-delay" style="left: 0; top: 0; transform: translate(-50%, -50%); padding-bottom: 80px; margin-bottom: -80px;">
                                <div class="planet-core core-breath flex flex-col items-center justify-center text-center cursor-pointer"
                                     :style="g.id === activeGalaxyId ? 'width: 140px; height: 140px;' : 'width: 250px; height: 250px;'">
                                    <div class="mb-1 drop-shadow-md" :class="g.id === activeGalaxyId ? 'text-4xl' : 'text-8xl'">🔮</div>
                                    <div x-show="g.id === activeGalaxyId" class="text-[10px] font-black text-purple-200 px-3 leading-tight" x-text="g.title"></div>
                                </div>
                                
                                <!-- 悬停延迟控制台 (Delay 400ms) -->
                                <div x-show="g.id === activeGalaxyId" class="absolute bottom-0 flex gap-4 opacity-0 translate-y-4 transition-all duration-300 hover-delay-target pointer-events-none">
                                    <button @click.stop="editGalaxy(g)" class="w-12 h-12 bg-blue-600/80 hover:bg-blue-500 rounded-full flex items-center justify-center text-white shadow-[0_0_15px_rgba(37,99,235,0.6)] backdrop-blur-md transition border border-blue-400/50" title="编辑大纲">✏️</button>
                                    <button @click.stop="deleteGalaxy(g.id)" class="w-12 h-12 bg-rose-600/80 hover:bg-rose-500 rounded-full flex items-center justify-center text-white shadow-[0_0_15px_rgba(225,29,72,0.6)] backdrop-blur-md transition border border-rose-400/50" title="摧毁星系">🗑️</button>
                                </div>
                            </div>

                            <!-- 学科行星群 -->
                            <div x-show="g.id === activeGalaxyId" class="absolute pointer-events-none" style="left:0; top:0;">
                                <template x-for="s in g.subjects" :key="s.id">
                                    <div class="absolute flex flex-col items-center z-20 transition-all hover:z-40 cursor-pointer pointer-events-auto" 
                                         :style="`left: ${Math.cos(s.angle) * s.radius}px; top: ${Math.sin(s.angle) * s.radius}px; transform: translate(-50%, -50%);`" 
                                         @click.stop="openSubject(g, s)">
                                        
                                        <div class="w-20 h-20 planet-3d planet-breath flex items-center justify-center text-4xl hover:scale-110 transition-transform shadow-[0_0_20px_rgba(0,0,0,0.8)]" x-text="s.icon"></div>
                                        <span class="mt-4 text-[11px] font-bold text-blue-100 bg-slate-900/80 backdrop-blur-md px-3 py-1.5 rounded-lg border border-blue-500/30 shadow-[0_5px_15px_rgba(0,0,0,0.5)] tracking-widest whitespace-nowrap" x-text="s.title"></span>
                                    </div>
                                </template>
                            </div>

                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- ================= 伴读书架与对话区 ================= -->
        <div x-show="view.startsWith('reading')" x-cloak class="absolute inset-0 flex flex-col p-10 overflow-y-auto fade-in bg-[#030712]">
            <div x-show="!activeBook">
                <div class="flex justify-between items-center mb-10">
                    <div class="flex items-center gap-5"><span class="text-5xl" x-text="view==='reading-en'?'📘':'📙'"></span><h2 class="text-4xl font-black text-slate-100" x-text="view==='reading-en' ? dict.navReadEn : dict.navReadZh"></h2></div>
                    <button @click="importBook()" class="px-8 py-3.5 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold shadow-[0_0_20px_rgba(37,99,235,0.4)] transition flex items-center gap-2">📥 <span x-text="dict.import"></span></button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                    <template x-for="book in filteredBooks" :key="book.id">
                        <div class="shelf-card p-8 rounded-[2.5rem] hover:border-blue-500/50 transition-all hover:-translate-y-2 shadow-2xl flex flex-col">
                            <div class="flex justify-between mb-6 items-start"><span class="text-5xl text-blue-400 opacity-90">📖</span><span class="text-[10px] font-mono text-emerald-400 bg-emerald-900/30 px-3 py-1 rounded-full border border-emerald-500/30" x-text="`${book.accuracy||0}%`"></span ></div>
                            <h3 class="font-bold text-xl mb-4 text-slate-100 line-clamp-2 leading-relaxed flex-1" x-text="book.title"></h3>
                            <div class="w-full bg-slate-800 h-1.5 rounded-full mb-8 overflow-hidden"><div class="bg-blue-500 h-full shadow-[0_0_8px_rgba(59,130,246,0.6)]" :style="`width: ${book.progress||0}%`"></div></div>
                            <button @click="startReading(book)" class="w-full py-4 bg-slate-800/80 border border-slate-700 rounded-2xl text-xs font-black tracking-widest hover:bg-blue-600 hover:border-blue-500 transition shadow-lg" x-text="dict.openBook"></button>
                        </div>
                    </template>
                </div>
            </div>
            <div x-show="activeBook" class="h-full flex gap-8 fade-in">
                <div class="w-1/2 glass-panel rounded-[2.5rem] flex flex-col overflow-hidden border border-slate-800 shadow-2xl">
                    <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                        <button @click="activeBook = null" class="text-xs bg-slate-800 px-5 py-2.5 rounded-xl hover:bg-slate-700 font-bold border border-slate-700 shadow-md">← <span x-text="dict.exit"></span></button>
                        <h3 class="font-bold text-blue-200 text-lg truncate w-64 tracking-wide" x-text="activeBook?.title"></h3>
                    </div>
                    <div class="flex-1 p-10 overflow-y-auto text-lg leading-[2.2] text-slate-300 font-serif whitespace-pre-wrap select-text" x-text="activeBook?.content"></div>
                </div>
                <div class="flex-1 glass-panel rounded-[2.5rem] flex flex-col relative border overflow-hidden shadow-2xl" :class="view==='reading-en'?'border-indigo-500/30':'border-emerald-500/30'">
                    <div class="h-16 border-b border-slate-800/50 flex items-center justify-center bg-slate-900/50">
                        <span class="uppercase text-xs font-black tracking-[0.3em] flex items-center gap-3" :class="view==='reading-en'?'text-indigo-400':'text-emerald-400'"><span class="text-2xl animate-pulse">🤖</span> <span x-text="view==='reading-en'?'NOVA English Companion':'NOVA 大语文导师'"></span></span>
                    </div>
                    <div class="flex-1 p-8 overflow-y-auto space-y-6" id="read-chat-box">
                        <template x-for="m in activeBook?.chatLog || []">
                            <div class="flex flex-col" :class="m.role==='user'?'items-end':'items-start'">
                                <span class="text-[9px] text-slate-600 font-black uppercase mb-1 tracking-widest" x-text="m.role==='user'?'Commander':'Advisor'"></span>
                                <div class="max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed shadow-lg" :class="m.role==='user'?'bg-blue-600/30 text-blue-100 border border-blue-500/30 rounded-tr-none':'bg-slate-800 text-slate-200 border border-slate-700 rounded-tl-none'" x-html="m.text"></div>
                            </div>
                        </template>
                        <div x-show="readLoading" class="text-blue-400 animate-pulse text-[10px] font-mono tracking-widest ml-2 uppercase">Analyzing Context...</div>
                    </div>
                    <div class="p-6 bg-slate-900 border-t border-slate-800 flex gap-3 shadow-[0_-10px_30px_rgba(0,0,0,0.3)]">
                        <input type="text" x-model="readInput" @keydown.enter="sendReadText()" class="flex-1 input-dark px-5 py-4 rounded-2xl text-sm" :placeholder="dict.readPlace">
                        <button @click="sendReadText()" class="px-8 py-4 bg-blue-600 rounded-2xl font-bold shadow-lg disabled:opacity-50 hover:bg-blue-500 transition">🚀</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= 动态大纲编辑器 ================= -->
        <div x-show="editingSubject" x-cloak class="absolute inset-0 bg-[#030712] z-[55] p-6 flex flex-col fade-in">
            <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                <div class="flex items-center gap-5">
                    <div class="w-16 h-16 planet-3d flex items-center justify-center text-3xl shadow-xl" x-text="editingSubject?.icon"></div>
                    <div>
                        <h2 class="text-3xl font-black text-blue-300 tracking-tight" x-text="editingSubject?.title"></h2>
                        <div class="text-[10px] text-slate-500 font-mono tracking-widest uppercase mt-1" x-text="editingSubject?.region === 'CN' ? 'China Standard' : 'International Standard'"></div>
                    </div>
                </div>
                <button @click="closeSubject()" class="px-8 py-2.5 bg-slate-800 rounded-xl hover:bg-slate-700 font-bold transition text-sm border border-slate-700 shadow-md" x-text="dict.backMap"></button>
            </div>
            
            <div class="flex flex-1 gap-6 min-h-0">

    <!-- Alpine.js 业务逻辑 -->
    <script>
        function classroomApp() {
            return {
                lang: window.safeStorage.get('xp_lang') || 'zh', 
                isPro: window.safeStorage.get('xp_is_pro') !== 'false', 
                view: 'galaxy', loading: false, modals: { planner: false },
                
                // 🚀 多重宇宙状态架构 & 平移坐标
                galaxies: [], activeGalaxyId: null,
                panX: 0, panY: 0, isPanning: false, startX: 0, startY: 0,
                
                planMode: 'standard', planConfig: { curriculum: '', grade: '', term: '' }, customTheme: '',
                editingSubject: null, curLesson: null,
                books: [ 
                    { id: 'b1', title: 'The Little Prince', lang: 'en', progress: 45, accuracy: 88, content: 'Once when I was six years old...', chatLog: [] }
                ],
                activeBook: null, readInput: '', readLoading: false,
                supaClient: null, dbConnected: false,

                i18n: {
                    zh: { brand: 'XuePilot PRO', back: '返回主控舱', navMap: '多元宇宙星系', navEngine: '全球大纲解析引擎', navWrite: 'AI 启发写作', navReadEn: '英文智能伴读', navReadZh: '大语文传承', emptyMap: '星空寥廓，请激活排课引擎缔造你的第一个知识星系。', planTitle: '智能排课引擎', curries: ['中国义务教育课标 (2022版)', 'US Common Core State Standards', 'UK National Curriculum', 'Singapore MOE Syllabus'], grades: ['一年级', '二年级', '三年级', '四年级', '五年级', '六年级'], terms: ['上学期', '下学期'], backMap: '返回多元宇宙', openBook: '开启深度阅读', import: '导入档案', exit: '退出阅读', readPlace: '探讨...' },
                    en: { brand: 'XuePilot PRO', back: 'Return', navMap: 'Multiverse Galaxies', navEngine: 'Curriculum Engine', navWrite: 'Writing Lab', navReadEn: 'English Tutor', navReadZh: 'Chinese Heritage', emptyMap: 'Deep space. Activate engine to forge your first galaxy.', planTitle: 'Scheduling Engine', curries: ['CN MOE Curriculum (2022)', 'US Common Core State Standards', 'UK National Curriculum', 'Singapore MOE Syllabus'], grades: ['Grade 1', 'Grade 2', 'Grade 3', 'Grade 4', 'Grade 5', 'Grade 6'], terms: ['Term 1', 'Term 2'], backMap: 'Back to Multiverse', openBook: 'Deep Reading', import: 'Import', exit: 'Exit', readPlace: 'Explore...' }
                },
                get dict() { return this.i18n[this.lang]; },
                get filteredBooks() { return this.books.filter(b => b.lang === (this.view === 'reading-en' ? 'en' : 'zh')); },
                get subjects() { return this.galaxies.find(g => g.id === this.activeGalaxyId)?.subjects || []; },

                async init() {
                    this.planConfig.curriculum = this.dict.curries[0]; this.planConfig.grade = this.dict.grades[2]; this.planConfig.term = this.dict.terms[0];
                    const url = window.safeStorage.get('xp_supa_url');
                    const key = window.safeStorage.get('xp_supa_key');
                    if (url && key && window.supabase) {
                        try { this.supaClient = window.supabase.createClient(url, key); this.dbConnected = true; await this.loadFromCloud(); } catch (e) { this.fallbackLoad(); }
                    } else { this.fallbackLoad(); }

                    window.galaxyState = this;
                },

                async loadFromCloud() {
                    try { const { data, error } = await this.supaClient.from('user_data').select('data').eq('id', 'commander_1').single();
                        if (!error && data?.data) this.applyLoadedData(data.data);
                    } catch (e) { this.fallbackLoad(); }
                },
                fallbackLoad() { 
                    const s = window.safeStorage.get('xp_galaxies'); 
                    if(s) {
                        let parsed = JSON.parse(s);
                        if (Array.isArray(parsed) && parsed.length > 0 && !parsed[0].subjects) { this.applyLoadedData({ subjects: parsed, books: this.books }); } 
                        else { this.applyLoadedData({ galaxies: parsed, books: this.books }); }
                    }
                },
                applyLoadedData(data) {
                    if (data.galaxies) this.galaxies = data.galaxies;
                    else if (data.subjects && data.subjects.length > 0) this.galaxies = [{ id: 'gal_legacy', title: 'Legacy Universe', region: 'CN', bgX: 50, bgY: 50, subjects: data.subjects }];
                    this.books = data.books || this.books;
                    if(this.galaxies.length > 0 && !this.activeGalaxyId) {
                        this.activeGalaxyId = this.galaxies[0].id;
                    }
                },
                async sync() { 
                    if (this.supaClient) await this.supaClient.from('user_data').upsert({ id: 'commander_1', data: { galaxies: this.galaxies, books: this.books } });
                    window.safeStorage.set('xp_galaxies', JSON.stringify(this.galaxies));
                },

                goHome() { window.location.href = 'index.html'; },
                toggleLang() { this.lang = this.lang === 'zh' ? 'en' : 'zh'; window.safeStorage.set('xp_lang', this.lang); },
                openReading(lang) { this.view = 'reading-' + lang; this.activeBook = null; },
                
                activateGalaxy(gid) { 
                    this.activeGalaxyId = gid;
                    this.panX = 0; this.panY = 0;
                },

                // 🚀 修复拖拽联动：拖拽时只改变 activeGalaxy 的相对 panX/Y 坐标
                startPan(e) {
                    if (this.view !== 'galaxy' || e.target.closest('button') || e.target.closest('.planet-core') || e.target.closest('.planet-3d')) return;
                    this.isPanning = true;
                    const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                    const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    this.startX = cx - this.panX;
                    this.startY = cy - this.panY;
                },
                doPan(e) {
                    if (!this.isPanning) return;
                    const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                    const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    this.panX = Math.max(-1500, Math.min(1500, cx - this.startX));
                    this.panY = Math.max(-1500, Math.min(1500, cy - this.startY));
                },
                endPan() { this.isPanning = false; },

                extractJSONArray(str) { const s = str.indexOf('['), e = str.lastIndexOf(']'); return (s !== -1 && e !== -1) ? str.substring(s, e + 1) : '[]'; },
                async callAI(prompt, type = 'sys', customSys = null) {
                    const key = window.safeStorage.get(`xp_${type}_key`) || window.safeStorage.get('xp_sys_key');
                    const url = (window.safeStorage.get(`xp_${type}_url`) || window.safeStorage.get('xp_sys_url') || '/proxy/groq') + '/chat/completions';
                    const model = window.safeStorage.get(`xp_${type}_model`) || window.safeStorage.get('xp_sys_model') || 'llama-3.3-70b-versatile';
                    if(!key) { Swal.fire('Error', 'Missing API Key in Portal', 'warning'); return null; }
                    try {
                        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, body: JSON.stringify({ model: model, messages: [{ role: 'system', content: customSys || 'You are an elite Socratic educator. NEVER give answers.' }, { role: 'user', content: prompt }] }) });
                        if(!res.ok) throw new Error();
                        const data = await res.json(); return data.choices[0].message.content;
                    } catch(e) { Swal.fire('Error', 'API connection failed', 'error'); return null; }
                },

                async sendReadText() {
                    const t = this.readInput.trim(); if(!t || this.readLoading) return;
                    this.readInput = ''; this.activeBook.chatLog.push({ role: 'user', text: t }); this.readLoading = true;
                    this.$nextTick(() => { const b = document.getElementById('read-chat-box'); b.scrollTop = b.scrollHeight; });

                    const isEn = this.activeBook.lang === 'en';
                    const sysMsg = isEn ? "You are a Socratic English Tutor. Use the provided text to guide the student. 1. NEVER give direct answers. 2. End with an open-ended question. 3. STRICTLY English." : "你是一位苏格拉底大语文导师。1. 绝不直给答案。 2. 结尾必须抛出一个深刻的问题引导思考。 3. 必须全部使用中文。";
                    
                    const prompt = `Text Material:\n${this.activeBook.content.substring(0, 1500)}\n\nStudent says: ${t}`;
                    const res = await this.callAI(prompt, 'nova', sysMsg);
                    if(res) { this.activeBook.chatLog.push({ role: 'nova', text: res.replace(/\n/g, '<br>') }); this.sync(); }
                    this.readLoading = false;
                    this.$nextTick(() => { const b = document.getElementById('read-chat-box'); b.scrollTop = b.scrollHeight; });
                },

                startReading(book) { this.activeBook = book; if(this.activeBook.chatLog.length === 0) { this.activeBook.chatLog.push({ role: 'nova', text: this.lang === 'en' ? "Welcome, Commander. I've analyzed this piece. What intrigues you the most?" : "欢迎指挥官。我已经解析了这份卷宗，你对文中的哪个细节最感兴趣？" }); } },

                async generateSemesterMap() {
                    this.loading = true;
                    const isIntl = !this.planConfig.curriculum.includes('中国');
                    const targetLang = isIntl ? 'English' : 'Chinese';
                    const context = this.planMode === 'standard' ? `【${this.planConfig.curriculum}】在【${this.planConfig.grade}】` : `自定义探索领域：【${this.customTheme}】`;
                    
                    const prompt = `[FATAL CONSTRAINT]: Output STRICTLY in ${targetLang}.
                    输出该学期官方规定的所有核心标准学科（Subjects）。学科数量由该国真实大纲决定。必须返回严格JSON格式: [{"title": "学科官方原生名称", "icon": "单字符emoji"}]`;

                    const res = await this.callAI(prompt);
                    if (res) {
                        try {
                            const parsed = JSON.parse(this.extractJSONArray(res));
                            
                            // 🚀 修复双语翻译：准确提取该国家的简写
                            let gradeStr = this.planConfig.grade;
                            const toEnMap = {'一年级':'Grade 1', '二年级':'Grade 2', '三年级':'Grade 3', '四年级':'Grade 4', '五年级':'Grade 5', '六年级':'Grade 6'};
                            const toZhMap = {'Grade 1':'一年级', 'Grade 2':'二年级', 'Grade 3':'三年级', 'Grade 4':'四年级', 'Grade 5':'五年级', 'Grade 6':'六年级'};
                            if (isIntl) gradeStr = toEnMap[gradeStr] || gradeStr;
                            else gradeStr = toZhMap[gradeStr] || gradeStr;
                            
                            let currPrefix = this.planConfig.curriculum.split(' ')[0]; 
                            if (currPrefix === 'UK') currPrefix = 'GB'; // 严格对应您的需求
                            else if (!isIntl) currPrefix = '中国课标';

                            const newGalaxy = {
                                id: `gal_${Date.now()}`,
                                title: this.planMode === 'standard' ? `${gradeStr} ${currPrefix}` : this.customTheme,
                                region: isIntl ? 'INTL' : 'CN',
                                bgX: 10 + (Math.random() * 80), // 散布在 10% - 90% 空间
                                bgY: 10 + (Math.random() * 80),
                                subjects: parsed.map((s,i) => {
                                    let orbitIndex = Math.floor(i / 5); 
                                    let r = 240 + orbitIndex * 140; 
                                    let angle = (i % 5) * (Math.PI * 2 / 5) + (orbitIndex * 0.5);
                                    return { ...s, id: `sub_${Date.now()}_${i}`, radius: r, angle: angle, units:[] };
                                })
                            };
                            this.galaxies.push(newGalaxy); 
                            this.activeGalaxyId = newGalaxy.id; 
                            this.panX = 0; this.panY = 0; // 重置居中
                            await this.sync(); this.modals.planner = false;
                        } catch(e) { Swal.fire('Error', 'AI format error', 'error'); }
                    }
                    this.loading = false;
                },

                editGalaxy(g) {
                    Swal.fire({ title: 'Rename Galaxy', input: 'text', inputValue: g.title, background: '#0f172a', color: '#fff', showCancelButton: true }).then(res => { if(res.isConfirmed && res.value.trim()) { g.title = res.value.trim(); this.sync(); } });
                },
                deleteGalaxy(gid) {
                    Swal.fire({ title: 'Destroy Galaxy?', text: 'Irreversible action!', icon: 'warning', background: '#0f172a', color: '#fff', showCancelButton: true, confirmButtonColor: '#ef4444' }).then(res => {
                        if(res.isConfirmed) {
                            this.galaxies = this.galaxies.filter(x => x.id !== gid);
                            if(this.activeGalaxyId === gid) { this.activeGalaxyId = this.galaxies.length > 0 ? this.galaxies[0].id : null; this.panX = 0; this.panY = 0; }
                            this.sync();
                        }
                    });
                },

                openSubject(g, s) { this.editingSubject = { ...s, region: g.region }; this.curLesson = null; window.quillEditor = null; },
                closeSubject() { if(this.curLesson) this.savePlan(); this.editingSubject = null; },

                async generateUnits() {
                    this.loading = true;
                    const targetLang = this.editingSubject.region === 'INTL' ? 'English' : 'Chinese';
                    const prompt = `[FATAL CONSTRAINT]: Output STRICTLY in ${targetLang}.\n为《${this.editingSubject.title}》科目规划完整的学期教学计划。必须返回严格JSON格式: [{"title": "单元或周次名称", "lessons": [{"title": "课时名称"}]}]`;
                    const res = await this.callAI(prompt);
                    if (res) {
                        try {
                            const parsed = JSON.parse(this.extractJSONArray(res));
                            this.editingSubject.units = parsed.map((u, i) => ({ ...u, id: `unit_${i}_${Date.now()}`, lessons: u.lessons.map((l, j) => ({ ...l, id: `les_${i}_${j}_${Date.now()}`, content: '' })) }));
                            const gIdx = this.galaxies.findIndex(g => g.id === this.activeGalaxyId);
                            if(gIdx !== -1) { const sIdx = this.galaxies[gIdx].subjects.findIndex(s => s.id === this.editingSubject.id); if(sIdx !== -1) { this.galaxies[gIdx].subjects[sIdx].units = this.editingSubject.units; await this.sync(); } }
                            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Curriculum synced', showConfirmButton: false, timer: 2000 });
                        } catch(e) { Swal.fire('Error', 'Failed to parse full curriculum.', 'error'); }
                    }
                    this.loading = false;
                },

                selectLesson(unit, lesson) {
                    if (this.curLesson && window.quillEditor) this.curLesson.content = window.quillEditor.root.innerHTML;
                    this.curLesson = lesson;
                    this.$nextTick(() => {
                        if (!window.quillEditor) window.quillEditor = new Quill('#editor-container', { theme: 'snow', modules: { toolbar: '#toolbar-container' } });
                        window.quillEditor.root.innerHTML = lesson.content || '';
                    });
                },
                async generatePlan() {
                    this.loading = true;
                    const targetLang = this.editingSubject.region === 'INTL' ? 'English' : 'Chinese';
                    const res = await this.callAI(`[FATAL CONSTRAINT]: Output STRICTLY in ${targetLang}.\nCreate a Socratic lesson plan for "${this.curLesson.title}". HTML only.`);
                    if (res) { window.quillEditor.root.innerHTML = res.replace(/```html/gi,'').replace(/```/gi,'').trim(); this.curLesson.content = window.quillEditor.root.innerHTML; }
                    this.loading = false;
                },
                savePlan() {
                    if (window.quillEditor) this.curLesson.content = window.quillEditor.root.innerHTML;
                    const gIdx = this.galaxies.findIndex(g => g.id === this.activeGalaxyId);
                    if(gIdx !== -1) { const sIdx = this.galaxies[gIdx].subjects.findIndex(s => s.id === this.editingSubject.id); if(sIdx !== -1) { this.galaxies[gIdx].subjects[sIdx].units = this.editingSubject.units; this.sync(); } }
                    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Saved', showConfirmButton: false, timer: 1500 });
                }
            }
        }
    </script>

    <!-- 🚀 纯粹的 3D 星空与浪漫拓扑网络 Canvas 渲染引擎 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const bgCanvas = document.getElementById('bg-starfield');
            const bgCtx = bgCanvas.getContext('2d');
            let stars = [];
            const numStars = 800;

            function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeBg); resizeBg();

            for (let i = 0; i < numStars; i++) {
                stars.push({ x: Math.random() * 2000 - 1000, y: Math.random() * 2000 - 1000, z: Math.random() * 2000 });
            }

            function animateBg() {
                bgCtx.fillStyle = '#02040a';
                bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
                const cx = bgCanvas.width / 2; const cy = bgCanvas.height / 2;

                stars.forEach(star => {
                    star.z -= 2; 
                    if (star.z <= 0) { star.z = 2000; star.x = Math.random() * 2000 - 1000; star.y = Math.random() * 2000 - 1000; }
                    const k = 128.0 / star.z;
                    const px = star.x * k + cx; const py = star.y * k + cy;
                    const size = (1 - star.z / 2000) * 2;
                    if (px >= 0 && px <= bgCanvas.width && py >= 0 && py <= bgCanvas.height) {
                        bgCtx.fillStyle = `rgba(255, 255, 255, ${1 - star.z/2000})`;
                        bgCtx.beginPath(); bgCtx.arc(px, py, size, 0, Math.PI * 2); bgCtx.fill();
                    }
                });
                requestAnimationFrame(animateBg);
            }
            animateBg();

            const netCanvas = document.getElementById('network-canvas');
            const netCtx = netCanvas.getContext('2d');
            let dustNodes = [];
            const numDust = 60; 
            let mouse = { x: -1000, y: -1000 };

            function resizeNet() { netCanvas.width = window.innerWidth; netCanvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeNet); resizeNet();

            window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

            for (let i = 0; i < numDust; i++) {
                dustNodes.push({
                    baseAngle: Math.random() * Math.PI * 2,
                    baseRadius: 100 + Math.random() * 800,
                    speed: (Math.random() - 0.5) * 0.002,
                    x: window.innerWidth / 2, y: window.innerHeight / 2,
                    size: Math.random() * 2 + 1
                });
            }

            function animateNet() {
                netCtx.clearRect(0, 0, netCanvas.width, netCanvas.height);
                
                const appState = window.galaxyState;
                if (appState && appState.view === 'galaxy' && appState.activeGalaxyId) {
                    const activeG = appState.galaxies.find(g => g.id === appState.activeGalaxyId);
                    if (!activeG) return requestAnimationFrame(animateNet);

                    // SVG 线条引擎匹配当前活跃星系
                    const cx = netCanvas.width / 2 + appState.panX;
                    const cy = netCanvas.height / 2 + appState.panY;
                    
                    const planets = activeG.subjects.map(s => ({
                        x: cx + Math.cos(s.angle) * s.radius,
                        y: cy + Math.sin(s.angle) * s.radius,
                        isPlanet: true
                    }));
                    const core = { x: cx, y: cy, isPlanet: true };
                    
                    dustNodes.forEach(node => {
                        node.baseAngle += node.speed;
                        let targetX = cx + Math.cos(node.baseAngle) * node.baseRadius;
                        let targetY = cy + Math.sin(node.baseAngle) * node.baseRadius;
                        
                        const dx = mouse.x - targetX; const dy = mouse.y - targetY;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist < 250) {
                            const force = (250 - dist) / 250;
                            targetX += (dx / dist) * force * 120; 
                            targetX += (dy / dist) * force * 60;  
                            targetY -= (dx / dist) * force * 60;
                        }
                        
                        node.x += (targetX - node.x) * 0.08;
                        node.y += (targetY - node.y) * 0.08;
                        
                        netCtx.fillStyle = 'rgba(147, 197, 253, 0.8)';
                        netCtx.beginPath(); netCtx.arc(node.x, node.y, node.size, 0, Math.PI*2); netCtx.fill();
                    });

                    const allNodes = [core, ...planets, ...dustNodes];
                    
                    for (let i = 0; i < allNodes.length; i++) {
                        for (let j = i + 1; j < allNodes.length; j++) {
                            const n1 = allNodes[i]; const n2 = allNodes[j];
                            const dx = n1.x - n2.x; const dy = n1.y - n2.y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            
                            const threshold = (n1.isPlanet && n2.isPlanet) ? 400 : (n1.isPlanet || n2.isPlanet) ? 250 : 150;
                            
                            if (dist < threshold) {
                                const opacity = (1 - dist / threshold) * (n1.isPlanet || n2.isPlanet ? 0.7 : 0.3);
                                netCtx.beginPath();
                                netCtx.moveTo(n1.x, n1.y);
                                
                                const midX = (n1.x + n2.x)/2; const midY = (n1.y + n2.y)/2;
                                const mdx = mouse.x - midX; const mdy = mouse.y - midY;
                                const mdist = Math.sqrt(mdx*mdx + mdy*mdy);
                                
                                if (mdist < 200) {
                                    const bend = (200 - mdist) * 0.6;
                                    const cpX = midX - (mdx/mdist)*bend;
                                    const cpY = midY - (mdy/mdist)*bend;
                                    netCtx.quadraticCurveTo(cpX, cpY, n2.x, n2.y);
                                } else {
                                    netCtx.lineTo(n2.x, n2.y);
                                }
                                
                                netCtx.strokeStyle = `rgba(147, 197, 253, ${opacity})`;
                                netCtx.lineWidth = n1.isPlanet && n2.isPlanet ? 2 : 1;
                                netCtx.stroke();
                            }
                        }
                    }
                }
                requestAnimationFrame(animateNet);
            }
            animateNet();
        });
    </script>
</body>
</html>
