<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XuePilot - Explorer Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #02040a; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; margin: 0; perspective: 1000px; }
        .glass-panel { background: rgba(10, 15, 30, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .planet-3d, .planet-core { will-change: transform, box-shadow; backface-visibility: hidden; transform: translateZ(0); border-radius: 50%; position: relative; transition: transform 0.3s ease; }
        .planet-locked { filter: grayscale(1) opacity(0.4); cursor: not-allowed !important; }
        .energy-lock { position: absolute; font-size: 1.5rem; filter: drop-shadow(0 0 8px #ef4444); z-index: 50; animation: lockPulse 2s infinite; }
        .free-badge { position: absolute; top: -10px; right: -10px; background: #10b981; color: white; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 4px; z-index: 50; box-shadow: 0 0 10px rgba(16,185,129,0.5); }
        @keyframes lockPulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } }
        
        /* Canvas 画布层：z-index 必须在星空背景之上，星球之下 */
        #bg-starfield { position: fixed; inset: 0; z-index: -3; pointer-events: none; background: #02040a; }
        #network-canvas { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        
        .warp-overlay { position: fixed; inset: 0; z-index: 100; background: #02040a; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
    </style>
</head>
<body x-data="explorerApp()" x-init="init()" class="flex h-screen w-screen relative overflow-hidden text-slate-200">

    <div id="class-loader" class="warp-overlay">
        <div class="text-center">
            <div class="w-12 h-12 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mb-6 mx-auto"></div>
            <div class="text-blue-400 font-mono tracking-[0.5em] animate-pulse text-xs uppercase">Linking Dimension...</div>
        </div>
    </div>
    <script>
        setTimeout(() => {
            const l = document.getElementById('class-loader');
            if(l) { l.style.opacity = '0'; setTimeout(()=>l.style.display='none', 800); }
        }, 1500);
    </script>

    <!-- 背景星空 -->
    <canvas id="bg-starfield"></canvas>

    <!-- 顶部状态栏 -->
    <div class="absolute top-6 left-6 z-40 flex items-center gap-4 bg-slate-900/80 backdrop-blur-xl p-3 pr-6 rounded-2xl border border-slate-700 shadow-2xl">
        <button @click="goHome()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center hover:bg-slate-700 transition border border-slate-600">🏠</button>
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-600/30 border border-blue-500/50 flex items-center justify-center text-xl">👨‍🚀</div>
            <div>
                <div class="flex items-center gap-2">
                    <span class="font-black text-sm text-white">探险员档案</span>
                    <span x-show="isPro" class="bg-amber-500/20 text-amber-500 text-[8px] font-black px-1.5 py-0.5 rounded border border-amber-500/50 shadow-sm">PRO</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 宇宙探索主区域 -->
    <main class="flex-1 relative overflow-hidden bg-transparent z-10 w-full h-full">
        <div class="absolute inset-0 min-h-full no-select cursor-move" id="galaxy-viewport"
             @mousedown="startPan" @touchstart="startPan" @mousemove.window="doPan" @mouseup.window="endPan" @touchmove.window="doPan" @touchend.window="endPan">
            
            <!-- 🚀 灵动物理射线画布 -->
            <canvas id="network-canvas"></canvas>

            <div class="absolute w-full h-full pointer-events-none">
                <template x-for="g in galaxies" :key="g.id">
                    <div class="absolute flex items-center justify-center w-0 h-0 group transition-all ease-[cubic-bezier(0.25,1,0.5,1)]"
                         :style="g.id === activeGalaxyId 
                                 ? `left: 50%; top: 50%; transform: translate(${panX}px, ${panY}px) scale(1); z-index: 20; opacity: 1;` 
                                 : `left: ${g.bgX}%; top: ${g.bgY}%; transform: translate(0px, 0px) scale(0.12); z-index: 10; opacity: 0.6; cursor: pointer;`"
                         @click="if(g.id !== activeGalaxyId) activateGalaxy(g.id)">
                        
                        <!-- 未激活星系的缩略标签 -->
                        <div x-show="g.id !== activeGalaxyId" class="absolute pointer-events-none z-50 flex flex-col items-center" style="transform: scale(8.333); bottom: 140px;">
                            <span class="bg-slate-900/95 text-amber-300 px-4 py-1.5 rounded-xl border border-amber-500/50 shadow-[0_0_20px_rgba(245,158,11,0.8)] text-xs font-black uppercase flex items-center gap-2 whitespace-nowrap">🔥 <span x-text="g.title"></span></span>
                        </div>
                        
                        <!-- 中心星核 -->
                        <div class="absolute z-30 flex flex-col items-center justify-start pointer-events-auto" style="left: 0; top: 0; transform: translate(-50%, -50%);">
                            <div class="planet-core flex flex-col items-center justify-center text-center cursor-pointer shadow-[0_0_50px_rgba(59,130,246,0.3)] bg-blue-900/20 border border-blue-500/30 backdrop-blur-md"
                                 :style="g.id === activeGalaxyId ? 'width: 160px; height: 160px;' : 'width: 250px; height: 250px;'"
                                 @click.stop="g.id === activeGalaxyId ? activateGalaxy(null) : activateGalaxy(g.id)">
                                <div class="mb-1 drop-shadow-md" :class="g.id === activeGalaxyId ? 'text-5xl' : 'text-8xl'">🔮</div>
                                <div x-show="g.id === activeGalaxyId" class="text-[12px] font-black text-blue-200 uppercase tracking-widest mt-2" x-text="g.title"></div>
                                <div x-show="g.id === activeGalaxyId" class="mt-2 text-[9px] text-blue-400 border border-blue-500/50 rounded-full px-3 py-1 hover:bg-blue-600 hover:text-white transition">退回全景</div>
                            </div>
                        </div>

                        <!-- 环绕学科星球 -->
                        <div x-show="g.id === activeGalaxyId" class="absolute pointer-events-none" style="left:0; top:0;">
                            <template x-for="(s, sIdx) in g.subjects" :key="s.id">
                                <div class="absolute flex flex-col items-center z-20 cursor-pointer pointer-events-auto group" 
                                     :style="`left: ${Math.cos(s.angle) * s.radius}px; top: ${Math.sin(s.angle) * s.radius}px; transform: translate(-50%, -50%);`" 
                                     @click.stop="tryOpenMission(g, s, sIdx)">
                                    
                                    <div x-show="isSubjectFree(g, s, sIdx)" class="free-badge">FREE</div>
                                    <div x-show="!isPro && !isSubjectFree(g, s, sIdx)" class="energy-lock">🔒</div>
                                    
                                    <div class="w-20 h-20 planet-3d flex items-center justify-center text-4xl bg-slate-900 border-2 border-slate-700 shadow-xl group-hover:scale-110 group-hover:border-cyan-400 group-hover:shadow-[0_0_25px_rgba(34,211,238,0.5)]" 
                                         :class="!isPro && !isSubjectFree(g, s, sIdx) ? 'planet-locked' : ''" x-text="s.icon"></div>
                                    
                                    <span class="mt-4 text-[11px] font-bold text-cyan-100 bg-slate-900/90 px-3 py-1.5 rounded-lg border border-cyan-500/30 group-hover:bg-cyan-900 group-hover:border-cyan-400 transition whitespace-nowrap" x-text="s.title"></span>
                                </div>
                            </template>
                        </div>

                    </div>
                </template>
            </div>
        </div>
    </main>

    <script>
        function explorerApp() {
            return {
                galaxies: [], activeGalaxyId: null,
                panX: 0, panY: 0, isPanning: false, startX: 0, startY: 0,
                mouseX: window.innerWidth / 2, mouseY: window.innerHeight / 2,
                isPro: false,
                
                // 🎨 画布引流连线系统相关变量
                ctx: null, canvas: null, particles: [],
                
                async init() {
                    this.isPro = localStorage.getItem('xp_is_pro') === 'true';
                    const s = localStorage.getItem('xp_galaxies'); 
                    if(s) {
                        try {
                            const p = JSON.parse(s);
                            // 兼容性处理
                            if(Array.isArray(p) && p.length > 0) {
                                if(p[0].subjects) this.galaxies = p;
                                else this.galaxies = [{ id: 'gal_legacy', title: '星系矩阵', bgX: 50, bgY: 50, subjects: p }];
                            }
                        } catch(e){}
                    }
                    if(this.galaxies.length > 0) this.activeGalaxyId = this.galaxies[0].id;

                    // 初始化物理粒子网格
                    this.initNetworkCanvas();
                },

                isSubjectFree(g, s, i) { return this.isPro || g.isFree || i === 0; },
                
                tryOpenMission(g, s, i) {
                    if (this.isSubjectFree(g, s, i)) {
                        // 构建跳转 URL 并携带年龄段参数，进入模拟舱
                        let ageParam = 'mid'; // 默认
                        if (g.title.includes('幼崽') || g.title.includes('一') || g.title.includes('二')) ageParam = 'young';
                        else if (g.title.includes('领航') || g.title.includes('初') || g.title.includes('高') || g.title.includes('七') || g.title.includes('八')) ageParam = 'old';
                        
                        window.location.href = `xuepilot-simulator.html?age=${ageParam}&mission=${encodeURIComponent(s.title)}`;
                    }
                    else {
                        Swal.fire({
                            title: '量子引力场锁定', 
                            text: '指挥官，此星域需要 PRO 级核心算力才能强行跃迁。', 
                            icon: 'warning', background: '#0f172a', color: '#fff',
                            confirmButtonColor: '#3b82f6', confirmButtonText: '了解'
                        });
                    }
                },
                
                goHome() { window.location.href = 'index.html'; },
                
                activateGalaxy(gid) { 
                    this.activeGalaxyId = gid; 
                    this.panX = 0; this.panY = 0; 
                },
                
                startPan(e) {
                    if (e.target.closest('button') || e.target.closest('.planet-core') || e.target.closest('.planet-3d')) return;
                    this.isPanning = true;
                    const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX; const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    this.startX = cx - this.panX; this.startY = cy - this.panY;
                },
                
                doPan(e) {
                    const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX; const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    this.mouseX = cx; this.mouseY = cy; // 更新鼠标坐标，供画布连线使用
                    
                    if (!this.isPanning) return;
                    this.panX = Math.max(-2000, Math.min(2000, cx - this.startX)); 
                    this.panY = Math.max(-2000, Math.min(2000, cy - this.startY));
                },
                
                endPan() { this.isPanning = false; },

                // ==========================================
                // 🚀 核心：绝美直线粒子网格物理引擎
                // ==========================================
                initNetworkCanvas() {
                    this.canvas = document.getElementById('network-canvas');
                    this.ctx = this.canvas.getContext('2d');
                    
                    const resize = () => {
                        this.canvas.width = window.innerWidth;
                        this.canvas.height = window.innerHeight;
                    };
                    window.addEventListener('resize', resize);
                    resize();

                    // 创建游离的背景太空粒子
                    const particleCount = Math.floor(window.innerWidth / 30); // 根据屏幕宽度决定粒子密度
                    for(let i=0; i<particleCount; i++) {
                        this.particles.push({
                            x: Math.random() * this.canvas.width,
                            y: Math.random() * this.canvas.height,
                            vx: (Math.random() - 0.5) * 0.5,
                            vy: (Math.random() - 0.5) * 0.5
                        });
                    }

                    // 启动渲染循环
                    const animate = () => {
                        this.drawNetwork();
                        requestAnimationFrame(animate);
                    };
                    animate();
                },

                drawNetwork() {
                    if(!this.ctx || !this.canvas) return;
                    const width = this.canvas.width;
                    const height = this.canvas.height;
                    const cx = width / 2;
                    const cy = height / 2;

                    this.ctx.clearRect(0, 0, width, height);
                    this.ctx.lineWidth = 1;

                    // ----------------------------------------------------
                    // 第一部分：游离粒子自嗨连线 (绝对直线)
                    // ----------------------------------------------------
                    for(let i=0; i<this.particles.length; i++) {
                        let p = this.particles[i];
                        p.x += p.vx; p.y += p.vy;
                        // 边界反弹
                        if(p.x < 0 || p.x > width) p.vx *= -1;
                        if(p.y < 0 || p.y > height) p.vy *= -1;

                        // 粒子间互相连线
                        for(let j=i+1; j<this.particles.length; j++) {
                            let p2 = this.particles[j];
                            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                            if(dist < 150) {
                                this.ctx.beginPath();
                                this.ctx.strokeStyle = `rgba(59, 130, 246, ${0.15 * (1 - dist/150)})`;
                                this.ctx.moveTo(p.x, p.y);
                                this.ctx.lineTo(p2.x, p2.y);
                                this.ctx.stroke();
                            }
                        }

                        // 粒子被鼠标吸引连线
                        let distMouse = Math.hypot(p.x - this.mouseX, p.y - this.mouseY);
                        if(distMouse < 200) {
                            this.ctx.beginPath();
                            this.ctx.strokeStyle = `rgba(34, 211, 238, ${0.4 * (1 - distMouse/200)})`;
                            this.ctx.moveTo(p.x, p.y);
                            this.ctx.lineTo(this.mouseX, this.mouseY);
                            this.ctx.stroke();
                            
                            // 微小的引力拖拽效果（不弯曲线条，只改变粒子物理位置）
                            p.x += (this.mouseX - p.x) * 0.01;
                            p.y += (this.mouseY - p.y) * 0.01;
                        }
                    }

                    // ----------------------------------------------------
                    // 第二部分：当前激活星系的星球间互连 (绝对直线，高亮能量光束)
                    // ----------------------------------------------------
                    if (this.activeGalaxyId) {
                        const activeGalaxy = this.galaxies.find(g => g.id === this.activeGalaxyId);
                        if (activeGalaxy && activeGalaxy.subjects && activeGalaxy.subjects.length > 0) {
                            
                            // 收集当前星系中所有星球的绝对屏幕坐标
                            let starNodes = [];
                            
                            // 加入星核 (Core) 坐标
                            starNodes.push({ x: cx + this.panX, y: cy + this.panY, isCore: true });
                            
                            // 加入环绕的学科星球坐标
                            activeGalaxy.subjects.forEach(s => {
                                // 数学运算：屏幕中心点 + 拖拽偏移量 + (相对极坐标转换的直角坐标)
                                let px = cx + this.panX + Math.cos(s.angle) * s.radius;
                                let py = cy + this.panY + Math.sin(s.angle) * s.radius;
                                starNodes.push({ x: px, y: py, isCore: false });
                            });

                            // 1. 星球相互硬核连线，勾勒星系骨架
                            this.ctx.lineWidth = 1.5;
                            for(let i=0; i<starNodes.length; i++) {
                                for(let j=i+1; j<starNodes.length; j++) {
                                    let n1 = starNodes[i]; let n2 = starNodes[j];
                                    let dist = Math.hypot(n1.x - n2.x, n1.y - n2.y);
                                    
                                    // 连接条件：核心到所有星球，或者星球间距离适中
                                    if (n1.isCore || n2.isCore || dist < 450) {
                                        this.ctx.beginPath();
                                        // 核心射出的光束更亮
                                        let alpha = (n1.isCore || n2.isCore) ? 0.3 : 0.15;
                                        this.ctx.strokeStyle = `rgba(147, 51, 234, ${alpha})`;
                                        
                                        // 如果鼠标在这个线段附近，线条高亮变蓝！
                                        if (dist < 800) {
                                            let mouseDistToCenter = Math.hypot((n1.x+n2.x)/2 - this.mouseX, (n1.y+n2.y)/2 - this.mouseY);
                                            if(mouseDistToCenter < 150) {
                                                this.ctx.strokeStyle = `rgba(34, 211, 238, ${0.8 - mouseDistToCenter/200})`;
                                                this.ctx.lineWidth = 2;
                                            } else {
                                                this.ctx.lineWidth = 1.5;
                                            }
                                        }

                                        this.ctx.moveTo(n1.x, n1.y);
                                        this.ctx.lineTo(n2.x, n2.y);
                                        this.ctx.stroke();
                                    }
                                }
                                
                                // 2. 鼠标连接到大星球的战术探测线
                                let distToMouse = Math.hypot(starNodes[i].x - this.mouseX, starNodes[i].y - this.mouseY);
                                if (distToMouse < 250) {
                                    this.ctx.beginPath();
                                    this.ctx.lineWidth = 1;
                                    // 激光测距仪的虚线效果
                                    this.ctx.setLineDash([5, 5]); 
                                    this.ctx.strokeStyle = `rgba(56, 189, 248, ${0.8 * (1 - distToMouse/250)})`;
                                    this.ctx.moveTo(starNodes[i].x, starNodes[i].y);
                                    this.ctx.lineTo(this.mouseX, this.mouseY);
                                    this.ctx.stroke();
                                    this.ctx.setLineDash([]); // 恢复实线
                                }
                            }
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- 背景静止星空绘制 -->
    <script>
        const bgCanvas = document.getElementById('bg-starfield');
        const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
        for(let i=0; i<300; i++){
            bgCtx.fillStyle = `rgba(255,255,255,${Math.random() * 0.5})`;
            bgCtx.beginPath();
            bgCtx.arc(Math.random()*bgCanvas.width, Math.random()*bgCanvas.height, Math.random()*1.5, 0, Math.PI*2);
            bgCtx.fill();
        }
    </script>
</body>
</html>
