<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XuePilot 派乐伴学 - Unified OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #020617; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-nav { display: flex; width: 100%; align-items: center; padding: 0.8rem 1rem; margin-bottom: 0.4rem; border-radius: 0.75rem; border: 1px solid transparent; font-size: 0.875rem; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: left; }
        
        /* 🚀 3D 星球与恒星特效 */
        .planet-3d { will-change: transform; border-radius: 50%; position: relative; transition: transform 0.3s ease; }
        .planet-locked { filter: grayscale(1) opacity(0.4); cursor: not-allowed !important; }
        
        /* 恒星核心耀斑动画 */
        .sun-core {
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle at 30% 30%, #fff 0%, #fbbf24 20%, #ea580c 50%, #7c2d12 100%);
            box-shadow: 0 0 60px rgba(234, 88, 12, 0.6), 0 0 120px rgba(251, 191, 36, 0.3), inset -10px -10px 20px rgba(0,0,0,0.5);
            animation: sunPulse 4s infinite ease-in-out;
        }
        @keyframes sunPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(234, 88, 12, 0.6), 0 0 120px rgba(251, 191, 36, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 80px rgba(234, 88, 12, 0.8), 0 0 160px rgba(251, 191, 36, 0.5); }
        }

        .energy-lock { position: absolute; font-size: 1.5rem; filter: drop-shadow(0 0 8px #ef4444); z-index: 50; animation: lockPulse 2s infinite; }
        .free-badge { position: absolute; top: -10px; right: -10px; background: #10b981; color: white; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 4px; z-index: 50; box-shadow: 0 0 10px rgba(16,185,129,0.5); }
        @keyframes lockPulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } }

        /* 富文本编辑器定制 */
        .ql-toolbar.ql-snow { border: 1px solid rgba(255,255,255,0.1); background: rgba(30, 41, 59, 0.9); border-radius: 0.75rem 0.75rem 0 0; }
        .ql-container.ql-snow { border: 1px solid rgba(255,255,255,0.1); border-top: none; border-radius: 0 0 0.75rem 0.75rem; background: rgba(0,0,0,0.3); color: #e2e8f0; font-size: 0.875rem; }
        .ql-editor { min-height: 400px; }

        .input-dark { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; outline: none; transition: border-color 0.3s; }
        .input-dark:focus { border-color: #3b82f6; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script>
        window.safeStorage = {
            memory: {},
            get(key) { try { return window.localStorage.getItem(key) || this.memory[key] || null; } catch(e) { return this.memory[key] || null; } },
            set(key, value) { this.memory[key] = value; try { window.localStorage.setItem(key, value); } catch(e) {} }
        };
    </script>
</head>
<body x-data="dashboardApp()" x-init="init()" class="flex h-screen w-screen relative overflow-hidden text-slate-200">

    <!-- 侧边导航栏 -->
    <aside class="w-[18rem] border-r border-slate-800 flex flex-col glass-panel z-30 shrink-0 shadow-2xl relative">
        <div class="h-20 flex items-center px-6 border-b border-slate-800/50 justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl drop-shadow-[0_0_8px_rgba(59,130,246,0.6)]">🚀</span>
                <div>
                    <h1 class="text-lg font-black text-white tracking-widest">XUEPILOT</h1>
                    <div class="text-[9px] text-blue-500 font-mono mt-0.5 tracking-widest uppercase">System OS V10.0</div>
                </div>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 space-y-1 flex flex-col">
            <div class="text-[10px] text-slate-500 font-bold px-2 uppercase tracking-widest mb-2 mt-2">星际学习空间</div>
            <button @click="view = 'classroom'" class="btn-nav py-4 mb-4" :class="view === 'classroom' ? 'bg-emerald-900/40 text-emerald-300 border-emerald-500/50 shadow-[0_0_20px_rgba(16,185,129,0.3)]' : 'text-emerald-500 bg-emerald-900/10'">
                <span class="mr-3 text-2xl">🌌</span> 
                <div class="flex flex-col"><span class="text-base font-black text-white">进入学生探索舱</span><span class="text-[10px] text-emerald-600 font-normal">3D 沉浸式知识星系</span></div>
            </button>
            
            <div class="text-[10px] text-slate-500 font-bold px-2 uppercase tracking-widest mb-2 mt-2">专项研习舱</div>
            <a href="simulator.html" class="btn-nav text-slate-300 hover:text-blue-400"><span class="mr-3 text-xl">🎮</span> AI 指挥官模拟舱</a>
            <button @click="view = 'writing'" class="btn-nav" :class="view==='writing'?'bg-orange-600/20 text-orange-400 border-orange-500/30':'text-slate-300'"><span class="mr-3 text-xl">✍️</span> AI 启发写作舱</button>
            <button @click="openReading('en')" class="btn-nav" :class="view==='reading-en'?'bg-indigo-600/20 text-indigo-400 border-indigo-500/30':'text-slate-300'"><span class="mr-3 text-xl">📘</span> 英文智能伴读</button>
            <button @click="openReading('zh')" class="btn-nav" :class="view==='reading-zh'?'bg-emerald-600/20 text-emerald-400 border-emerald-500/30':'text-slate-300'"><span class="mr-3 text-xl">📙</span> 大语文智能伴读</button>

            <div class="mt-auto pt-4 border-t border-slate-800/50">
                <button @click="promptParentLock()" class="btn-nav w-full justify-between group" :class="isParentUnlocked ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-amber-400'">
                    <div class="flex items-center"><span class="mr-3 text-xl">🎛️</span> 家长/教师主控后台</div>
                    <span x-text="isParentUnlocked ? '🔓' : '🔒'"></span>
                </button>
                <div x-show="isParentUnlocked" x-collapse class="pl-4 border-l-2 border-slate-800 ml-4 mt-2 space-y-1">
                    <button @click="view = 'students'" class="btn-nav text-xs py-2" :class="view==='students'?'text-blue-400':'text-slate-400'">👨‍👩‍👧‍👦 学员管理</button>
                    <button @click="view = 'forge'" class="btn-nav text-xs py-2" :class="view==='forge'?'text-purple-400':'text-slate-400'">🪐 星系与大纲规划</button>
                    <button @click="view = 'radar'" class="btn-nav text-xs py-2" :class="view==='radar'?'text-emerald-400':'text-slate-400'">📡 学情分析雷达</button>
                    <button @click="view = 'config'" class="btn-nav text-xs py-2" :class="view==='config'?'text-slate-300':'text-slate-500'">⚙️ 引擎配置</button>
                </div>
            </div>
        </nav>
    </aside>

    <main class="flex-1 relative bg-[#02040a] overflow-hidden flex flex-col">
        <!-- ================= 🚀 视图：3D 学生探索舱 ================= -->
        <div x-show="view === 'classroom'" x-cloak class="flex-1 relative overflow-hidden bg-transparent z-10 w-full h-full fade-in">
            <!-- 灵动物理网格与飞星画布 -->
            <canvas id="network-canvas" class="absolute inset-0 pointer-events-none z-0"></canvas>
            
            <div class="absolute inset-0 min-h-full no-select cursor-move z-10" id="galaxy-viewport"
                 @mousedown="startPan" @touchstart="startPan" @mousemove.window="doPan" @mouseup.window="endPan" @touchmove.window="doPan" @touchend.window="endPan">
                
                <div class="absolute w-full h-full pointer-events-none">
                    <template x-for="g in galaxies" :key="g.id">
                        <div class="absolute flex items-center justify-center w-0 h-0 transition-all ease-[cubic-bezier(0.25,1,0.5,1)]"
                             :style="g.id === activeGalaxyId 
                                     ? `left: 50%; top: 50%; transform: translate(${panX}px, ${panY}px) scale(1); z-index: 20; opacity: 1;` 
                                     : `left: ${g.bgX}%; top: ${g.bgY}%; transform: translate(0px, 0px) scale(0.12); z-index: 10; opacity: 0.6; cursor: pointer;`"
                             @click="if(g.id !== activeGalaxyId) activateGalaxy(g.id)">
                            
                            <!-- 宪章 V 增强：高能恒星核心 -->
                            <div class="absolute z-30 flex flex-col items-center pointer-events-auto" style="left: 0; top: 0; transform: translate(-50%, -50%);">
                                <div class="sun-core flex flex-col items-center justify-center text-center cursor-pointer border-none"
                                     :style="g.id === activeGalaxyId ? 'width: 160px; height: 160px;' : 'width: 250px; height: 250px;'"
                                     @click.stop="g.id === activeGalaxyId ? activateGalaxy(null) : activateGalaxy(g.id)">
                                    <div class="mb-1 drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]" :class="g.id === activeGalaxyId ? 'text-5xl' : 'text-8xl'">🔮</div>
                                    <div x-show="g.id === activeGalaxyId" class="text-[10px] font-black text-amber-200 uppercase tracking-widest mt-2" x-text="g.title"></div>
                                </div>
                            </div>

                            <!-- 宪章 V：3D 环绕星球 -->
                            <div x-show="g.id === activeGalaxyId" class="absolute pointer-events-none" style="left:0; top:0;">
                                <template x-for="(s, sIdx) in g.subjects" :key="s.id">
                                    <div class="absolute flex flex-col items-center z-20 cursor-pointer pointer-events-auto group" 
                                         :style="`left: ${Math.cos(s.angle) * s.radius}px; top: ${Math.sin(s.angle) * s.radius}px; transform: translate(-50%, -50%);`" 
                                         @click.stop="tryOpenMission(g, s, sIdx)">
                                        <div x-show="sIdx === 0 || isPro" class="free-badge">OPEN</div>
                                        <div x-show="sIdx > 0 && !isPro" class="energy-lock">🔒</div>
                                        <div class="w-20 h-20 planet-3d flex items-center justify-center text-4xl transition-transform group-hover:scale-110 shadow-2xl" 
                                             :style="getPlanetStyle(sIdx)" :class="sIdx > 0 && !isPro ? 'planet-locked' : ''" x-text="s.icon"></div>
                                        <span class="mt-4 text-[11px] font-bold text-cyan-100 bg-slate-900/90 px-3 py-1.5 rounded-lg border border-cyan-500/30 group-hover:border-cyan-400 transition whitespace-nowrap" x-text="s.title"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- 其他功能视图 (保持逻辑) -->
        <div x-show="view === 'writing'" x-cloak class="flex-1 flex p-8 gap-6 z-10 fade-in">
            <div class="flex-1 glass-panel rounded-3xl flex flex-col overflow-hidden bg-slate-900/80 border border-orange-500/20">
                <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                    <h3 class="font-black text-xl text-orange-400">✍️ 启发写作舱</h3>
                    <p class="text-xs text-slate-500">不代写，只提问。训练独立逻辑链条。</p>
                </div>
                <div class="flex-1 p-6 flex flex-col">
                    <textarea x-model="writingDraft" class="flex-1 input-dark p-6 text-lg leading-relaxed resize-none rounded-2xl focus:border-orange-500" placeholder="在此输入草稿..."></textarea>
                    <div class="mt-6 flex justify-end">
                        <button @click="runWritingCritique()" class="px-8 py-3 bg-orange-600 hover:bg-orange-500 text-white font-bold rounded-xl shadow-lg transition" :disabled="isCritiquing || !writingDraft.trim()">
                            <span x-show="isCritiquing" class="animate-spin">↻</span> 正在解析逻辑...
                        </button>
                    </div>
                </div>
            </div>
            <div class="w-1/3 glass-panel rounded-3xl flex flex-col border border-slate-800">
                <div class="p-6 bg-slate-800/40 border-b border-slate-700 font-bold text-sm">💡 导师启发面板</div>
                <div class="flex-1 p-6 overflow-y-auto text-sm text-slate-300 leading-loose" x-html="writingFeedback || '等待提交草稿...'"></div>
            </div>
        </div>

        <div x-show="view.startsWith('reading')" x-cloak class="flex-1 flex p-8 gap-6 z-10 fade-in">
            <div class="w-1/2 glass-panel rounded-3xl flex flex-col border" :class="view==='reading-en' ? 'border-indigo-500/20' : 'border-emerald-500/20'">
                <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                    <h3 class="font-bold text-lg" :class="view==='reading-en'?'text-indigo-400':'text-emerald-400'" x-text="view==='reading-en'?'📘 English Reading Lab':'📙 大语文阅读研习'"></h3>
                </div>
                <div class="flex-1 p-6 flex flex-col">
                    <textarea x-model="readingMaterial" class="flex-1 input-dark p-6 text-sm leading-relaxed resize-none rounded-2xl mb-4" placeholder="在此粘贴素材片段..."></textarea>
                </div>
            </div>
            <div class="flex-1 glass-panel rounded-3xl flex flex-col relative border overflow-hidden" :class="view==='reading-en'?'border-indigo-500/30':'border-emerald-500/30'">
                <div class="h-16 border-b border-slate-800/50 flex items-center justify-center bg-slate-900/50"><span class="uppercase text-sm font-black tracking-widest text-emerald-400">🤖 NOVA 导师</span></div>
                <div class="flex-1 p-6 overflow-y-auto space-y-4" id="nova-reading-chat">
                    <template x-for="(msg,i) in readingChatLog" :key="i">
                        <div class="flex flex-col" :class="msg.role==='user'?'items-end':'items-start'">
                            <div class="max-w-[85%] p-4 rounded-2xl text-sm shadow-lg" :class="msg.role==='user'?'bg-blue-600/30 text-blue-100 border border-blue-500/30':'bg-slate-800 text-slate-200 border border-slate-700'"><span x-html="msg.text"></span></div>
                        </div>
                    </template>
                </div>
                <div class="p-4 bg-slate-900 border-t border-slate-800 flex gap-2">
                    <input type="text" x-model="readingInput" @keydown.enter="sendReadingText()" class="flex-1 input-dark px-4 py-3 rounded-xl text-sm" placeholder="探讨想法...">
                    <button @click="sendReadingText()" class="px-6 py-3 hover:bg-opacity-80 rounded-xl font-bold transition" :class="view==='reading-en'?'bg-indigo-600':'bg-emerald-600'">🚀</button>
                </div>
            </div>
        </div>

        <!-- 后台占位 -->
        <div x-show="view === 'forge'" x-cloak class="flex-1 p-8 z-10 fade-in text-center mt-20"><div class="text-6xl mb-4">🪐</div><h2 class="text-2xl font-black text-white">大纲与星系锻造</h2><button @click="triggerForgePaywall()" class="mt-4 px-6 py-3 bg-blue-600 rounded-xl font-bold">✨ 规划新星系</button></div>
        <div x-show="view === 'students'" x-cloak class="flex-1 p-8 z-10 fade-in"><h2 class="text-2xl font-black mb-4">👨‍👩‍👧‍👦 学员管理</h2></div>
        <div x-show="view === 'radar'" x-cloak class="flex-1 p-8 z-10 fade-in"><h2 class="text-2xl font-black mb-4">📡 全息学情雷达</h2></div>
        <div x-show="view === 'config'" x-cloak class="flex-1 p-8 z-10 fade-in"><h2 class="text-2xl font-black mb-4">⚙️ 引擎与云端配置</h2></div>

    </main>

    <script>
        function dashboardApp() {
            return {
                view: 'classroom', isPro: false, isParentUnlocked: false, parentPin: null,
                galaxies: [], activeGalaxyId: null,
                panX: 0, panY: 0, isPanning: false, startX: 0, startY: 0,
                mouseX: window.innerWidth / 2, mouseY: window.innerHeight / 2,
                ctx: null, canvas: null, particles: [], stars: [], animationFrameId: null,
                
                writingDraft: '', writingFeedback: '', isCritiquing: false,
                readingMaterial: '', readingInput: '', readingChatLog: [], readingLoading: false,

                async init() {
                    this.parentPin = window.safeStorage.get('xp_parent_pin');
                    this.isPro = window.localStorage.getItem('xp_is_pro') === 'true';
                    const s = window.localStorage.getItem('xp_galaxies'); 
                    if(s) { try { this.galaxies = JSON.parse(s); } catch(e){} }
                    this.injectDemoData();
                    if(this.galaxies.length > 0 && !this.activeGalaxyId) this.activeGalaxyId = this.galaxies[0].id;
                    this.initNetworkCanvas();
                },

                // 🚀 核心更新：初始化飞星与网格
                initNetworkCanvas() {
                    this.canvas = document.getElementById('network-canvas'); if(!this.canvas) return;
                    this.ctx = this.canvas.getContext('2d');
                    const resize = () => { this.canvas.width = window.innerWidth - 288; this.canvas.height = window.innerHeight; };
                    window.addEventListener('resize', resize); resize();

                    // 初始化粒子网格粒子
                    for(let i=0; i<40; i++) { this.particles.push({ x: Math.random()*this.canvas.width, y: Math.random()*this.canvas.height, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4 }); }
                    
                    // 🚀 初始化飞星 (Stars flying towards user)
                    for(let i=0; i<100; i++) {
                        this.stars.push({
                            x: (Math.random() - 0.5) * this.canvas.width,
                            y: (Math.random() - 0.5) * this.canvas.height,
                            z: Math.random() * this.canvas.width,
                            pz: 0
                        });
                    }

                    const anim = () => { this.drawNetwork(); this.animationFrameId = requestAnimationFrame(anim); }; anim();
                },

                drawNetwork() {
                    if(this.view !== 'classroom' || !this.ctx) return;
                    const w = this.canvas.width; const h = this.canvas.height;
                    this.ctx.clearRect(0, 0, w, h);
                    let mx = this.mouseX - 288;

                    // 🚀 1. 渲染不断飞过来的小亮点星星 (Warp Speed Effect)
                    this.ctx.fillStyle = "#fff";
                    this.stars.forEach(s => {
                        s.z -= 2; // 星星飞向屏幕的速度
                        if (s.z <= 0) s.z = w;
                        
                        let sx = (s.x / s.z) * (w / 2) + w / 2;
                        let sy = (s.y / s.z) * (h / 2) + h / 2;
                        let r = (1 - s.z / w) * 2; // 越近越大

                        if (sx >= 0 && sx <= w && sy >= 0 && sy <= h) {
                            this.ctx.beginPath();
                            this.ctx.arc(sx, sy, r, 0, Math.PI * 2);
                            this.ctx.fill();
                        }
                    });

                    // 2. 渲染粒子网格
                    this.particles.forEach((p, i) => {
                        p.x += p.vx; p.y += p.vy;
                        if(p.x<0 || p.x>w) p.vx*=-1; if(p.y<0 || p.y>h) p.vy*=-1;
                        this.particles.slice(i+1).forEach(p2 => {
                            let d = Math.hypot(p.x-p2.x, p.y-p2.y);
                            if(d<150) { this.ctx.beginPath(); this.ctx.strokeStyle=`rgba(59,130,246,${0.1*(1-d/150)})`; this.ctx.moveTo(p.x, p.y); this.ctx.lineTo(p2.x,p2.y); this.ctx.stroke(); }
                        });
                        if(mx>0) {
                            let dm = Math.hypot(p.x-mx, p.y-this.mouseY);
                            if(dm<200) { this.ctx.beginPath(); this.ctx.strokeStyle=`rgba(34,211,238,${0.3*(1-dm/200)})`; this.ctx.moveTo(p.x,p.y); this.ctx.lineTo(mx,this.mouseY); this.ctx.stroke(); }
                        }
                    });

                    // 3. 星系能量键 (绝对直线)
                    if (this.activeGalaxyId) {
                        const ag = this.galaxies.find(g => g.id === this.activeGalaxyId);
                        let cx = w/2 + this.panX; let cy = h/2 + this.panY;
                        ag.subjects.forEach(s => {
                            let px = cx + Math.cos(s.angle)*s.radius; let py = cy + Math.sin(s.angle)*s.radius;
                            this.ctx.beginPath(); this.ctx.strokeStyle='rgba(147,51,234,0.3)'; this.ctx.moveTo(cx, cy); this.ctx.lineTo(px, py); this.ctx.stroke();
                        });
                    }
                },

                triggerForgePaywall() { Swal.fire({ title: '资产铸造墙', html: '<p class="text-sm">需要 <b>PRO 核心算力</b> 解锁无限星系铸造权。</p>', icon: 'info', background: '#0f172a', color: '#fff' }); },
                tryOpenMission(g, s, i) {
                    if (i === 0 || this.isPro) { window.location.href = `simulator.html?mission=${encodeURIComponent(s.title)}`; } 
                    else { Swal.fire({ title: '量子引力场锁定', text: '指挥官，此星域需要 PRO 级算力。', icon: 'warning', background: '#0f172a', color: '#fff' }); }
                },

                injectDemoData() {
                    if (!this.galaxies || this.galaxies.length === 0) {
                        this.galaxies = [{
                            id: `gal_demo`, title: '太阳系探索先遣营', region: 'CN', baseStandard: 'custom', bgX: 50, bgY: 50,
                            subjects: [
                                { id: 's1', title: '星际物理基础', icon: '🌍', radius: 240, angle: 0 },
                                { id: 's2', title: '火星地质学', icon: '🪐', radius: 380, angle: 2.5 },
                                { id: 's3', title: '宇宙编程密码', icon: '💻', radius: 520, angle: 5.0 }
                            ]
                        }];
                    }
                },

                getPlanetStyle(index) {
                    const palette = [['#10b981', '#064e3b', '#10b98166'], ['#3b82f6', '#1e3a8a', '#3b82f666'], ['#8b5cf6', '#4c1d95', '#8b5cf666'], ['#06b6d4', '#164e63', '#06b6d466']];
                    const c = palette[index % palette.length];
                    return `background: radial-gradient(circle at 30% 30%, ${c[0]}, ${c[1]}, #000); box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 25px ${c[2]}; border: 1px solid rgba(255,255,255,0.1);`;
                },

                openReading(lang) { this.view = 'reading-' + lang; this.readingChatLog = [{ role: 'nova', text: '你好！我是 NOVA 伴读导师。' }]; },

                async promptParentLock() {
                    if (this.isParentUnlocked) { this.isParentUnlocked = false; this.view = 'classroom'; return; }
                    const { value: pin } = await Swal.fire({ title: '安全验证', input: 'password', inputAttributes: { maxlength: 4 }, background: '#0f172a', color: '#fff', confirmButtonText: '进入中枢' });
                    if (pin === (this.parentPin || '0000')) { this.isParentUnlocked = true; this.view = 'forge'; }
                },

                async callAI(p) { return "【演示】API 模块待连接。"; },
                async runWritingCritique() { this.isCritiquing = true; setTimeout(() => { this.writingFeedback = "逻辑清晰，建议增加论据。"; this.isCritiquing = false; }, 1000); },
                async sendReadingText() { const t = this.readingInput.trim(); if(!t) return; this.readingInput = ''; this.readingChatLog.push({role:'user', text:t}); },

                activateGalaxy(id) { this.activeGalaxyId = id; this.panX = 0; this.panY = 0; },
                startPan(e) { if(e.target.closest('.planet-core, .planet-3d')) return; this.isPanning=true; const cx = e.type.includes('touch')?e.touches[0].clientX:e.clientX; this.startX = cx-this.panX; this.startY = (e.type.includes('touch')?e.touches[0].clientY:e.clientY)-this.panY; },
                doPan(e) { const cx = e.type.includes('touch')?e.touches[0].clientX:e.clientX; const cy = e.type.includes('touch')?e.touches[0].clientY:e.clientY; this.mouseX=cx; this.mouseY=cy; if(!this.isPanning) return; this.panX=cx-this.startX; this.panY=cy-this.startY; },
                endPan() { this.isPanning = false; }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>
</html>
