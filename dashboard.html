<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XuePilot - Parent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; margin: 0; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-nav { display: flex; width: 100%; align-items: center; padding: 0.8rem 1rem; margin-bottom: 0.4rem; border-radius: 0.75rem; border: 1px solid transparent; font-size: 0.875rem; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: left; }
        .btn-nav:hover, .btn-nav.active { background-color: rgba(30, 41, 59, 0.8); border-color: rgba(59, 130, 246, 0.4); }
        .btn-nav.active { box-shadow: 0 0 15px rgba(59,130,246,0.2); }
        .view-panel { display: none; height: 100%; width: 100%; }
        .view-panel.active { display: flex; }
        .input-dark { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; outline: none; transition: border-color 0.3s; }
        .input-dark:focus { border-color: #3b82f6; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        .ql-toolbar.ql-snow { border: 1px solid rgba(255,255,255,0.1); background: rgba(30, 41, 59, 0.9); border-radius: 0.75rem 0.75rem 0 0; padding: 12px; }
        .ql-container.ql-snow { border: 1px solid rgba(255,255,255,0.1); border-top: none; border-radius: 0 0 0.75rem 0.75rem; background: rgba(0,0,0,0.3); color: #e2e8f0; font-family: -apple-system, sans-serif;}
        .ql-snow .ql-stroke { stroke: #cbd5e1; } .ql-snow .ql-fill { fill: #cbd5e1; } .ql-snow .ql-picker { color: #cbd5e1; }
        .ql-editor { min-height: 450px; font-size: 1rem; line-height: 1.8; }
        .ql-editor h3 { color: #60a5fa; font-weight: 900; margin-top: 1rem; margin-bottom: 0.5rem; font-size: 1.25rem; }
        .ql-editor ul { padding-left: 1.5rem; margin-bottom: 1rem; }
        .ql-editor p { margin-bottom: 0.75rem; }
        .ql-editor strong { color: #38bdf8; }
        .ql-editor img { border-radius: 0.5rem; max-width: 100%; margin: 1rem 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .ql-editor iframe.ql-video { width: 100%; height: 350px; border-radius: 0.5rem; margin: 1rem 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
    <script>
        window.safeStorage = {
            memory: {},
            get(key) { try { return window.localStorage.getItem(key) || this.memory[key] || null; } catch(e) { return this.memory[key] || null; } },
            set(key, value) { this.memory[key] = value; try { window.localStorage.setItem(key, value); } catch(e) {} }
        };
        const $ = id => document.getElementById(id);
        window.quillEditor = null;
    </script>
</head>
<body class="flex h-screen w-screen relative overflow-hidden text-slate-200 bg-[#02040a]">

    <!-- 背景纹理 -->
    <div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px); background-size: 30px 30px;"></div>

    <aside class="w-[20rem] border-r border-slate-800 flex flex-col glass-panel z-30 shrink-0 shadow-2xl relative">
        <div class="h-20 flex items-center px-6 border-b border-slate-800/50 justify-between">
            <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition group">
                <span class="text-2xl drop-shadow-[0_0_8px_rgba(59,130,246,0.6)] group-hover:scale-110 transition-transform">🎛️</span>
                <div>
                    <h1 class="text-lg font-black text-white tracking-widest flex items-baseline gap-2">XUEPILOT <span class="text-xs font-bold text-blue-400 tracking-normal">| 控制台</span></h1>
                    <div class="text-[9px] text-slate-500 font-mono mt-0.5 tracking-widest uppercase">Parent Command Center</div>
                </div>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 space-y-1 flex flex-col scrollbar-hide">
            <div class="text-[10px] text-slate-500 font-bold px-2 uppercase tracking-widest mb-2 mt-2">核心管理架构</div>
            <button onclick="App.switchView('students')" id="nav-students" class="btn-nav active py-3 mb-2 text-slate-300">
                <span class="mr-3 text-xl">👨‍👩‍👧‍👦</span><div class="flex flex-col"><span class="text-sm">学员档案管理</span></div>
            </button>
            <button onclick="App.switchView('radar')" id="nav-radar" class="btn-nav py-3 mb-2 text-slate-300">
                <span class="mr-3 text-xl">📡</span><div class="flex flex-col"><span class="text-sm">全息学情雷达</span></div>
            </button>
            <button onclick="App.switchView('forge')" id="nav-forge" class="btn-nav py-3 mb-2 text-slate-300">
                <span class="mr-3 text-xl">🪐</span><div class="flex flex-col"><span class="text-sm">星系锻造中枢</span></div>
            </button>
            <button onclick="App.switchView('config')" id="nav-config" class="btn-nav py-3 mb-2 text-slate-300">
                <span class="mr-3 text-xl">⚙️</span><div class="flex flex-col"><span class="text-sm">全局系统与配置</span><span class="text-[10px] font-normal mt-0.5 text-cyan-500">API与权限安全锁</span></div>
            </button>

            <div class="mt-auto pt-4 border-t border-slate-800/50">
                <button onclick="window.location.href='classroom.html'" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl font-black text-white shadow-[0_0_20px_rgba(59,130,246,0.4)] transition hover:scale-[1.02] flex justify-center items-center gap-2">
                    🚀 启动学生探索舱
                </button>
            </div>
        </nav>
    </aside>

    <main class="flex-1 relative overflow-hidden flex flex-col z-10 bg-slate-950/50">
        <!-- (学员管理/学情雷达/排课引擎等模块结构同前，为保证不截断，重点展示 Config 面板) -->
        
        <!-- 🚀 视图 5：全局配置 (已移除冗余的数据库填写，保持专业与克制) -->
        <div id="view-config" class="view-panel items-center justify-center p-8 fade-in overflow-y-auto">
            <div class="glass-panel w-full max-w-2xl rounded-3xl p-10 border border-slate-700 shadow-2xl my-auto">
                <h2 class="text-3xl font-black text-white mb-2">⚙️ 全局系统与算力配置</h2>
                <p class="text-slate-400 text-sm mb-8">设置最高权限密码，并绑定私有 API 密钥以解锁 XuePilot 的核心算力。</p>
                
                <div class="space-y-6">
                    <div class="bg-emerald-900/10 p-6 rounded-2xl border border-emerald-500/30">
                        <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-emerald-400 text-xs uppercase tracking-widest">🔐 物理隔离安全密钥 (Parent PIN)</h3></div>
                        <div class="flex gap-3">
                            <input type="password" id="new-pin" placeholder="输入新的 4 位数字密码" maxlength="4" class="flex-1 input-dark p-4 rounded-xl text-sm font-mono tracking-widest">
                            <button onclick="App.savePinConfig()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-bold transition whitespace-nowrap shadow-lg">更新密钥</button>
                        </div>
                    </div>

                    <div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-700">
                        <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-blue-400 text-xs uppercase tracking-widest">🌌 算力引擎 (SYS)</h3></div>
                        <input type="password" id="sys-key" placeholder="API Key" class="w-full input-dark p-4 rounded-xl text-sm font-mono mb-3">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="sys-url" placeholder="Base URL" class="input-dark p-4 rounded-xl text-sm font-mono">
                            <input type="text" id="sys-model" placeholder="Model ID" class="input-dark p-4 rounded-xl text-sm font-mono">
                        </div>
                    </div>
                </div>
                <div class="mt-8 flex justify-end"><button onclick="App.saveConfig()" class="px-10 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold shadow-xl transition">💾 烧录全局设定</button></div>
            </div>
        </div>

    </main>

    <script>
        const App = {
            state: {
                isPro: window.safeStorage.get('xp_is_pro') === 'true',
                parentPin: window.safeStorage.get('xp_parent_pin') || '0000',
                galaxies: [], students: [], currentStudentId: null,
            },

            init() {
                $('sys-key').value = window.safeStorage.get('xp_sys_key') || '';
                $('sys-url').value = window.safeStorage.get('xp_sys_url') || '/proxy/groq';
                $('sys-model').value = window.safeStorage.get('xp_sys_model') || 'llama-3.3-70b-versatile';
            },

            switchView(viewId) {
                document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
                const targetView = $( `view-${viewId}` );
                if (targetView) targetView.classList.add('active');
                document.querySelectorAll('.btn-nav').forEach(el => el.classList.remove('active', 'text-cyan-400'));
                const navBtn = $(`nav-${viewId}`);
                if(navBtn) navBtn.classList.add('active', 'text-cyan-400');
            },

            saveConfig() {
                ['sys'].forEach(t => { 
                    window.safeStorage.set(`xp_${t}_key`, $(`${t}-key`).value); 
                    window.safeStorage.set(`xp_${t}_url`, $(`${t}-url`).value); 
                    window.safeStorage.set(`xp_${t}_model`, $(`${t}-model`).value); 
                });
                Swal.fire({toast:true, position:'top-end', icon:'success', title:'全局引擎配置已保存', showConfirmButton:false, timer:2000});
            },
            
            savePinConfig() {
                const newPin = $('new-pin').value;
                if (newPin && newPin.length === 4 && /^\d{4}$/.test(newPin)) {
                    this.state.parentPin = newPin; window.safeStorage.set('xp_parent_pin', newPin);
                    Swal.fire({toast:true, position:'top-end', icon:'success', title:'隔离密钥已更新', showConfirmButton:false, timer:1500});
                    $('new-pin').value = '';
                } else { Swal.fire({title: '格式错误', text: '安全密钥必须是 4 位纯数字。', icon: 'error', background: '#0f172a', color: '#fff'}); }
            }
        };

        window.App = App;
        window.onload = () => { window.App.init(); window.App.switchView('config'); }; 
    </script>
</body>
</html>
