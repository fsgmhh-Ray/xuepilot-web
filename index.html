<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XuePilot 派乐伴学 - 神经链路登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase 官方 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #030712; color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        .space-bg { position: fixed; inset: 0; z-index: -3; background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%); }
        .grid-bg { position: fixed; inset: 0; z-index: -2; background-image: linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px); background-size: 40px 40px; transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px); animation: gridMove 20s linear infinite; }
        @keyframes gridMove { 100% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); } }
        
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(59, 130, 246, 0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .input-dark { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.1); color: #fff; outline: none; transition: border-color 0.3s; }
        .input-dark:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.3); }
        
        .btn-primary { background: linear-gradient(135deg, #2563eb, #4f46e5); transition: all 0.2s; }
        .btn-primary:active { transform: scale(0.95); }
        .btn-primary:hover { box-shadow: 0 0 20px rgba(79, 70, 229, 0.6); transform: translateY(-2px); }
        
        .scan-line { width: 100%; height: 2px; background: #3b82f6; position: absolute; top: 0; left: 0; opacity: 0.5; animation: scan 3s infinite linear; pointer-events: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body x-data="authApp()" x-init="initAuth()" class="min-h-screen flex items-center justify-center relative">

    <div class="space-bg"></div>
    <div class="grid-bg"></div>

    <div class="w-full max-w-md px-6 z-10 fade-in">
        
        <!-- Logo 区域 -->
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white font-black text-4xl shadow-[0_0_30px_rgba(37,99,235,0.6)] mb-6 border border-blue-400/50">XP</div>
            <h1 class="text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">XUEPILOT</h1>
            <p class="text-blue-500/80 font-mono text-xs tracking-widest mt-2 uppercase">Neural Link Gateway</p>
        </div>

        <!-- 登录 / 注册表单 -->
        <div x-show="!sessionUser" x-cloak class="glass-panel p-8 rounded-3xl relative overflow-hidden">
            <div class="scan-line"></div>
            
            <div class="flex bg-slate-900/50 p-1.5 rounded-2xl mb-8 border border-slate-800 shadow-inner">
                <button @click="authMode = 'login'" class="flex-1 py-3 text-sm font-bold rounded-xl transition" :class="authMode === 'login' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:text-slate-300'">身份验证登录</button>
                <button @click="authMode = 'register'" class="flex-1 py-3 text-sm font-bold rounded-xl transition" :class="authMode === 'register' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:text-slate-300'">建立新档案</button>
            </div>

            <form @submit.prevent="handleAuth()" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 tracking-widest uppercase">联系邮箱 (Email)</label>
                    <input type="email" x-model="email" required class="w-full input-dark p-4 rounded-xl text-sm" placeholder="commander@xuepilot.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 tracking-widest uppercase">安保密钥 (Password)</label>
                    <input type="password" x-model="password" required class="w-full input-dark p-4 rounded-xl text-sm" placeholder="••••••••">
                </div>
                
                <button type="submit" class="w-full btn-primary py-4 rounded-xl font-bold text-white shadow-lg mt-4 flex justify-center items-center gap-2" :disabled="loading">
                    <span x-show="loading" class="animate-spin">↻</span>
                    <span x-text="authMode === 'login' ? '🔗 建立神经链接' : '✨ 注册并创建身份'"></span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <button @click="bypassAuth()" class="text-xs text-slate-500 hover:text-blue-400 underline decoration-slate-700 underline-offset-4 transition">
                    [Debug] 绕过鉴权，进入本地体验模式 ➔
                </button>
            </div>
        </div>

        <!-- 🚀 纯粹的跳转动画 -->
        <div x-show="sessionUser" x-cloak class="glass-panel p-8 rounded-3xl relative overflow-hidden text-center fade-in">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 rounded-full mx-auto flex items-center justify-center text-3xl mb-4 shadow-[0_0_20px_rgba(16,185,129,0.3)] animate-pulse">✓</div>
            <h2 class="text-2xl font-black text-white mb-2">身份链接成功</h2>
            <p class="text-slate-400 text-sm mb-6 truncate px-4 font-mono" x-text="sessionUser?.email"></p>
            <div class="text-blue-400 font-mono text-sm tracking-widest uppercase animate-pulse font-bold mt-8">正在驶入应用大厅...</div>
        </div>

    </div>

    <script>
        function authApp() {
            return {
                authMode: 'login', email: '', password: '', loading: false, sessionUser: null, isPro: false, supaClient: null,

                async initAuth() {
                    this.isPro = localStorage.getItem('xp_is_pro') === 'true';

                    const DEFAULT_SUPA_URL = 'https://cywslfalbedraeeggryj.supabase.co'; 
                    const DEFAULT_SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5d3NsZmFsYmVkcmFlZWdncnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDg5NjEsImV4cCI6MjA5MTYyNDk2MX0.uZoL3JiHGuw_8XNOHKu4mA4z4tsEH7T9czQCkYrb0x0'; 

                    const supaUrl = localStorage.getItem('xp_supa_url') || DEFAULT_SUPA_URL;
                    const supaKey = localStorage.getItem('xp_supa_key') || DEFAULT_SUPA_KEY;

                    if (supaUrl && supaKey && window.supabase) {
                        try {
                            this.supaClient = window.supabase.createClient(supaUrl, supaKey);
                            const { data: { session } } = await this.supaClient.auth.getSession();
                            if (session) {
                                this.sessionUser = session.user;
                                this.checkProStatusFromDB(session.user.id);
                            this.injectDemoDataIfEmpty();
                            // ✅ 登录状态下，直接无感跳转学生舱
                            window.location.href = 'classroom.html';
                        }
                    } catch(e) {}
                    }
                },

                injectDemoDataIfEmpty() {
                    const existingGalaxies = localStorage.getItem('xp_galaxies');
                    if (!existingGalaxies || existingGalaxies === '[]' || existingGalaxies.length < 10) {
                        const defaultStudents = [{ id: 'stu_default', name: '探索者一号', avatar: '👨‍🚀' }];
                        localStorage.setItem('xp_students', JSON.stringify(defaultStudents));
                        const demoGalaxies = [{
                            id: `gal_demo_${Date.now()}`, title: '太阳系探索先遣营', region: 'CN', baseStandard: 'custom', studentId: 'stu_default',
                            overview: '欢迎来到 XuePilot！这是一个为您自动生成的演示星系。', bgX: 50, bgY: 50,
                            subjects: [ { id: 'sub_1', title: '星际物理基础', icon: '🌍', radius: 240, angle: 0, referenceText: '了解基本重力概念。', units: [] } ]
                        }];
                        localStorage.setItem('xp_galaxies', JSON.stringify(demoGalaxies));
                    }
                },

                async handleAuth() {
                    this.loading = true;
                    try {
                        if (!this.supaClient) throw new Error("数据库未连接！");
                        let res;
                        if (this.authMode === 'register') {
                            res = await this.supaClient.auth.signUp({ email: this.email, password: this.password });
                            if (res.error) throw res.error;
                            Swal.fire({icon:'success', title:'注册成功', text:'身份已记录，系统正在为您跳转...', background:'#0f172a', color:'#fff', timer: 1500, showConfirmButton: false});
                            this.authMode = 'login';
                            setTimeout(() => this.handleAuth(), 1500);
                        } else {
                            res = await this.supaClient.auth.signInWithPassword({ email: this.email, password: this.password });
                            if (res.error) throw res.error;
                            this.sessionUser = res.data.user;
                            this.checkProStatusFromDB(res.data.user.id);
                            this.injectDemoDataIfEmpty();
                            
                            // ✅ 登录成功后，直接跳转学生舱
                            setTimeout(() => { window.location.href = 'classroom.html'; }, 1000);
                        }
                    } catch (err) {
                        Swal.fire({icon:'error', title:'验证失败', text: err.message, background:'#0f172a', color:'#fff'});
                    } finally { this.loading = false; }
                },

                async checkProStatusFromDB(userId) {
                    if(!this.supaClient) return;
                    try {
                        const { data } = await this.supaClient.from('user_data').select('data').eq('id', userId).single();
                        if (data && data.data && data.data.isPro) { this.isPro = true; localStorage.setItem('xp_is_pro', 'true'); }
                    } catch(e) {}
                },

                bypassAuth() {
                    this.sessionUser = { email: 'guest_commander@local.env' };
                    this.injectDemoDataIfEmpty();
                    setTimeout(() => { window.location.href = 'classroom.html'; }, 500);
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>
</html>
