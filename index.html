<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XuePilot Command - 派乐伴学总指挥中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #020617; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; }
        .glass-sidebar { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(16px); border-right: 1px solid rgba(255,255,255,0.05); }
        .nav-item { transition: all 0.3s ease; position: relative; cursor: pointer; }
        .nav-item.active { background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), transparent); border-left: 4px solid #3b82f6; color: #fff; }
        
        /* 🚀 物理级改进：NOVA 悬浮球现在支持拖拽 */
        .nova-float { 
            width: 64px; height: 64px; 
            position: fixed; 
            z-index: 100; 
            cursor: grab; 
            user-select: none;
            touch-action: none;
        }
        .nova-float:active { cursor: grabbing; }
        .nova-orb-inner { 
            width: 100%; height: 100%; border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb, #1e3a8a); 
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.6); 
            animation: novaBreath 3s infinite alternate; 
            border: 2px solid rgba(255,255,255,0.2); 
            display: flex; align-items: center; justify-content: center; font-size: 24px;
        }
        @keyframes novaBreath { from { transform: scale(1); } to { transform: scale(1.05); } }
        
        .nova-chat-panel { 
            position: fixed; width: 360px; height: 500px; z-index: 99; 
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); 
            border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 24px; 
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body x-data="osApp()" class="flex h-screen w-screen relative">

    <aside class="w-64 flex flex-col glass-sidebar z-20">
        <div class="h-20 flex items-center px-6 border-b border-slate-800/50">
            <span class="text-3xl mr-3">🚀</span>
            <div><h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">XuePilot</h1><div class="text-[9px] text-slate-500 font-mono tracking-widest mt-0.5">COMMAND OS v9.0</div></div>
        </div>
        <div class="flex-1 py-8 px-3 space-y-1">
            <a @click.prevent="selectApp('pro')" class="nav-item flex items-center px-4 py-3 rounded-xl" :class="activeApp === 'pro' ? 'active' : ''">🌌 派乐星际教室</a>
            <a @click.prevent="selectApp('game')" class="nav-item flex items-center px-4 py-3 rounded-xl" :class="activeApp === 'game' ? 'active' : ''">🎮 AI 指挥官模拟舱</a>
            <a @click.prevent="selectApp('tools')" class="nav-item flex items-center px-4 py-3 rounded-xl" :class="activeApp === 'tools' ? 'active' : ''">🌍 全球资源探索</a>
        </div>
        <div class="p-4 border-t border-slate-800/50">
            <button @click="showSettings = true" class="w-full py-3 bg-slate-800/50 rounded-xl text-xs font-bold text-slate-400">🎛️ 算力引擎配置</button>
        </div>
    </aside>

    <main class="flex-1 relative">
        <iframe id="app-frame" :src="iframeSrc" class="w-full h-full border-none"></iframe>

        <!-- 🚀 随舰导师 NOVA (可移动形态) -->
        <div x-show="user" x-cloak>
            <div id="nova-draggable" class="nova-float" 
                 :style="`left: ${novaPos.x}px; top: ${novaPos.y}px;`"
                 @mousedown="startDrag($event)"
                 @click="toggleNovaChat()">
                <div class="nova-orb-inner">🤖</div>
            </div>

            <div x-show="novaOpen" class="nova-chat-panel" :style="`left: ${Math.min(novaPos.x, window.innerWidth-380)}px; top: ${Math.max(20, novaPos.y-510)}px;`" @click.away="novaOpen = false">
                <div class="p-4 bg-blue-900/40 border-b border-blue-500/30 flex justify-between">
                    <span class="text-xs font-black uppercase text-blue-300">NOVA Advisor</span>
                    <button @click="novaOpen = false">✖</button>
                </div>
                <div class="flex-1 p-4 overflow-y-auto space-y-4 text-xs" id="nova-chat-content">
                    <div class="bg-slate-800 p-3 rounded-xl">你好，指挥官。我已解除定位锁定，你可以把我拖到任何不挡路的地方。有什么思维困惑吗？</div>
                    <template x-for="m in novaMsgs"><div :class="m.role==='user'?'text-right':'text-left'"><div class="inline-block p-2.5 rounded-xl" :class="m.role==='user'?'bg-blue-600':'bg-slate-800'" x-text="m.content"></div></div></template>
                </div>
                <div class="p-3 border-t border-slate-800">
                    <input type="text" x-model="novaInput" @keydown.enter="novaAsk()" class="w-full bg-black/40 border border-slate-700 p-2 rounded-lg text-xs" placeholder="向 NOVA 提问...">
                </div>
            </div>
        </div>
    </main>

    <script>
        window.osApp = function() {
            return {
                activeApp: 'pro', iframeSrc: 'apps/xuepilot-pro-core.html', user: {id:1},
                novaOpen: false, novaInput: '', novaMsgs: [], novaLoading: false,
                novaPos: { x: window.innerWidth - 100, y: window.innerHeight - 100 },
                isDragging: false, offset: { x: 0, y: 0 },

                startDrag(e) {
                    this.isDragging = true;
                    this.offset.x = e.clientX - this.novaPos.x;
                    this.offset.y = e.clientY - this.novaPos.y;
                    const move = (ev) => {
                        if(!this.isDragging) return;
                        this.novaPos.x = ev.clientX - this.offset.x;
                        this.novaPos.y = ev.clientY - this.offset.y;
                    };
                    const stop = () => { this.isDragging = false; window.removeEventListener('mousemove', move); };
                    window.addEventListener('mousemove', move);
                    window.addEventListener('mouseup', stop);
                },

                toggleNovaChat() { if(!this.isDragging) this.novaOpen = !this.novaOpen; },
                selectApp(id) { 
                    this.activeApp = id; 
                    const paths = { pro:'apps/xuepilot-pro-core.html', game:'apps/game.html', tools:'apps/xuepilot-tools.html' };
                    this.iframeSrc = paths[id];
                },
                async novaAsk() {
                    const q = this.novaInput.trim(); if(!q) return; this.novaInput = '';
                    this.novaMsgs.push({role:'user', content:q});
                    // 此处对接之前的 callAI 逻辑
                    this.novaMsgs.push({role:'assistant', content:'[AI 正在思考...] 指挥官，关于你的提问，我建议从定义的边界开始思考。'});
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
