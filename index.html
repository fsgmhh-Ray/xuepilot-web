<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XuePilot Command - 派乐伴学总指挥中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #020617; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; }
        .glass-sidebar { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(16px); border-right: 1px solid rgba(255,255,255,0.05); }
        .nav-item { transition: all 0.3s ease; position: relative; cursor: pointer; }
        .nav-item.active { background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), transparent); border-left: 4px solid #3b82f6; color: #fff; }
        .nav-item.locked { opacity: 0.3; cursor: not-allowed; filter: grayscale(100%); }
        .input-dark { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; transition: all 0.3s; }
        .input-dark:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        .auth-glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(25px); border: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 10px; }
    </style>
</head>
<body x-data="osApp()" class="flex h-screen w-screen relative">

    <aside class="w-64 flex flex-col glass-sidebar z-20 shadow-2xl">
        <div class="h-20 flex items-center px-6 border-b border-slate-800/50">
            <span class="text-3xl mr-3 filter drop-shadow-[0_0_8px_rgba(59,130,246,0.6)]">🚀</span>
            <div><h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">XuePilot</h1><div class="text-[9px] text-slate-500 font-mono tracking-widest mt-0.5">CLOUD OS v8.8</div></div>
        </div>

        <div class="flex-1 py-8 flex flex-col gap-2 px-3 overflow-y-auto">
            <a @click.prevent="selectApp('radar')" class="nav-item flex items-center px-4 py-3 rounded-xl text-slate-400" :class="activeApp === 'radar' ? 'active' : ''"><span class="text-xl mr-3">📡</span> 准入评估扫描仪</a>
            <div class="h-px bg-slate-800/50 my-4 mx-4"></div>
            <a @click.prevent="selectApp('pro')" class="nav-item flex items-center px-4 py-3 rounded-xl" :class="[activeApp === 'pro' ? 'active' : '', user ? 'text-blue-200 font-bold' : 'locked']"><span class="text-xl mr-3 filter drop-shadow-[0_0_5px_rgba(59,130,246,0.8)]">🌌</span> 派乐星际教室</a>
            <a @click.prevent="selectApp('tools')" class="nav-item flex items-center px-4 py-3 rounded-xl mt-2" :class="[activeApp === 'tools' ? 'active' : '', user ? 'text-slate-300' : 'locked']"><span class="text-xl mr-3">🌍</span> 全球 AI 资源探索</a>
            
            <!-- 🎮 新增：AI 指挥官模拟舱入口 -->
            <a @click.prevent="selectApp('game')" class="nav-item flex items-center px-4 py-3 rounded-xl mt-2" :class="[activeApp === 'game' ? 'active' : '', user ? 'text-emerald-300 font-bold' : 'locked']"><span class="text-xl mr-3">🎮</span> AI 指挥官模拟舱</a>
        </div>

        <div class="px-3 pb-3">
            <button @click="showSettings = true" class="w-full flex items-center justify-between px-4 py-3 rounded-xl transition bg-indigo-900/40 border border-indigo-500/30 hover:bg-indigo-800/60 group">
                <div class="flex items-center gap-3"><span class="text-xl group-hover:animate-spin">🎛️</span><span class="font-bold text-sm text-indigo-300">算力引擎配置</span></div>
            </button>
        </div>

        <div class="p-4 border-t border-slate-800/50 bg-slate-900/80 flex items-center justify-between">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center shrink-0"><span x-text="user ? '👨‍🚀' : '👤'"></span></div>
                <div class="overflow-hidden"><div class="text-xs font-bold text-slate-300" x-text="user ? '已认证' : '访客'"></div><div class="text-[10px] text-slate-500 font-mono truncate w-24" x-text="user ? user.email : '未登录'"></div></div>
            </div>
            <button x-show="user" @click="handleLogout()" class="text-[10px] text-rose-400 hover:text-rose-300 bg-rose-900/20 px-2 py-1 rounded">登出</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#02040a] relative">
        <div class="flex-1 relative" x-show="!showSettings">
            <iframe id="app-frame" name="app-frame" :src="iframeSrc" class="w-full h-full border-none bg-transparent relative z-20"></iframe>
        </div>

        <!-- 双引擎配置 -->
        <div class="absolute inset-0 bg-[#02040a]/95 z-40 p-8 overflow-y-auto backdrop-blur-xl" x-show="showSettings" x-transition.opacity x-cloak>
            <div class="max-w-4xl mx-auto pt-6 pb-20">
                <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4"><h2 class="text-2xl font-black text-white uppercase tracking-tighter">🎛️ Engine Control Center</h2><button @click="showSettings = false" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold">返回驾驶舱</button></div>
                
                <div class="bg-blue-900/20 border border-blue-500/30 p-4 rounded-xl mb-8">
                    <p class="text-sm text-blue-200">🚀 <strong>Vercel 代理模式提示：</strong> 如果您已部署到 Vercel，为彻底避免跨域拦截，建议将 Base URL 填写为 Vercel 代理地址。例如使用 Groq 时，填写 <code>/proxy/groq</code> 即可。</p>
                </div>

                <div class="grid grid-cols-1 gap-8">
                    <!-- 业务引擎 -->
                    <div class="bg-slate-900/60 p-6 rounded-2xl border border-blue-500/20 shadow-lg relative overflow-hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-blue-300">🌌 核心业务引擎 (排课/写作)</h3>
                            <button @click="testConnection('sys')" class="px-4 py-2 bg-blue-900/50 text-blue-300 text-xs font-bold rounded border border-blue-500/30 hover:bg-blue-600 hover:text-white transition" :disabled="isTestingSys"><span x-show="isTestingSys" class="animate-spin inline-block mr-1">↻</span>测通连接</button>
                        </div>
                        <div class="space-y-4">
                            <input type="password" x-model="sysConfig.apiKey" placeholder="API Key" class="input-dark w-full p-3 rounded-lg text-sm font-mono">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" x-model="sysConfig.baseUrl" placeholder="Base URL (例: /proxy/groq 或 https://api.groq.com/openai/v1)" class="input-dark w-full p-3 rounded-lg text-sm font-mono">
                                <input type="text" x-model="sysConfig.modelId" placeholder="Model ID" class="input-dark w-full p-3 rounded-lg text-sm font-mono">
                            </div>
                        </div>
                    </div>

                    <!-- NOVA 引擎 -->
                    <div class="bg-slate-900/60 p-6 rounded-2xl border border-purple-500/20 shadow-lg">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-purple-300">🎙️ NOVA 独立语音引擎</h3>
                            <button @click="testConnection('nova')" class="px-4 py-2 bg-purple-900/50 text-purple-300 text-xs font-bold rounded border border-purple-500/30 hover:bg-purple-600 hover:text-white transition" :disabled="isTestingNova"><span x-show="isTestingNova" class="animate-spin inline-block mr-1">↻</span>测通连接</button>
                        </div>
                        <div class="space-y-4">
                            <input type="password" x-model="novaConfig.apiKey" placeholder="API Key" class="input-dark w-full p-3 rounded-lg text-sm font-mono">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" x-model="novaConfig.baseUrl" placeholder="Base URL (建议使用代理如 /proxy/groq)" class="input-dark w-full p-3 rounded-lg text-sm font-mono">
                                <input type="text" x-model="novaConfig.modelId" placeholder="Model ID" class="input-dark w-full p-3 rounded-lg text-sm font-mono">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-8 text-center"><button @click="saveEngineConfig()" class="w-full max-w-md py-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-xl font-bold transition shadow-lg text-lg">💾 保存并应用算力配置</button></div>
            </div>
        </div>

        <!-- 身份认证 -->
        <div class="absolute inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-md" x-show="showAuthModal" x-transition.opacity x-cloak>
            <div class="auth-glass w-full max-w-md rounded-3xl p-8 relative"><button @click="showAuthModal = false" class="absolute top-5 right-5 text-slate-500 hover:text-white text-2xl">✖</button><div class="text-center mb-8"><div class="text-5xl mb-4">🔐</div><h2 class="text-2xl font-black text-white">安全访问授权</h2></div><form @submit.prevent="handleLogin()" class="space-y-5"><div><label class="block text-xs font-bold text-slate-400 mb-2">领航员邮箱</label><input type="email" x-model="email" required class="input-dark w-full p-3.5 rounded-xl"></div><div><label class="block text-xs font-bold text-slate-400 mb-2">访问密钥</label><input type="password" x-model="password" required class="input-dark w-full p-3.5 rounded-xl"></div><button type="submit" class="w-full py-4 rounded-xl font-bold text-white bg-blue-600 shadow-lg" :disabled="loading"><span x-text="loading ? '验证中...' : '进入星际教室'"></span></button></form></div>
        </div>
    </main>

    <script>
        window.osApp = function() {
            const supabaseUrl = 'https://cywslfalbedraeeggryj.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5d3NsZmFsYmVkcmFlZWdncnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDg5NjEsImV4cCI6MjA5MTYyNDk2MX0.uZoL3JiHGuw_8XNOHKu4mA4z4tsEH7T9czQCkYrb0x0';
            let supabaseClient = null;
            try { if (window.supabase) supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey); } catch (e) {}

            function safeGet(key, def = '') { try { return localStorage.getItem(key) || def; } catch (e) { return def; } }
            function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
            
            function washUrl(url) {
                if (!url) return '';
                let u = url.trim();
                if (u.endsWith('/')) u = u.slice(0, -1);
                const suffixes = ['/chat/completions', '/completions'];
                suffixes.forEach(s => { if(u.endsWith(s)) u = u.substring(0, u.length - s.length); });
                return u; 
            }

            return {
                activeApp: 'none', iframeSrc: '', user: null, showAuthModal: false, email: '', password: '', loading: false, showSettings: false,
                isTestingSys: false, isTestingNova: false,
                sysConfig: { apiKey: safeGet('xp_sys_key'), baseUrl: safeGet('xp_sys_url', '/proxy/groq'), modelId: safeGet('xp_sys_model', 'gpt-4o-mini') },
                novaConfig: { apiKey: safeGet('xp_nova_key'), baseUrl: safeGet('xp_nova_url', '/proxy/groq'), modelId: safeGet('xp_nova_model', 'gpt-4o-mini') },
                
                async init() {
                    window.addEventListener('message', (ev) => { if (ev.data) this.handleMessage(ev.data); });
                    if(supabaseClient) {
                        try {
                            const { data: { session } } = await supabaseClient.auth.getSession();
                            if (session) { this.user = session.user; this.selectApp('pro'); } 
                            else if (safeGet('xuepilot_radar_done') === 'true') { this.activeApp = 'pro'; this.iframeSrc = 'apps/xuepilot-pro-core.html'; this.showAuthModal = true; } 
                            else { this.selectApp('radar'); }
                        } catch(e) { this.selectApp('radar'); }
                    } else { this.selectApp('radar'); }
                },

                selectApp(appId) {
                    if (!this.user && appId !== 'radar') { this.showAuthModal = true; return; }
                    this.showSettings = false; this.activeApp = appId;
                    // 🎮 路由路径配置，这里注册了游戏入口
                    const paths = { 
                        'radar': 'apps/xuepilot-radar.html', 
                        'pro': 'apps/xuepilot-pro-core.html', 
                        'tools': 'apps/xuepilot-tools.html',
                        'game': 'apps/game.html' // 匹配您在 apps 目录下的文件
                    };
                    this.iframeSrc = paths[appId];
                },

                saveEngineConfig() {
                    const clean = (s) => s ? s.trim() : '';
                    safeSet('xp_sys_key', clean(this.sysConfig.apiKey)); 
                    safeSet('xp_sys_url', washUrl(this.sysConfig.baseUrl)); 
                    safeSet('xp_sys_model', clean(this.sysConfig.modelId));
                    safeSet('xp_nova_key', clean(this.novaConfig.apiKey)); 
                    safeSet('xp_nova_url', washUrl(this.novaConfig.baseUrl)); 
                    safeSet('xp_nova_model', clean(this.novaConfig.modelId));
                    this.showSettings = false;
                    if (this.activeApp === 'pro') document.getElementById('app-frame').contentWindow.location.reload();
                    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: '算力节点已同步', showConfirmButton: false, timer: 1500 });
                },

                async testConnection(type) {
                    const config = type === 'sys' ? this.sysConfig : this.novaConfig;
                    const loadVar = type === 'sys' ? 'isTestingSys' : 'isTestingNova';
                    const key = config.apiKey ? config.apiKey.trim() : ''; 
                    let baseUrl = washUrl(config.baseUrl);
                    
                    if(!key) { Swal.fire('缺少 Key','请填写 API 密钥','warning'); return; }
                    
                    // 如果没有填写 /v1，且使用的是真实域名，则自动补充 /v1
                    if (baseUrl.startsWith('http') && !baseUrl.endsWith('/v1')) {
                        baseUrl += '/v1';
                    }
                    
                    this[loadVar] = true;
                    try {
                        const finalUrl = `${baseUrl}/chat/completions`;
                        const res = await fetch(finalUrl, {
                            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                            body: JSON.stringify({ model: config.modelId, messages: [{ role: 'user', content: 'Say OK' }], max_tokens: 10 })
                        });
                        if (res.ok) Swal.fire({ title: '连接通畅', text: `已成功握手算力节点：${finalUrl}`, icon: 'success', background: '#0f172a', color: '#fff' });
                        else {
                            const err = await res.json().catch(() => ({}));
                            Swal.fire({ title: '连接被拒', text: err.error?.message || '配置有误，请检查模型名称和密钥', icon: 'error', background: '#0f172a', color: '#fff' });
                        }
                    } catch (e) {
                        Swal.fire({ title: '网络跨域拦截 (CORS)', html: `接口拒绝了前端访问。如果您正在使用 Vercel，请将 Base URL 修改为：<b>/proxy/groq</b> 等代理地址。`, icon: 'warning', background: '#0f172a', color: '#fff' });
                    }
                    this[loadVar] = false;
                },

                async handleMessage(msg) {
                    if (msg.type === 'AUTO_REGISTER') {
                        this.loading = true; Swal.fire({ title: '加密通道建立中...', didOpen: () => { Swal.showLoading() }, background: '#0f172a', color: '#fff' });
                        const p = msg.payload; const { data, error } = await supabaseClient.auth.signUp({ email: p.email, password: p.password });
                        if (error) {
                            Swal.close(); this.loading = false;
                            if (error.message.includes('already registered')) { Swal.fire({ title: '档案已存在', icon: 'info', background: '#0f172a', color: '#fff' }); this.email = p.email; this.showAuthModal = true; } 
                            else { Swal.fire({ icon: 'error', title: '注册失败', text: error.message }); }
                        } else {
                            if (data.user) { await supabaseClient.from('profiles').upsert([{ id: data.user.id, role: 'parent', subscription_tier: 'free' }]); await supabaseClient.from('leads').insert([{ parent_name: p.name, email: p.email, region: p.region, radar_data: p.scores }]); }
                            safeSet('xuepilot_radar_done', 'true'); this.user = data.user; this.loading = false; this.selectApp('pro');
                        }
                    }
                },
                async handleLogin() { this.loading = true; const { data, error } = await supabaseClient.auth.signInWithPassword({ email: this.email, password: this.password }); this.loading = false; if (!error) { safeSet('xuepilot_radar_done', 'true'); this.user = data.user; this.showAuthModal = false; this.selectApp('pro'); } },
                async handleLogout() { await supabaseClient.auth.signOut(); this.user = null; this.selectApp('radar'); }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
