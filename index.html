<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XuePilot Command - 派乐伴学总指挥中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #020617; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        /* 🚀 侧边栏沉浸式折叠动画 */
        .glass-sidebar { 
            background: rgba(15, 23, 42, 0.4); 
            backdrop-filter: blur(16px); 
            border-right: 1px solid rgba(255,255,255,0.05); 
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 16rem;
        }
        .sidebar-hidden { 
            transform: translateX(-100%); 
            width: 0 !important; 
            opacity: 0; 
            pointer-events: none; 
        }

        .nav-item { transition: all 0.3s ease; position: relative; cursor: pointer; }
        .nav-item.active { background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), transparent); border-left: 4px solid #3b82f6; color: #fff; }
        
        /* 🚀 NOVA 磁吸拖拽 UI (识别拖动还是点击) */
        .nova-float { 
            width: 64px; height: 64px; 
            position: fixed; 
            z-index: 100; 
            cursor: grab; 
            user-select: none;
            touch-action: none;
        }
        .nova-float:active { cursor: grabbing; }
        .nova-orb-inner { 
            width: 100%; height: 100%; border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb, #1e3a8a); 
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.6); 
            animation: novaBreath 3s infinite alternate; 
            border: 2px solid rgba(255,255,255,0.2); 
            display: flex; align-items: center; justify-content: center; font-size: 24px;
        }
        @keyframes novaBreath { from { transform: scale(1); } to { transform: scale(1.05); } }
        
        .nova-chat-panel { 
            position: fixed; width: 360px; height: 500px; z-index: 99; 
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px); 
            border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 24px; 
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .input-dark { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; outline: none; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 10px; }
    </style>
</head>
<body x-data="osApp()" @message.window="handleChildMessage($event)" class="flex h-screen w-screen relative overflow-hidden">

    <!-- 主侧边栏：进入教室后自动折叠 -->
    <aside class="flex flex-col glass-sidebar z-20 shrink-0" :class="activeApp === 'pro' ? 'sidebar-hidden' : ''">
        <div class="h-20 flex items-center px-6 border-b border-slate-800/50">
            <span class="text-3xl mr-3 filter drop-shadow-[0_0_8px_rgba(59,130,246,0.6)]">🚀</span>
            <div>
                <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">XuePilot</h1>
                <div class="text-[9px] text-slate-500 font-mono tracking-widest mt-0.5">COMMAND OS v10.0</div>
            </div>
        </div>
        
        <div class="flex-1 py-8 px-3 space-y-1">
            <a @click.prevent="selectApp('pro')" class="nav-item flex items-center px-4 py-3 rounded-xl" :class="activeApp === 'pro' ? 'active' : ''">🌌 派乐星际教室</a>
            <a @click.prevent="selectApp('game')" class="nav-item flex items-center px-4 py-3 rounded-xl" :class="activeApp === 'game' ? 'active' : ''">🎮 AI 指挥官模拟舱</a>
            <a @click.prevent="selectApp('tools')" class="nav-item flex items-center px-4 py-3 rounded-xl" :class="activeApp === 'tools' ? 'active' : ''">🌍 全球资源探索</a>
        </div>

        <div class="p-4 border-t border-slate-800/50">
            <button @click="showSettings = true" class="w-full py-3 bg-slate-800/40 rounded-xl text-[10px] font-bold text-slate-400 hover:text-white transition">🎛️ 算力引擎配置</button>
        </div>
    </aside>

    <!-- 应用容器 -->
    <main class="flex-1 relative bg-black">
        <iframe id="app-frame" :src="iframeSrc" class="w-full h-full border-none transition-all duration-500"></iframe>

        <!-- 🤖 全时随舰导师 NOVA -->
        <div x-show="user" x-cloak>
            <!-- 悬浮球 -->
            <div id="nova-draggable" class="nova-float" 
                 :style="`left: ${novaPos.x}px; top: ${novaPos.y}px;`"
                 @mousedown="startDrag($event)">
                <div class="nova-orb-inner">🤖</div>
            </div>

            <!-- 对话面板 -->
            <div x-show="novaOpen" x-transition class="nova-chat-panel" 
                 :style="`left: ${Math.min(novaPos.x, window.innerWidth-380)}px; top: ${Math.max(20, novaPos.y-510)}px;`" 
                 @click.away="novaOpen = false">
                <div class="p-4 bg-blue-900/40 border-b border-blue-500/30 flex justify-between items-center">
                    <span class="text-[10px] font-black uppercase text-blue-300 tracking-widest">Nova Socratic Advisor</span>
                    <button @click="novaOpen = false" class="text-slate-500 hover:text-white">✖</button>
                </div>
                <div class="flex-1 p-4 overflow-y-auto space-y-4 text-xs" id="nova-chat-content">
                    <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 leading-relaxed">
                        你好，指挥官。我已经解除位置锁定。有什么思维盲点需要我引导吗？
                    </div>
                    <template x-for="m in novaMsgs">
                        <div :class="m.role==='user'?'text-right':'text-left'">
                            <div class="inline-block p-3 rounded-2xl mt-2 shadow-lg" :class="m.role==='user'?'bg-blue-600 text-white':'bg-slate-800 border border-slate-700 text-slate-200'" x-text="m.content"></div>
                        </div>
                    </template>
                    <div x-show="novaLoading" class="text-blue-400 animate-pulse text-[10px] font-mono">NOVA 正在解析宇宙规律...</div>
                </div>
                <div class="p-3 border-t border-slate-800 bg-slate-900">
                    <div class="flex items-center gap-2">
                        <input type="text" x-model="novaInput" @keydown.enter="novaAsk()" class="flex-1 input-dark p-3 rounded-xl text-xs outline-none focus:border-blue-500" placeholder="打字向 NOVA 请教...">
                        <button @click="novaAsk()" class="bg-blue-600 p-3 rounded-xl shadow-lg hover:bg-blue-500 transition">🚀</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 算力配置 -->
        <div x-show="showSettings" x-cloak class="absolute inset-0 bg-black/95 z-50 flex items-center justify-center p-8 backdrop-blur-xl">
             <div class="w-full max-w-lg bg-slate-900 border border-blue-500/30 p-8 rounded-3xl shadow-2xl">
                 <h2 class="text-xl font-bold mb-6">🎛️ 算力引擎配置</h2>
                 <div class="space-y-4">
                     <input type="password" x-model="sysConfig.apiKey" placeholder="API Key" class="w-full input-dark p-4 rounded-xl font-mono">
                     <input type="text" x-model="sysConfig.baseUrl" placeholder="代理 Base URL (例: /proxy/groq)" class="w-full input-dark p-4 rounded-xl font-mono">
                     <input type="text" x-model="sysConfig.modelId" placeholder="Model ID" class="w-full input-dark p-4 rounded-xl font-mono">
                 </div>
                 <div class="mt-8 flex gap-4">
                     <button @click="saveSettings()" class="flex-1 py-4 bg-blue-600 rounded-xl font-bold">💾 保存配置</button>
                     <button @click="showSettings = false" class="px-8 py-4 bg-slate-800 rounded-xl">取消</button>
                 </div>
             </div>
        </div>
    </main>

    <script>
        window.osApp = function() {
            return {
                activeApp: 'pro', iframeSrc: 'apps/xuepilot-pro-core.html', user: {id:1},
                novaOpen: false, novaInput: '', novaMsgs: [], novaLoading: false,
                showSettings: false,
                sysConfig: { 
                    apiKey: localStorage.getItem('xp_sys_key') || '', 
                    baseUrl: localStorage.getItem('xp_sys_url') || '/proxy/groq',
                    modelId: localStorage.getItem('xp_sys_model') || 'llama-3.3-70b-versatile'
                },
                novaPos: { x: window.innerWidth - 100, y: window.innerHeight - 100 },
                isDragging: false, dragStartPos: {x:0, y:0}, offset: { x: 0, y: 0 },

                handleChildMessage(e) {
                    if (e.data && e.data.type === 'GO_HOME') {
                        this.activeApp = 'none';
                        this.iframeSrc = ''; 
                    }
                },

                startDrag(e) {
                    this.isDragging = false;
                    this.dragStartPos = { x: e.clientX, y: e.clientY };
                    this.offset.x = e.clientX - this.novaPos.x;
                    this.offset.y = e.clientY - this.novaPos.y;
                    
                    const move = (ev) => {
                        const dist = Math.hypot(ev.clientX - this.dragStartPos.x, ev.clientY - this.dragStartPos.y);
                        if (dist > 5) { 
                            this.isDragging = true;
                            this.novaPos.x = ev.clientX - this.offset.x;
                            this.novaPos.y = ev.clientY - this.offset.y;
                        }
                    };
                    
                    const stop = () => {
                        if (!this.isDragging) this.toggleNovaChat();
                        this.isDragging = false;
                        window.removeEventListener('mousemove', move);
                        window.removeEventListener('mouseup', stop);
                    };
                    window.addEventListener('mousemove', move);
                    window.addEventListener('mouseup', stop);
                },

                toggleNovaChat() { this.novaOpen = !this.novaOpen; },
                
                selectApp(id) { 
                    this.activeApp = id; 
                    const paths = { pro:'apps/xuepilot-pro-core.html', game:'apps/game.html', tools:'apps/xuepilot-tools.html' };
                    this.iframeSrc = paths[id];
                },

                saveSettings() {
                    localStorage.setItem('xp_sys_key', this.sysConfig.apiKey);
                    localStorage.setItem('xp_sys_url', this.sysConfig.baseUrl);
                    localStorage.setItem('xp_sys_model', this.sysConfig.modelId);
                    this.showSettings = false;
                    location.reload();
                },

                async novaAsk() {
                    const q = this.novaInput.trim(); if(!q || this.novaLoading) return;
                    this.novaInput = '';
                    this.novaMsgs.push({role:'user', content:q});
                    this.novaLoading = true;
                    try {
                        const res = await fetch(`${this.sysConfig.baseUrl}/chat/completions`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.sysConfig.apiKey}` },
                            body: JSON.stringify({
                                model: this.sysConfig.modelId,
                                messages: [{ role: 'system', content: 'You are NOVA, a Socratic intersteller mentor. Never give direct answers. Help student define problems and judge information. Lang: Chinese.' }, ...this.novaMsgs]
                            })
                        });
                        const data = await res.json();
                        this.novaMsgs.push({role:'assistant', content: data.choices[0].message.content});
                    } catch(e) {
                        this.novaMsgs.push({role:'assistant', content: '⚠️ 星际通讯受阻，请检查算力代理配置。'});
                    }
                    this.novaLoading = false;
                    setTimeout(() => { const c = document.getElementById('nova-chat-content'); if(c) c.scrollTop = c.scrollHeight; }, 100);
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
