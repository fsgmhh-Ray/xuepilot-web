<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XuePilot - Language Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #02040a; color: #f8fafc; font-family: -apple-system, sans-serif; overflow: hidden; margin: 0; }
        .glass-panel { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-nav { display: flex; width: 100%; align-items: center; padding: 0.8rem 1rem; margin-bottom: 0.4rem; border-radius: 0.75rem; border: 1px solid transparent; font-size: 0.875rem; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: left; }
        .btn-nav:hover, .btn-nav.active { background-color: rgba(30, 41, 59, 0.8); border-color: rgba(59, 130, 246, 0.4); }
        .btn-nav.active { box-shadow: 0 0 15px rgba(59,130,246,0.2); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(15,23,42,0.5); border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.4); border-radius: 8px; }
        
        .tab-btn { transition: all 0.3s ease; }
        .tab-btn.active { background-color: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #60a5fa; }
    </style>
</head>
<body class="flex h-screen w-screen relative overflow-hidden text-slate-200 bg-[#02040a]" 
      x-data="{ tab: new URLSearchParams(window.location.search).get('tab') || 'chinese' }">
      
    <aside class="w-[20rem] border-r border-slate-800 flex flex-col glass-panel z-30 shrink-0 shadow-2xl relative bg-slate-900/30">
        <div class="h-20 flex items-center px-6 border-b border-slate-800/50 justify-between">
            <div class="flex items-center gap-3 group">
                <span class="text-2xl drop-shadow-[0_0_8px_rgba(59,130,246,0.8)]">🚀</span>
                <div>
                    <h1 class="text-lg font-black text-white tracking-widest flex items-baseline gap-2">XUEPILOT <span class="text-xs font-bold text-slate-400 tracking-normal">| 探索舱</span></h1>
                </div>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 space-y-1 flex flex-col custom-scroll">
            <div class="text-[10px] text-slate-500 font-bold px-2 uppercase tracking-widest mb-2 mt-2">核心宇宙探索</div>
            <button onclick="window.location.href='classroom.html'" class="btn-nav py-3 mb-2 text-slate-300 hover:text-emerald-300 transition"><span class="mr-3 text-2xl">🌌</span><div class="flex flex-col"><span class="text-sm font-black text-white">3D 知识星球</span></div></button>
            <div class="text-[10px] text-slate-500 font-bold px-2 uppercase tracking-widest mb-2 mt-4">全球教育网关</div>
            <button onclick="window.location.href='resources.html'" class="btn-nav py-3 mb-2 text-slate-300 hover:text-cyan-400 transition"><span class="mr-3 text-2xl">🌐</span><div class="flex flex-col"><span class="text-sm font-black text-white">全球教育智库</span></div></button>
            <button onclick="window.location.href='reader.html'" class="btn-nav py-3 mb-4 text-slate-300 hover:text-blue-400 transition"><span class="mr-3 text-2xl">📖</span><div class="flex flex-col"><span class="text-sm font-black text-white">全息伴读阅读器</span></div></button>
            <div class="text-[10px] text-slate-500 font-bold px-2 uppercase tracking-widest mb-2 mt-2">专项集训营</div>
            
            <a href="simulator.html" class="btn-nav py-3 text-slate-300 hover:text-white transition"><span class="mr-3 text-xl">🎮</span><div class="flex flex-col"><span class="text-sm">危机救援演习</span></div></a>
            <button onclick="window.location.href='writing.html'" class="btn-nav py-3 text-slate-300 hover:text-white transition"><span class="mr-3 text-xl">✍️</span><div class="flex flex-col"><span class="text-sm">启发写作舱</span></div></button>
            
            <!-- 激活状态绑定 (Alpine 控制) -->
            <button @click="tab = 'english'; window.history.replaceState(null, '', '?tab=english')" class="btn-nav py-3 transition" :class="tab === 'english' ? 'active text-blue-400 border-blue-500/30' : 'text-slate-300 hover:text-white'"><span class="mr-3 text-xl">🔤</span><div class="flex flex-col"><span class="text-sm">英文魔法书</span></div></button>
            <button @click="tab = 'chinese'; window.history.replaceState(null, '', '?tab=chinese')" class="btn-nav py-3 transition" :class="tab === 'chinese' ? 'active text-rose-400 border-rose-500/30' : 'text-slate-300 hover:text-white'"><span class="mr-3 text-xl">📜</span><div class="flex flex-col"><span class="text-sm">大语文时光机</span></div></button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden z-10 bg-slate-950/90 relative">
        <!-- 动态顶部 Header -->
        <header class="h-24 border-b border-slate-800 flex items-center justify-between px-10 bg-slate-900/50 shrink-0">
            <h2 class="text-3xl font-black text-white" x-text="tab === 'english' ? '🔤 英文原版魔法伴读舱' : '📜 跨时空大语文伴读舱'"></h2>
            
            <!-- 原生选项卡切换器 -->
            <div class="flex bg-slate-900 border border-slate-800 rounded-xl p-1">
                <button @click="tab = 'chinese'; window.history.replaceState(null, '', '?tab=chinese')" class="px-6 py-2 rounded-lg text-sm font-bold tab-btn" :class="tab === 'chinese' ? 'bg-slate-700 text-white' : 'text-slate-500 hover:text-slate-300'">大语文 (CN)</button>
                <button @click="tab = 'english'; window.history.replaceState(null, '', '?tab=english')" class="px-6 py-2 rounded-lg text-sm font-bold tab-btn" :class="tab === 'english' ? 'bg-slate-700 text-white' : 'text-slate-500 hover:text-slate-300'">英文基座 (EN)</button>
            </div>
        </header>

        <!-- 选项卡 1：大语文 -->
        <div x-show="tab === 'chinese'" x-cloak class="flex-1 overflow-y-auto p-10 custom-scroll">
            <div class="max-w-5xl mx-auto">
                <div class="bg-rose-900/10 border border-rose-500/20 rounded-3xl p-10 text-center shadow-xl backdrop-blur-sm">
                    <span class="text-6xl drop-shadow-md mb-6 inline-block">🏺</span>
                    <h3 class="text-2xl font-bold text-rose-400 mb-4 tracking-widest">大语文共情力沙盒</h3>
                    <p class="text-slate-400 text-sm max-w-xl mx-auto leading-relaxed">独立的大语文环境，将通过 AI 引导重构历史语境，让学习者穿越时空，与苏轼、屈原直接进行跨维度的神经元对话。</p>
                </div>
            </div>
        </div>

        <!-- 选项卡 2：英文魔法书 -->
        <div x-show="tab === 'english'" x-cloak class="flex-1 overflow-y-auto p-10 custom-scroll">
            <div class="max-w-5xl mx-auto">
                <div class="bg-blue-900/10 border border-blue-500/20 rounded-3xl p-10 text-center shadow-xl backdrop-blur-sm">
                    <span class="text-6xl drop-shadow-md mb-6 inline-block">🏰</span>
                    <h3 class="text-2xl font-bold text-blue-400 mb-4 tracking-widest">English Native Matrix</h3>
                    <p class="text-slate-400 text-sm max-w-xl mx-auto leading-relaxed">纯净的英文母语级建构舱。摒弃传统的死记硬背，以沉浸式情境引擎重塑对单词与从句的本能级条件反射。</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
