<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端防缩放，保证触控体验 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XuePilot - Neural Reading Cabin</title>
    <!-- 引入核心依赖 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* ========================================== */
        /* 1. 基础重置与排版引擎 (Base & Typography)  */
        /* ========================================== */
        [x-cloak] { display: none !important; }
        body { overflow: hidden; -webkit-font-smoothing: antialiased; }
        
        /* 字体族定义 */
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }
        .font-serif { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', Georgia, serif; }

        /* 隐藏滚动条但保留功能 (移动端阅读更沉浸) */
        .hide-scroll::-webkit-scrollbar { width: 0px; background: transparent; }
        .hide-scroll { scrollbar-width: none; -ms-overflow-style: none; }

        /* ========================================== */
        /* 2. 视觉主题引擎与底图接口 (Theme & Textures) */
        /* ========================================== */
        /* 💡【指挥官专属：如何添加背景图】
           如果您在 Supabase 存了材质图，请取消下方 background-image 的注释，替换您的 URL！
        */
        
        /* 深邃宇宙 (Dark) */
        .theme-dark { background-color: #020617; color: #94a3b8; }
        .theme-dark .reader-bg { 
            background-color: #020617; 
            /* background-image: url('您的Supabase深空图URL'); */
            /* background-size: cover; background-attachment: fixed; */
        }
        .theme-dark .content-engine h1, .theme-dark .content-engine h2, .theme-dark .content-engine h3 { color: #f1f5f9; }
        
        /* 泛黄卷宗 (Sepia) - 模拟纸质质感 */
        .theme-sepia { background-color: #f4ecd8; color: #433422; }
        .theme-sepia .reader-bg { 
            background-color: #f4ecd8; 
            /* background-image: url('您的Supabase羊皮纸无缝图URL'); */
            /* background-repeat: repeat; */
        }
        .theme-sepia .content-engine h1, .theme-sepia .content-engine h2, .theme-sepia .content-engine h3 { color: #291f13; }
        
        /* 防反光纯净白 (Light) */
        .theme-light { background-color: #ffffff; color: #334155; }
        .theme-light .reader-bg { background-color: #ffffff; }
        .theme-light .content-engine h1, .theme-light .content-engine h2, .theme-light .content-engine h3 { color: #0f172a; }

        /* 统一面板毛玻璃效果 */
        .glass-panel { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }

        /* ========================================== */
        /* 3. 核心内容渲染引擎 (Content Engine)         */
        /* ========================================== */
        .content-engine { text-align: justify; letter-spacing: 0.03em; }
        .content-engine p { margin-bottom: 2em; text-indent: 2em; line-height: inherit; }
        .content-engine h1, .content-engine h2, .content-engine h3 { font-weight: 900; margin-top: 2.5em; margin-bottom: 1.2em; line-height: 1.4; text-indent: 0; }
        .content-engine blockquote { 
            border-left: 4px solid #3b82f6; font-style: italic; opacity: 0.85; margin: 2em 0; 
            background: rgba(59, 130, 246, 0.05); padding: 1.2em 1.5em; border-radius: 0 12px 12px 0; 
        }
        .content-engine img { max-width: 100%; border-radius: 12px; margin: 2.5em auto; display: block; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        
        /* 划线工具交互动画 */
        .tooltip-pop { animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { from { opacity: 0; transform: translate(-50%, -100%) scale(0.8); } to { opacity: 1; transform: translate(-50%, -120%) scale(1); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

<body x-data="readerApp()" x-init="init()" class="transition-colors duration-700 ease-in-out" :class="['theme-' + theme, 'font-' + fontFamily]">

    <!-- 全局 Loading 拦截层 -->
    <div x-show="loading" class="fixed inset-0 z-[200] bg-slate-950 flex flex-col items-center justify-center">
        <div class="text-5xl text-cyan-500 mb-6 animate-pulse">⚛️</div>
        <div class="text-cyan-400 font-mono tracking-widest text-sm animate-pulse" x-text="loadingText"></div>
    </div>

    <!-- ========================================================= -->
    <!-- [视图层 1] 模式 A：档案馆矩阵 (Library)                   -->
    <!-- ========================================================= -->
    <div x-show="viewMode === 'library' && !loading" x-cloak class="h-screen w-screen overflow-y-auto bg-[#020617] p-6 md:p-10 hide-scroll">
        <div class="max-w-7xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between md:items-end gap-6 mb-10 border-b border-slate-800 pb-6">
                <div>
                    <h2 class="text-3xl md:text-4xl font-black text-white mb-2 flex items-center gap-3"><span class="text-blue-500">🏛️</span> 全息伴读舱 (Library)</h2>
                    <p class="text-slate-400 text-xs md:text-sm tracking-wide">选择您要载入神经链路的档案流。仅支持带有图文深层的读物。</p>
                </div>
                <button @click="window.location.href='classroom.html'" class="px-5 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold transition flex items-center justify-center gap-2 shadow-lg">
                    ⬅ 返回主探索舱
                </button>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <template x-for="book in libraryBooks" :key="book.id">
                    <div @click="openBook(book)" class="bg-slate-900/60 border border-slate-800 p-8 rounded-3xl hover:border-cyan-500/50 hover:bg-slate-800/80 cursor-pointer transition shadow-xl group relative overflow-hidden flex flex-col h-full">
                        <div class="absolute inset-0 bg-gradient-to-br from-cyan-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="text-5xl mb-6 group-hover:scale-110 group-hover:-translate-y-2 transition-transform filter drop-shadow-lg" x-text="book.icon || '📖'"></div>
                        <h3 class="text-lg font-black text-slate-200 mb-2 leading-snug" x-text="book.title"></h3>
                        <p class="text-xs text-slate-500 line-clamp-3 leading-relaxed flex-1" x-text="book.description || book.desc || '无可用的描述数据'"></p>
                        <div class="mt-6 text-[10px] text-cyan-500/70 font-bold uppercase tracking-widest group-hover:text-cyan-400 transition-colors">抽取图文流 ➔</div>
                    </div>
                </template>
            </div>
        </div>
    </div>


    <!-- ========================================================= -->
    <!-- [视图层 2] 模式 B：沉浸式阅读器视图 (Immersive Reader)  -->
    <!-- ========================================================= -->
    <div x-show="viewMode === 'reader' && !loading" x-cloak class="flex h-screen w-screen overflow-hidden relative reader-bg">
        
        <!-- --------------------------------------- -->
        <!-- [沉浸感 HUD] 顶部控制台 (自动隐藏)       -->
        <!-- --------------------------------------- -->
        <header class="fixed top-0 left-0 w-full h-16 z-40 transition-transform duration-300 glass-panel flex items-center justify-between px-4 md:px-6 shadow-sm border-b"
                :class="[
                    isScrollingDown ? '-translate-y-full' : 'translate-y-0',
                    theme === 'dark' ? 'bg-slate-950/80 border-slate-800/50' : (theme === 'sepia' ? 'bg-[#f4ecd8]/90 border-[#d8c8b0]/50' : 'bg-white/90 border-slate-200/50')
                ]">
            
            <div class="flex items-center gap-2 md:gap-4">
                <button @click="exitReader()" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-black/10 transition text-xl" title="返回智库">⬅</button>
                <button @click="showToc = true" class="px-3 md:px-4 py-2 rounded-xl font-bold text-sm hover:bg-black/10 transition flex items-center gap-2">
                    📑 <span class="hidden md:inline">目录</span>
                </button>
            </div>
            
            <div class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-none w-1/2">
                <h1 class="text-xs md:text-sm font-black tracking-widest truncate w-full text-center" x-text="book?.title || 'Loading...'"></h1>
                <span class="text-[9px] md:text-[10px] opacity-50 font-mono mt-0.5" x-text="`Chapter ${currentChapterIdx + 1} / ${chapters.length}`"></span>
            </div>

            <div class="flex items-center gap-2 md:gap-3 relative">
                <!-- 移动端隐藏文字，只留图标 -->
                <button @click="showNova = true" class="px-3 md:px-4 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 text-white rounded-xl font-bold text-xs shadow-lg transition flex items-center gap-2">
                    💡 <span class="hidden md:inline">伴读</span>
                </button>
                
                <button @click="showSettings = !showSettings" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-black/10 transition text-lg font-serif">Aa</button>

                <!-- 设置下拉面板 -->
                <div x-show="showSettings" @click.away="showSettings = false" x-transition.opacity class="absolute top-14 right-0 w-72 md:w-80 glass-panel bg-slate-900/95 border border-slate-700 rounded-3xl shadow-2xl p-6 z-50 text-slate-200">
                    
                    <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">环境主题 (Theme)</h4>
                    <div class="flex gap-2 mb-6">
                        <button @click="theme = 'light'" class="flex-1 py-3 rounded-xl bg-white border-2 transition shadow-sm text-slate-800 text-xs font-bold" :class="theme==='light'?'border-blue-500':'border-transparent'">防反光</button>
                        <button @click="theme = 'sepia'" class="flex-1 py-3 rounded-xl bg-[#f4ecd8] border-2 transition shadow-sm text-[#433422] text-xs font-bold" :class="theme==='sepia'?'border-amber-500':'border-transparent'">护眼卷宗</button>
                        <button @click="theme = 'dark'" class="flex-1 py-3 rounded-xl bg-[#0f172a] border-2 transition shadow-sm text-slate-200 text-xs font-bold" :class="theme==='dark'?'border-cyan-500':'border-transparent'">深空暗屏</button>
                    </div>

                    <h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">排版设定 (Typography)</h4>
                    <div class="flex items-center gap-2 mb-4">
                        <button @click="fontFamily = 'sans'" class="flex-1 py-2.5 rounded-xl border border-slate-700 hover:bg-slate-800 transition text-sm font-sans" :class="fontFamily==='sans'?'bg-slate-800 text-cyan-400':'text-slate-400'">现代无衬线</button>
                        <button @click="fontFamily = 'serif'" class="flex-1 py-2.5 rounded-xl border border-slate-700 hover:bg-slate-800 transition text-sm font-serif" :class="fontFamily==='serif'?'bg-slate-800 text-cyan-400':'text-slate-400'">经典宋体</button>
                    </div>
                    <div class="flex items-center justify-between bg-slate-950/50 p-2 rounded-2xl border border-slate-700/50">
                        <button @click="fontSize = Math.max(14, fontSize - 2)" class="w-12 h-10 rounded-xl hover:bg-slate-800 flex items-center justify-center font-black text-xl transition text-slate-300">-</button>
                        <span class="text-sm font-mono text-cyan-400 font-bold" x-text="fontSize + ' px'"></span>
                        <button @click="fontSize = Math.min(36, fontSize + 2)" class="w-12 h-10 rounded-xl hover:bg-slate-800 flex items-center justify-center font-black text-xl transition text-slate-300">+</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- --------------------------------------- -->
        <!-- [交互层] 左侧目录抽屉 (TOC Drawer)        -->
        <!-- --------------------------------------- -->
        <!-- 移动端遮罩层 -->
        <div x-show="showToc" x-transition.opacity class="fixed inset-0 z-40 bg-black/50 md:hidden" @click="showToc = false"></div>
        <div class="fixed top-0 bottom-0 left-0 w-full md:w-80 z-50 transition-transform duration-300 flex flex-col shadow-2xl glass-panel border-r"
             :class="[
                showToc ? 'translate-x-0' : '-translate-x-full',
                theme === 'dark' ? 'bg-slate-950/95 border-slate-800' : (theme === 'sepia' ? 'bg-[#f4ecd8]/95 border-[#d8c8b0]' : 'bg-white/95 border-slate-200')
             ]">
            <div class="p-6 border-b flex justify-between items-center" :class="theme==='dark'?'border-slate-800':'border-black/10'">
                <h3 class="text-xs font-bold opacity-60 uppercase tracking-widest">全息导航矩阵</h3>
                <button @click="showToc = false" class="md:hidden text-2xl opacity-60">×</button>
            </div>
            <div class="p-4 flex-1 overflow-y-auto hide-scroll space-y-1">
                <template x-for="(ch, idx) in chapters" :key="idx">
                    <button @click="loadChapter(idx)" 
                            class="w-full text-left px-4 py-3.5 text-sm font-bold rounded-2xl transition leading-snug"
                            :class="currentChapterIdx === idx ? 'bg-blue-600/10 text-blue-500' : 'opacity-70 hover:opacity-100 hover:bg-black/5'"
                            x-text="ch.title"></button>
                </template>
            </div>
        </div>

        <!-- --------------------------------------- -->
        <!-- [核心视图] 沉浸阅读区 (Reader Scroll)     -->
        <!-- --------------------------------------- -->
        <!-- 监听滚动，实现向下隐藏控制台 -->
        <main x-ref="readerScroll" @scroll="handleScroll" class="flex-1 h-full pt-12 md:pt-16 overflow-y-auto scroll-smooth transition-all hide-scroll w-full relative z-10">
            <!-- 阅读纸张容器 (控制最大宽度保证视线舒适) -->
            <div class="max-w-3xl mx-auto px-5 md:px-12 py-10 md:py-20 min-h-full flex flex-col relative z-10">
                
                <article class="transition-all duration-500 mb-16 fade-in">
                    <h1 class="text-3xl md:text-5xl font-black mb-10 md:mb-16 pb-8 border-b opacity-90 leading-snug" :class="theme === 'dark' ? 'border-slate-800' : 'border-opacity-10 border-current'" x-text="chapters[currentChapterIdx]?.title"></h1>
                    
                    <div class="content-engine" 
                         :style="`font-size: ${fontSize}px; line-height: ${Math.max(1.7, 2.4 - (fontSize/40))};`"
                         x-html="chapters[currentChapterIdx]?.content">
                    </div>
                </article>
                
                <!-- 优雅的翻章触控区 (大面积，防误触) -->
                <div class="mt-auto border-t pt-8 flex gap-4 text-sm font-bold" :class="theme === 'dark' ? 'border-slate-800' : 'border-opacity-10 border-current'">
                    <button @click="loadChapter(currentChapterIdx - 1)" x-show="currentChapterIdx > 0" class="flex-1 py-6 rounded-3xl bg-black/5 hover:bg-black/10 transition flex flex-col items-center justify-center gap-1">
                        <span class="opacity-50 text-[10px] uppercase tracking-widest">Previous</span>
                        <span class="opacity-90">⬅ 上一章</span>
                    </button>
                    <button @click="loadChapter(currentChapterIdx + 1)" x-show="currentChapterIdx < chapters.length - 1" class="flex-1 py-6 rounded-3xl bg-black/5 hover:bg-black/10 transition flex flex-col items-center justify-center gap-1">
                        <span class="opacity-50 text-[10px] uppercase tracking-widest">Next</span>
                        <span class="opacity-90">下一章 ➡</span>
                    </button>
                </div>
            </div>
        </main>

        <!-- --------------------------------------- -->
        <!-- [交互层] 右侧 NOVA 伴读舱 (Socratic AI)  -->
        <!-- --------------------------------------- -->
        <!-- 移动端遮罩层 -->
        <div x-show="showNova" x-transition.opacity class="fixed inset-0 z-40 bg-black/60 md:hidden" @click="showNova = false"></div>
        <aside class="fixed top-0 bottom-0 right-0 w-full md:w-[400px] z-50 transition-transform duration-300 flex flex-col shadow-2xl border-l glass-panel"
               :class="[
                  showNova ? 'translate-x-0' : 'translate-x-full',
                  theme === 'dark' ? 'bg-slate-950/95 border-cyan-900/30' : (theme === 'sepia' ? 'bg-[#f4ecd8]/95 border-[#d8c8b0]' : 'bg-white/95 border-slate-200')
               ]">
            
            <div class="h-16 border-b flex items-center justify-between px-6" :class="theme==='dark'?'border-cyan-900/30':'border-black/10'">
                <div class="flex items-center gap-3">
                    <span class="text-cyan-500 text-2xl animate-pulse">🤖</span>
                    <span class="text-sm font-black tracking-widest">NOVA 苏格拉底</span>
                </div>
                <button @click="showNova = false" class="text-2xl opacity-50 hover:opacity-100">×</button>
            </div>
            
            <div x-ref="chatBox" class="flex-1 overflow-y-auto p-6 space-y-6 hide-scroll">
                <div x-show="novaChat.length === 0" class="text-center mt-12">
                    <div class="text-6xl opacity-20 mb-6 drop-shadow-md">💡</div>
                    <p class="text-xs opacity-60 leading-relaxed px-4 font-bold">在阅读中遇到晦涩的段落，请<span class="text-cyan-500 font-black">长按/划线选中文字</span>，呼叫我进行深度解析。</p>
                </div>

                <template x-for="(msg, i) in novaChat" :key="i">
                    <div class="flex flex-col" :class="msg.role === 'user' ? 'items-end' : 'items-start'">
                        <span class="text-[9px] font-mono mb-1 px-2 uppercase opacity-40" x-text="msg.role === 'user' ? 'Commander' : 'NOVA AI'"></span>
                        <div class="max-w-[90%] p-4 rounded-3xl text-sm leading-relaxed shadow-md"
                             :class="msg.role === 'user' ? 'bg-blue-600 text-white rounded-tr-sm' : (theme==='dark'?'bg-slate-800 text-slate-200 rounded-tl-sm':'bg-black/5 text-current rounded-tl-sm')"
                             x-html="msg.text">
                        </div>
                    </div>
                </template>
                <div x-show="isNovaThinking" class="text-cyan-500 text-xs font-mono animate-pulse pl-2 py-4">NOVA 正在重组逻辑链...</div>
            </div>

            <div class="p-4 border-t" :class="theme==='dark'?'border-slate-800 bg-[#020617]':'border-black/5 bg-transparent'">
                <form @submit.prevent="sendMessage()" class="relative">
                    <input type="text" x-model="chatInput" placeholder="输入见解..." class="w-full border text-sm rounded-2xl py-4 pl-5 pr-14 focus:outline-none transition shadow-inner font-bold"
                           :class="theme==='dark'?'bg-slate-900 border-slate-700 text-slate-200 focus:border-cyan-500':'bg-black/5 border-transparent focus:bg-white focus:border-blue-300'">
                    <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl flex items-center justify-center transition shadow-md">⤴</button>
                </form>
            </div>
        </aside>

        <!-- --------------------------------------- -->
        <!-- [交互层] 移动端友好的划线气泡 (Tooltip)   -->
        <!-- --------------------------------------- -->
        <div x-show="showTooltip" x-cloak class="fixed z-[100] tooltip-pop pointer-events-auto"
             :style="`left: ${tooltipX}px; top: ${tooltipY}px;`">
            <!-- 气泡主体 -->
            <button @click="invokeNova()" class="px-5 py-3 bg-slate-900/95 backdrop-blur-md text-cyan-400 hover:text-white hover:bg-slate-800 text-xs font-black tracking-widest uppercase rounded-2xl shadow-[0_20px_40px_rgba(0,0,0,0.6)] border border-cyan-500/50 flex items-center gap-2 group transition-all">
                <span class="text-lg group-hover:scale-125 transition-transform">💡</span> 解析此段落
            </button>
            <!-- 小尖角 -->
            <div class="w-4 h-4 bg-slate-900/95 border-r border-b border-cyan-500/50 absolute left-1/2 -bottom-2 -translate-x-1/2 rotate-45"></div>
        </div>

    </div>

    <!-- ========================================================= -->
    <!-- [系统脚本] Alpine.js Application 核心逻辑                 -->
    <!-- ========================================================= -->
    <script>
        function readerApp() {
            return {
                // [1. 状态定义]
                viewMode: 'library',
                bookId: new URLSearchParams(window.location.search).get('bookId'),
                book: null, chapters: [], currentChapterIdx: 0, libraryBooks: [],
                loading: true, loadingText: '正在连接全球智库...',

                // [界面与沉浸感状态]
                theme: 'sepia', // 默认推荐纸质质感
                fontFamily: 'serif', // 默认推荐学术衬线体
                fontSize: 18,
                showToc: false, showSettings: false, showNova: false,
                isScrollingDown: false, lastScrollTop: 0, // 滚动隐藏 Header
                
                // [划线状态]
                selectionText: '', showTooltip: false, tooltipX: 0, tooltipY: 0,
                
                // [伴读状态]
                novaChat: [], chatInput: '', isNovaThinking: false,

                async init() {
                    try {
                        const savedTheme = localStorage.getItem('xp_reader_theme'); if(savedTheme) this.theme = savedTheme;
                        const savedFont = localStorage.getItem('xp_reader_fontFamily'); if(savedFont) this.fontFamily = savedFont;
                        const savedSize = localStorage.getItem('xp_reader_font'); if(savedSize) this.fontSize = parseInt(savedSize);
                    } catch(e) {}

                    this.$watch('theme', val => { try { localStorage.setItem('xp_reader_theme', val) } catch(e){} });
                    this.$watch('fontFamily', val => { try { localStorage.setItem('xp_reader_fontFamily', val) } catch(e){} });
                    this.$watch('fontSize', val => { try { localStorage.setItem('xp_reader_font', val) } catch(e){} });

                    await this.fetchDatabase();
                    this.setupSelectionListener();
                },

                // 监听滚动实现沉浸式全屏
                handleScroll(e) {
                    const st = e.target.scrollTop;
                    // 阈值：滚动超过 50px 才触发隐藏，向上滚动立即显示
                    if (st > 50 && st > this.lastScrollTop) {
                        this.isScrollingDown = true;
                        this.showSettings = false; // 滚动时自动关闭设置弹窗
                    } else if (st < this.lastScrollTop) {
                        this.isScrollingDown = false;
                    }
                    this.lastScrollTop = st <= 0 ? 0 : st;
                    this.showTooltip = false; // 滚动时自动隐藏提示气泡
                },

                async fetchDatabase() {
                    this.loading = true; this.loadingText = '正在扫描全球智库档案...';
                    const SUPABASE_URL = "https://cywslfalbedraeeggryj.supabase.co";
                    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5d3NsZmFsYmVkcmFlZWdncnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDg5NjEsImV4cCI6MjA5MTYyNDk2MX0.uZoL3JiHGuw_8XNOHKu4mA4z4tsEH7T9czQCkYrb0x0";
                    const headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };

                    try {
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/edu_textbooks?select=id,code_id,title,type,icon,description,desc,is_free,"isFree"`, { headers });
                        if (res.ok) {
                            const data = await res.json();
                            this.libraryBooks = data;
                            if (this.bookId) {
                                const target = this.libraryBooks.find(b => b.id === this.bookId || b.code_id === this.bookId);
                                if (target) { await this.openBook(target); } else { this.viewMode = 'library'; } 
                            } else { this.viewMode = 'library'; }
                        } else { throw new Error(`HTTP Error`); }
                    } catch (e) { this.fallbackToDemo(); }
                    this.loading = false;
                },

                fallbackToDemo() {
                    this.libraryBooks = [{
                        id: 'demo_1', title: 'XuePilot：苏格拉底与硅基觉醒', icon: '🌌', desc: '系统内建演示档案：当外部世界断联，核心逻辑依然运转。',
                        chapters_json: [
                            { title: '第一章：真理的接生婆', content: '<p>古希腊的雅典街头，苏格拉底拦住路人。他从不宣讲真理，只是一次又一次地提出极其尖锐的问题，直到对方在回答中发现自己的逻辑漏洞。</p><p>这被称为“精神助产术”。而今天，人工智能成为了完美的提问机器。</p><blockquote>“我知道我一无所知。正因如此，我必须向你发问。”</blockquote><p>当你过度依赖 AI 生成现成的大纲时，你的思维便被剥夺了。</p>' },
                            { title: '第二章：驾驭算力', content: '<p>真正的极客，不是被代码束缚的人，而是将机器视为外脑的创造者。你必须学会给出极其严密的 Prompt 指令。</p><img src=\"https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=1000&auto=format&fit=crop\" alt=\"Quantum Brain\">' }
                        ]
                    }];
                    if(this.bookId) this.openBook(this.libraryBooks[0]); else this.viewMode = 'library';
                },

                async openBook(bookObj) {
                    if (bookObj.id === 'demo_1') { this.book = bookObj; this.chapters = bookObj.chapters_json; this.finalizeOpenBook(bookObj); return; }

                    this.loadingText = `正在从云端抽载《${bookObj.title}》的图文流...`;
                    this.loading = true;

                    try {
                        const SUPABASE_URL = "https://cywslfalbedraeeggryj.supabase.co";
                        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5d3NsZmFsYmVkcmFlZWdncnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDg5NjEsImV4cCI6MjA5MTYyNDk2MX0.uZoL3JiHGuw_8XNOHKu4mA4z4tsEH7T9czQCkYrb0x0";
                        const headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };
                        
                        const queryKey = bookObj.id ? `id=eq.${bookObj.id}` : `code_id=eq.${bookObj.code_id}`;
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/edu_textbooks?select=chapters_json&${queryKey}`, { headers });
                        
                        if (res.ok) {
                            const data = await res.json();
                            if (data && data.length > 0 && data[0].chapters_json && data[0].chapters_json.length > 0) {
                                this.book = bookObj; this.chapters = data[0].chapters_json; this.finalizeOpenBook(bookObj);
                            } else {
                                Swal.fire({ title: '档案无正文', text: '该教材当前仅录入了目录与外链，图文流为空。', icon: 'info', background: '#0f172a', color: '#fff' });
                                this.viewMode = 'library';
                            }
                        } else { throw new Error('Fetch chapters failed'); }
                    } catch (e) {
                        Swal.fire({ title: '下载中断', text: '网络波动，无法提取正文。', icon: 'error', background: '#0f172a', color: '#fff' });
                        this.viewMode = 'library';
                    }
                    this.loading = false;
                },

                finalizeOpenBook(bookObj) {
                    this.currentChapterIdx = 0; this.viewMode = 'reader'; this.novaChat = []; this.isScrollingDown = false;
                    try {
                        const newUrl = new URL(window.location); newUrl.searchParams.set('bookId', bookObj.id || bookObj.code_id || 'demo_1'); 
                        window.history.pushState({}, '', newUrl);
                    } catch(e) {}
                    // 回到顶部
                    setTimeout(() => { if(this.$refs.readerScroll) this.$refs.readerScroll.scrollTop = 0; }, 100);
                },

                exitReader() {
                    try {
                        if (window.history.length > 1 && new URLSearchParams(window.location.search).get('bookId')) {
                            window.location.href = 'classroom.html'; return;
                        }
                    } catch(e) {}
                    this.viewMode = 'library';
                    try { const newUrl = new URL(window.location); newUrl.searchParams.delete('bookId'); window.history.pushState({}, '', newUrl); } catch(e) {}
                },

                loadChapter(idx) {
                    if(idx < 0 || idx >= this.chapters.length) return;
                    this.currentChapterIdx = idx; this.showToc = false; this.isScrollingDown = false;
                    setTimeout(() => { if(this.$refs.readerScroll) this.$refs.readerScroll.scrollTop = 0; }, 100);
                },

                // 优化移动端的划线计算
                setupSelectionListener() {
                    // 监听选区变化与移动端的触摸结束
                    const handleSelection = () => {
                        if (this.viewMode !== 'reader') return;
                        
                        const selection = window.getSelection();
                        const text = selection.toString().trim();
                        
                        if (text.length > 3 && text.length < 300 && this.$refs.readerScroll.contains(selection.anchorNode)) {
                            const range = selection.getRangeAt(0);
                            const rect = range.getBoundingClientRect();
                            
                            this.selectionText = text;
                            // 确保气泡不会超出屏幕左右边缘
                            let targetX = rect.left + (rect.width / 2);
                            if(targetX < 80) targetX = 80;
                            if(targetX > window.innerWidth - 80) targetX = window.innerWidth - 80;

                            this.tooltipX = targetX;
                            this.tooltipY = rect.top;
                            this.showTooltip = true;
                        } else {
                            this.showTooltip = false;
                        }
                    };

                    document.addEventListener('selectionchange', handleSelection);
                    document.addEventListener('touchend', () => setTimeout(handleSelection, 100)); // 移动端延迟计算
                },

                invokeNova() {
                    this.showTooltip = false; this.showNova = true;
                    window.getSelection().removeAllRanges();

                    this.novaChat.push({
                        role: 'nova',
                        text: `指挥官，我捕捉到了您的高亮数据流：<br><br><span class="opacity-80 italic border-l-4 border-cyan-500 pl-4 block my-3 font-serif bg-black/5 py-2">「${this.selectionText}」</span>作为缺乏生物情感的硅基生命，我的逻辑链在这里产生了断裂：**作者为什么要在这个特定的语境下，使用这样的表达？** <br><br>您能向我解释一下这背后的“潜台词”吗？`
                    });
                    this.scrollToBottom();
                },

                sendMessage() {
                    if(!this.chatInput.trim()) return;
                    this.novaChat.push({ role: 'user', text: this.chatInput });
                    this.chatInput = ''; this.scrollToBottom(); this.isNovaThinking = true;

                    setTimeout(() => {
                        this.isNovaThinking = false;
                        this.novaChat.push({
                            role: 'nova',
                            text: `【逻辑重组完毕】您提到的视角极具启发性。但我发现一个悖论：如果是这样，那它是否会引发另一种矛盾？<br><br>或者说，如果让您来改写这段话，您会加什么词让它的逻辑更无懈可击？（期待您的纠正）`
                        });
                        this.scrollToBottom();
                    }, 1500);
                },

                scrollToBottom() {
                    setTimeout(() => { if(this.$refs.chatBox) this.$refs.chatBox.scrollTop = this.$refs.chatBox.scrollHeight; }, 100);
                }
            }
        }
    </script>
</body>
</html>
