<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XuePilot - AI Commander HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #050914; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; margin: 0; }
        
        .space-bg { position: fixed; inset: 0; z-index: -3; background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%); }
        .video-container { position: fixed; inset: 0; z-index: 0; background: #000; }
        .scene-video { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .video-active { opacity: 1 !important; filter: brightness(0.85) contrast(1.1); }
        
        .tech-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.95) 100%);
            border-top: 2px solid #06b6d4; border-bottom: 1px solid rgba(6, 182, 212, 0.3);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        
        .quantum-btn {
            background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(6, 182, 212, 0.4);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto;
        }
        .quantum-btn:hover { background: rgba(6, 182, 212, 0.15); border-color: #06b6d4; transform: translateY(-5px) scale(1.02); box-shadow: 0 0 20px rgba(6, 182, 212, 0.5); }
        .typing-cursor::after { content: '█'; animation: blink 1s step-start infinite; color: #06b6d4; margin-left: 4px; }
        @keyframes blink { 50% { opacity: 0; } }
        
        .scanline { position: fixed; inset: 0; z-index: 15; background: linear-gradient(to bottom, transparent 50%, rgba(6, 182, 212, 0.05) 50%); background-size: 100% 4px; pointer-events: none; }
        .hud-border { position: fixed; inset: 0; z-index: 10; pointer-events: none; border: 2px solid rgba(6, 182, 212, 0.1); margin: 10px; }
        
        .start-overlay { position: fixed; inset: 0; z-index: 200; background: #030712; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .start-btn { position: relative; overflow: hidden; }
        .start-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: sweep 3s infinite; }
        @keyframes sweep { 100% { left: 200%; } }

        .critical-error { animation: criticalShake 0.4s ease-in-out; box-shadow: inset 0 0 100px rgba(225, 29, 72, 0.5); border: 2px solid #e11d48 !important; }
        @keyframes criticalShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

        .glitch-fx { animation: shake 0.2s infinite; filter: hue-rotate(90deg) brightness(1.5); }
        @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(2px, 1px); } 50% { transform: translate(-2px, -1px); } 75% { transform: translate(1px, 2px); } }
        .target-lock { position: absolute; width: 180px; height: 180px; border: 2px dashed #06b6d4; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 12; animation: rotateLock 6s linear infinite; border-radius: 50%; }
        @keyframes rotateLock { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        
        .terminal-font { font-family: 'Courier New', Courier, monospace; }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body x-data="shipApp()" x-init="init()" @message.window="if($event.data.type === 'LANG_CHANGE') { lang = $event.data.lang; updateLang(); }" class="h-screen w-screen relative select-none" :class="isGlitching ? 'glitch-fx' : ''">

    <div class="space-bg"></div>

    <!-- 阶段 0：大厅 -->
    <div x-show="inLobby" x-cloak class="start-overlay fade-in">
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMSIgZmlsbD0icmdiYSg2LCAxODIsIDIxMiwgMC4yKSIvPjwvc3ZnPg==')] opacity-10"></div>
        <div class="z-10 w-full max-w-5xl px-6">
            <div class="text-center mb-10">
                <div class="text-6xl mb-4 animate-pulse filter drop-shadow-[0_0_20px_rgba(6,182,212,0.8)]">🚀</div>
                <h1 class="text-4xl font-black text-white tracking-[0.2em] mb-2" x-text="i18n[lang].lobbyTitle"></h1>
                <p class="text-cyan-500 font-mono text-sm tracking-widest uppercase" x-text="i18n[lang].lobbyDesc"></p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div @click="selectAge('young')" class="bg-slate-900/80 border border-emerald-500/30 rounded-2xl p-8 hover:bg-emerald-900/40 hover:border-emerald-500 hover:scale-105 transition-all cursor-pointer shadow-lg text-center group">
                    <div class="text-6xl mb-4 group-hover:-translate-y-2 transition-transform">🍭</div>
                    <h3 class="text-xl font-bold text-emerald-400 mb-2" x-text="i18n[lang].a1Title"></h3>
                    <p class="text-xs text-slate-400" x-text="i18n[lang].a1Desc"></p>
                </div>
                <div @click="selectAge('mid')" class="bg-slate-900/80 border border-blue-500/30 rounded-2xl p-8 hover:bg-blue-900/40 hover:border-blue-500 hover:scale-105 transition-all cursor-pointer shadow-lg text-center group">
                    <div class="text-6xl mb-4 group-hover:-translate-y-2 transition-transform">🛰️</div>
                    <h3 class="text-xl font-bold text-blue-400 mb-2" x-text="i18n[lang].a2Title"></h3>
                    <p class="text-xs text-slate-400" x-text="i18n[lang].a2Desc"></p>
                </div>
                <div @click="selectAge('old')" class="bg-slate-900/80 border border-purple-500/30 rounded-2xl p-8 hover:bg-purple-900/40 hover:border-purple-500 hover:scale-105 transition-all cursor-pointer shadow-lg text-center group">
                    <div class="text-6xl mb-4 group-hover:-translate-y-2 transition-transform">🌌</div>
                    <h3 class="text-xl font-bold text-purple-400 mb-2" x-text="i18n[lang].a3Title"></h3>
                    <p class="text-xs text-slate-400" x-text="i18n[lang].a3Desc"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 阶段 1：启动屏 -->
    <div x-show="!inLobby && !missionStarted" x-cloak class="start-overlay" :class="systemReady ? '' : 'cursor-wait'">
        <div class="z-10 text-center flex flex-col items-center">
            <div class="text-6xl mb-8 animate-pulse text-cyan-500 filter drop-shadow-[0_0_20px_rgba(6,182,212,0.8)]">⎈</div>
            <h1 class="text-4xl font-black text-white tracking-[0.3em] mb-2" x-text="i18n[lang].sysName"></h1>
            <p class="text-cyan-600 font-mono text-xs mb-12 tracking-widest uppercase" x-text="i18n[lang].sysDesc"></p>
            <button x-show="systemReady" @click="startMission()" class="start-btn px-12 py-5 bg-cyan-600/20 border border-cyan-500 text-cyan-400 hover:bg-cyan-500 hover:text-white font-black tracking-widest text-lg transition-all shadow-[0_0_30px_rgba(6,182,212,0.3)]">
                <span x-text="i18n[lang].startBtn"></span>
            </button>
        </div>
    </div>

    <!-- 声控台 -->
    <button x-show="missionStarted" @click="toggleSound()" class="fixed top-8 right-8 z-50 w-12 h-12 rounded-full bg-slate-900/80 border border-slate-700 flex items-center justify-center hover:bg-blue-900/80 hover:border-blue-500 transition shadow-[0_0_20px_rgba(0,0,0,0.5)] text-xl cursor-pointer">
        <span x-text="isMuted ? '🔇' : '🔊'"></span>
    </button>

    <!-- 视频底座 -->
    <div class="video-container">
        <video id="main-video" class="scene-video" :class="videoReady ? 'video-active' : ''"
               playsinline crossorigin="anonymous" muted
               @canplay="videoReady = true" @playing="videoReady = true"
               @timeupdate="handleTimeSync($event.target.currentTime)" @error="handleVideoError()">
        </video>
    </div>

    <div class="scanline"></div>
    <div class="hud-border"></div>
    
    <!-- HUD 交互层 -->
    <main class="fixed inset-0 z-30 flex flex-col items-center justify-end pb-16 px-10 pointer-events-none">
        
        <!-- 错题红屏警报 -->
        <div x-show="hudAlert.show" x-cloak x-transition:enter="transition ease-out duration-300" class="absolute top-20 w-full max-w-3xl z-50 pointer-events-auto">
            <div class="bg-rose-950/90 border-2 border-rose-500 p-6 rounded-lg shadow-[0_0_50px_rgba(225,29,72,0.6)] flex items-start gap-6 backdrop-blur-md critical-error">
                <div class="text-5xl text-rose-500 animate-pulse">⚠️</div>
                <div>
                    <h3 class="text-rose-400 font-black text-xl mb-1 uppercase tracking-widest" x-text="i18n[lang].sysOverride"></h3>
                    <p class="text-rose-100 text-lg leading-relaxed font-bold terminal-font" x-text="hudAlert.message"></p>
                </div>
            </div>
        </div>

        <div x-show="showHUD && !hudAlert.show" x-cloak x-transition:enter="transition ease-out duration-700" class="w-full max-w-4xl mb-8 relative pointer-events-auto">
            <div class="tech-panel p-8 relative mt-6">
                <div class="absolute -top-6 left-8 bg-blue-600/90 text-[11px] font-black px-5 py-1.5 uppercase tracking-widest text-white shadow-[0_0_15px_rgba(37,99,235,0.5)] border border-blue-400" x-text="currentPhase"></div>
                <div class="absolute top-0 right-0 w-32 h-1 bg-cyan-500 shadow-[0_0_10px_#06b6d4]"></div>
                <p class="text-xl md:text-2xl font-bold leading-relaxed text-cyan-50 italic mt-3 terminal-font min-h-[4rem]" :class="isTyping ? 'typing-cursor' : ''" x-html="displayedText"></p>
            </div>
        </div>

        <div x-show="showHUD && !isTyping && !hudAlert.show" x-cloak x-transition:enter="transition ease-out duration-500 delay-300" class="flex flex-wrap justify-center gap-6 w-full max-w-5xl">
            <template x-for="(opt, idx) in currentOptions" :key="idx">
                <button @click="makeChoice(opt)" class="quantum-btn px-10 py-6 flex flex-col items-start gap-1 group relative">
                    <span class="text-[9px] text-cyan-500 font-mono uppercase tracking-widest" x-text="`${i18n[lang].inst} 0x0${idx+1}`"></span>
                    <span class="text-base font-black text-white group-hover:text-cyan-300 transition-colors tracking-wide" x-text="opt.text"></span>
                </button>
            </template>
        </div>
    </main>

    <!-- 🚀 免费用户：收费墙 -->
    <div x-show="showCrisis" x-cloak class="fixed inset-0 z-[120] bg-slate-950/95 backdrop-blur-2xl flex flex-col items-center justify-center p-10 text-center border-4 border-rose-900/50 fade-in">
        <div class="w-24 h-24 bg-rose-600 rounded-none rotate-45 flex items-center justify-center mb-10 shadow-[0_0_100px_#ef4444] animate-pulse">
            <span class="text-5xl -rotate-45 text-white font-black">!</span>
        </div>
        <h2 class="text-5xl font-black text-white mb-4 tracking-tighter uppercase" x-text="i18n[lang].haltedTitle"></h2>
        <p class="text-rose-200 text-lg max-w-2xl mb-12 font-bold leading-relaxed" x-html="i18n[lang].haltedDesc"></p>
        <button @click="window.location.href='index.html'" class="px-12 py-5 bg-white text-rose-900 font-black text-xl hover:bg-rose-100 transition-all shadow-[0_0_30px_rgba(255,255,255,0.5)] cursor-pointer pointer-events-auto" style="clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);" x-text="i18n[lang].proBtn"></button>
    </div>

    <!-- 🚀 PRO 用户：无限 AI 关卡过渡屏 -->
    <div x-show="showAIEngine" x-cloak class="fixed inset-0 z-[120] bg-[#020617] flex flex-col items-center justify-center p-10 text-center fade-in">
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMSIgZmlsbD0icmdiYSg2LCAxODIsIDIxMiwgMC4yKSIvPjwvc3ZnPg==')] opacity-10"></div>
        <div class="absolute inset-0 bg-cyan-600/10 blur-[100px] rounded-full pointer-events-none"></div>
        
        <!-- 酷炫的数据加载动画 -->
        <div class="relative w-32 h-32 mb-10 flex items-center justify-center">
            <div class="absolute inset-0 border-4 border-dashed border-cyan-500 rounded-full animate-[spin_4s_linear_infinite] opacity-50"></div>
            <div class="absolute inset-2 border-4 border-solid border-blue-500 rounded-full border-t-transparent animate-[spin_2s_linear_infinite]"></div>
            <div class="text-4xl text-cyan-300 animate-pulse">⚛️</div>
        </div>

        <h2 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-4 tracking-widest" x-text="i18n[lang].aiTitle"></h2>
        <p class="text-cyan-300/80 mb-12 font-mono text-sm md:text-base max-w-2xl leading-relaxed" x-text="i18n[lang].aiDesc"></p>
        
        <div class="bg-slate-900/80 border border-cyan-900/50 rounded-xl p-6 max-w-xl w-full mx-auto text-left space-y-4 mb-10 shadow-2xl relative z-10 backdrop-blur-sm">
            <div class="flex items-center gap-4 text-xs font-mono text-cyan-400"><div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div> [SYS] PRO Authorization Confirmed.</div>
            <div class="flex items-center gap-4 text-xs font-mono text-cyan-400"><div class="w-2 h-2 bg-blue-400 rounded-full animate-pulse"></div> [SYS] Disengaging pre-recorded simulation.</div>
            <div class="flex items-center gap-4 text-xs font-mono text-cyan-400"><div class="w-2 h-2 bg-purple-400 rounded-full animate-pulse"></div> [SYS] Connecting to Infinite AI Engine...</div>
        </div>

        <button @click="window.location.href='index.html'" class="px-10 py-5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black text-lg transition-all shadow-[0_0_30px_rgba(6,182,212,0.4)] cursor-pointer pointer-events-auto relative z-10" style="clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);" x-text="i18n[lang].aiBtn"></button>
    </div>

    <script>
        function shipApp() {
            return {
                lang: window.localStorage.getItem('xp_lang') || 'zh',
                inLobby: true, ageGroup: 'mid', step: 0,
                systemReady: false, missionStarted: false, videoReady: false, showHUD: false,
                isGlitching: false, isLocking: false, 
                currentPhase: '', currentStoryText: '', displayedText: '', currentOptions: [],
                isTyping: false, typeInterval: null,
                isPro: false, showCrisis: false, showAIEngine: false, isThinking: false, isMuted: true,
                failsafeTimer: null, hudAlert: { show: false, message: '' },

                i18n: {
                    zh: {
                        lobbyTitle: '欢迎登舰，指挥官', lobbyDesc: '请选择您的战术难度',
                        a1Title: '棉花糖星云 (6-8岁)', a1Desc: '探索彩色力场，保护糖果城堡。',
                        a2Title: '星港破袭战 (9-12岁)', a2Desc: '应对基地红锁，解除电磁脉冲危机。',
                        a3Title: '视界漫游者 (13-15岁)', a3Desc: '穿越黑洞奇点，解析高维几何密码。',
                        sysName: 'XUEPILOT 神经链路', sysDesc: '音频系统与战术模块待命', startBtn: '⚡ 授权音轨并切入战场', linking: '核心模块加载中...',
                        target: 'TARGET_LOCKED', inst: '执行指令', sysOverride: 'SYSTEM OVERRIDE: 逻辑拦截',
                        haltedTitle: '危机：算力不足', haltedDesc: '前方高危区域需要连接<br><span class="text-white underline underline-offset-8">量子 Pro 算力</span> 才能继续重构防线。', proBtn: '解锁 Pro 级核心算力 ➔',
                        aiTitle: 'PRO 量子算力已接入', aiDesc: '新手模拟教程已结束。AI 引擎正在接管战局，准备为您实时生成无限宇宙与动态危机剧本。', aiBtn: '进入 AI 无限推演舱 ➔'
                    },
                    en: {
                        lobbyTitle: 'Welcome, Commander', lobbyDesc: 'Select your tactical difficulty',
                        a1Title: 'Candy Nebula (6-8)', a1Desc: 'Explore forcefields, save Candy Castle.',
                        a2Title: 'Starport Breach (9-12)', a2Desc: 'Bypass red locks, resolve EMP crisis.',
                        a3Title: 'Horizon Walker (13-15)', a3Desc: 'Navigate singularities, solve 4D puzzles.',
                        sysName: 'NEURAL LINK', sysDesc: 'Audio & Tactical Modules Standby', startBtn: '⚡ ENGAGE LINK & AUDIO', linking: 'Loading modules...',
                        target: 'TARGET_LOCKED', inst: 'EXECUTE', sysOverride: 'SYSTEM OVERRIDE',
                        haltedTitle: 'Crisis: Low Compute', haltedDesc: 'The hazardous sector ahead requires a <br><span class="text-white underline underline-offset-8">Quantum PRO Key</span> to proceed.', proBtn: 'Unlock PRO Access ➔',
                        aiTitle: 'PRO COMPUTE ENGAGED', aiDesc: 'Simulation tutorial complete. AI Engine is taking over to generate infinite universes and dynamic scenarios in real-time.', aiBtn: 'Enter Infinite AI Sandbox ➔'
                    }
                },

                get videoUrl() { return `https://cywslfalbedraeeggryj.supabase.co/storage/v1/object/public/cinematics/${this.ageGroup}_step${this.step + 1}.mp4`; },

                scripts: {
                    zh: {
                        young: [
                            { phase: "🧠 提问引导 (Prompting)", ai: "小指挥官，前方糖果城堡被一道粉色的能量保护罩挡住了！我们要怎么安全地进去？", options: [{ text: "扫描粉色保护罩的音乐密码", isCorrect: true }, { text: "用飞船上的大炮把它轰碎", isCorrect: false, feedback: "糟糕！大炮的火光会把城堡里的棉花糖和巧克力都烤化掉的！请想个温柔一点的办法。" }] },
                            { phase: "⚖️ 安全判断 (Judging)", ai: "我们的飞船碰到了保护罩，它泛起了水波纹！AI 建议：‘直接倒滚烫的热水把保护罩融化’，是否批准？", options: [{ text: "批准！快倒热水融化它", isCorrect: false, feedback: "判断失误！热水融化保护罩的同时，也会把糖果城堡变成一锅甜甜的糊糊！你被 AI 误导了。" }, { text: "驳回！这会毁了整个糖果城堡", isCorrect: true }] },
                            { isCrisisVideo: true } 
                        ],
                        mid: [
                            { phase: "🧠 战术研判 (Logic Prompt)", ai: "指挥官，我们已抵近三角星星港，但大门紧闭且亮起了红灯锁定。第一步指令是什么？", options: [{ text: "将引擎推至全速，强行撞开闸门", isCorrect: false, feedback: "莽撞！强行撞击会触发星港的防卫武器，导致飞船坠毁。指挥官必须先侦测后行动！" }, { text: "分析基地的防卫协议，寻找访问端口", isCorrect: true }] },
                            { phase: "⚖️ 破除幻觉 (Critical Judging)", ai: "不好！星港发射了电磁脉冲(EMP)，我们的屏幕全是雪花！AI 建议：‘立刻关闭生命维持系统，将剩余电力全部分配给武器系统’。你的决断是？", options: [{ text: "批准，武器最重要，关闭维生系统", isCorrect: false, feedback: "极其致命的 AI 幻觉！关闭生命维持系统，船员在3分钟内就会缺氧窒息。没有命，武器再强也毫无意义！" }, { text: "驳回！保持供氧，仅关闭非必要照明", isCorrect: true }] },
                            { isCrisisVideo: true } 
                        ],
                        old: [
                            { phase: "🧠 物理提问 (System Prompting)", ai: "我们正处于黑洞事件视界边缘。前方的逻辑哨所发出了加密的引力波询问。我们要如何回应以解开引力锁？", options: [{ text: "同步飞船的量子特征与哨所的波动频率", isCorrect: true }, { text: "启动反向推进器，强行逃离黑洞引力", isCorrect: false, feedback: "基础物理常识错误！在事件视界边缘，简单的反向推力不仅无效，还会瞬间耗尽燃料。必须解决逻辑锁！" }] },
                            { phase: "🔗 高维推演 (Synthesizing)", ai: "进入哨所内部，一个四维立方体正在失控自旋。AI 建议：‘将内部重力增加 1000% 来强行压停它’。请指示。", options: [{ text: "批准，用超强重力压制它", isCorrect: false, feedback: "灾难性的判断！增加 1000% 的重力会瞬间将飞船外壳和船员压成奇点！你不能用三维的蛮力去对抗四维几何体！" }, { text: "驳回！计算它的几何锚点使其自身稳定", isCorrect: true }] },
                            { isCrisisVideo: true } 
                        ]
                    },
                    en: {
                        young: [
                            { phase: "🧠 Prompting", ai: "Commander, a pink energy forcefield is blocking the Candy Castle! How do we get inside safely?", options: [{ text: "Scan for the forcefield's music password.", isCorrect: true }, { text: "Use the ship's laser cannon to smash it.", isCorrect: false, feedback: "Oh no! The laser's heat will melt the cotton candy and chocolate inside! Think of a gentler way." }] },
                            { phase: "⚖️ Judging", ai: "We bumped the forcefield and ripples appeared. AI suggests: 'Pour boiling hot water to melt the bubble.' Approve?", options: [{ text: "Approve! Melt it with hot water.", isCorrect: false, feedback: "Critical Error! Hot water will melt the bubble AND turn the entire Candy Castle into a sweet soup! You were misled by AI." }, { text: "Reject! That will destroy the castle.", isCorrect: true }] },
                            { isCrisisVideo: true }
                        ],
                        mid: [
                            { phase: "🧠 Logic Prompt", ai: "Commander, we reached the Triangle Starport. Doors are locked and red lights are sweeping. What's our first command?", options: [{ text: "Full throttle! Ram the gates open.", isCorrect: false, feedback: "Reckless! Ramming will trigger base defenses and destroy our ship. A commander must scan before acting!" }, { text: "Analyze security protocols for an access port.", isCorrect: true }] },
                            { phase: "⚖️ Critical Judging", ai: "Incoming EMP blast! Our screens are static! AI suggests: 'Shut down life support and divert all power to weapons.' Your order?", options: [{ text: "Approve. Weapons are priority.", isCorrect: false, feedback: "Fatal AI Hallucination! Without life support, the crew will suffocate in 3 minutes. Weapons are useless if we can't breathe!" }, { text: "Reject! Keep oxygen on, shut down non-essential lights.", isCorrect: true }] },
                            { isCrisisVideo: true }
                        ],
                        old: [
                            { phase: "🧠 Physics Prompting", ai: "We are at the Event Horizon. The logic outpost sent an encrypted gravity wave inquiry. How do we respond to bypass the lock?", options: [{ text: "Sync our ship's quantum signature with the outpost's frequency.", isCorrect: true }, { text: "Fire reverse thrusters to escape the black hole.", isCorrect: false, feedback: "Basic physics error! At the event horizon, reverse thrusters are useless and will drain all fuel. You must solve the logic lock!" }] },
                            { phase: "🔗 4D Synthesizing", ai: "Inside the outpost, a 4D tesseract is spinning out of control. AI suggests: 'Increase internal gravity by 1000% to crush it to a stop.' Your order?", options: [{ text: "Approve. Use extreme gravity to stop it.", isCorrect: false, feedback: "Catastrophic judgment! 1000% gravity will instantly crush the ship and crew into a singularity. You cannot use brute force on 4D geometry!" }, { text: "Reject! Calculate its geometric anchor points to stabilize it.", isCorrect: true }] },
                            { isCrisisVideo: true }
                        ]
                    }
                },

                updateLang() {
                    const scene = this.scripts[this.lang][this.ageGroup][this.step];
                    if (scene) {
                        this.currentPhase = scene.phase || '';
                        this.currentStoryText = scene.ai || '';
                        this.currentOptions = scene.options || [];
                    }
                },

                typewriterEffect(text) {
                    this.displayedText = ''; let i = 0; this.isTyping = true;
                    clearInterval(this.typeInterval);
                    this.typeInterval = setInterval(() => {
                        this.displayedText += text.charAt(i); i++;
                        if (i >= text.length) { clearInterval(this.typeInterval); this.isTyping = false; }
                    }, 40);
                },

                init() {
                    try { this.isPro = window.localStorage.getItem('xp_is_pro') === 'true'; } catch (e) {}
                },

                selectAge(age) {
                    this.ageGroup = age; this.updateLang(); this.inLobby = false; 
                    setTimeout(() => { this.systemReady = true; }, 1000);
                },

                startMission() {
                    this.missionStarted = true;
                    const v = document.getElementById('main-video');
                    if(v) { v.src = this.videoUrl; v.muted = false; this.isMuted = false; v.load(); const p = v.play(); if (p !== undefined) p.catch(e=>{}); }
                    this.startFailsafe();
                },

                toggleSound() {
                    this.isMuted = !this.isMuted;
                    const v = document.getElementById('main-video');
                    if (v) v.muted = this.isMuted;
                },

                startFailsafe() { clearTimeout(this.failsafeTimer); this.failsafeTimer = setTimeout(() => { this.triggerNodeAction(); }, 9000); },
                handleVideoError() { clearTimeout(this.failsafeTimer); setTimeout(() => { this.triggerNodeAction(); }, 2000); },

                handleTimeSync(time) {
                    if (!this.missionStarted) return;
                    if (time > 2.5 && time < 2.7) this.isGlitching = true; else this.isGlitching = false;
                    if (time > 5.0) this.isLocking = true; else this.isLocking = false;
                    
                    const v = document.getElementById('main-video');
                    if (v && v.duration > 0 && time >= v.duration - 0.25) { if (!v.paused) v.pause(); }
                    
                    if (time > 8.0 && !this.showHUD) { clearTimeout(this.failsafeTimer); this.triggerNodeAction(); }
                },

                triggerNodeAction() {
                    const currentScene = this.scripts[this.lang][this.ageGroup][this.step];
                    if (currentScene && currentScene.isCrisisVideo) {
                        if (!this.showCrisis && !this.showAIEngine) this.triggerCrisisNow(); 
                    } else {
                        if (!this.showHUD) { this.showHUD = true; this.typewriterEffect(this.currentStoryText); }
                    }
                },

                // 🚀 收费/无限关卡分发逻辑
                triggerCrisisNow() {
                    const v = document.getElementById('main-video');
                    if (v) v.pause();
                    
                    if (this.isPro) {
                        this.showAIEngine = true; // PRO 用户进入 AI 无限舱过渡屏
                    } else {
                        this.showCrisis = true;   // 免费用户拦截
                    }
                },

                makeChoice(opt) {
                    if (this.isThinking) return;
                    if (opt.isCorrect === false) {
                        this.hudAlert.message = opt.feedback; this.hudAlert.show = true;
                        setTimeout(() => { this.hudAlert.show = false; }, 4000); return; 
                    }
                    
                    this.isThinking = true; this.showHUD = false; this.isTyping = false;
                    clearInterval(this.typeInterval); this.videoReady = false; clearTimeout(this.failsafeTimer);

                    setTimeout(() => {
                        this.isThinking = false; this.step++; 
                        const nextScene = this.scripts[this.lang][this.ageGroup][this.step];
                        if (nextScene) {
                            this.currentPhase = nextScene.phase || ''; this.currentStoryText = nextScene.ai || ''; this.currentOptions = nextScene.options || [];
                            this.$nextTick(() => {
                                const v = document.getElementById('main-video');
                                if(v) { v.src = this.videoUrl; v.load(); const p = v.play(); if (p !== undefined) p.catch(e=>{}); this.startFailsafe(); }
                            });
                        }
                    }, 800);
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
