<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XuePilot - AI Commander HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #050914; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; margin: 0; }
        
        /* 视频底座 */
        .video-container { position: fixed; inset: 0; z-index: 0; background: #000; }
        .scene-video { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s ease-in-out; }
        .video-active { opacity: 1 !important; filter: brightness(0.8) contrast(1.1); }
        
        /* 科幻机甲风 UI 切角与渐变 */
        .tech-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.95) 100%);
            border-top: 2px solid #06b6d4; /* Cyan-500 */
            border-bottom: 1px solid rgba(6, 182, 212, 0.3);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        
        .quantum-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(6, 182, 212, 0.4);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }
        .quantum-btn:hover {
            background: rgba(6, 182, 212, 0.15);
            border-color: #06b6d4;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }

        /* 打字机光标闪烁 */
        .typing-cursor::after { content: '█'; animation: blink 1s step-start infinite; color: #06b6d4; margin-left: 4px; }
        @keyframes blink { 50% { opacity: 0; } }
        
        /* 扫描线与全息边框 */
        .scanline { position: fixed; inset: 0; z-index: 15; background: linear-gradient(to bottom, transparent 50%, rgba(6, 182, 212, 0.05) 50%); background-size: 100% 4px; pointer-events: none; }
        .hud-border { position: fixed; inset: 0; z-index: 10; pointer-events: none; border: 2px solid rgba(6, 182, 212, 0.1); margin: 10px; }
        .hud-corner { position: absolute; width: 30px; height: 30px; border-color: #06b6d4; border-style: solid; border-width: 0; }
        .hud-corner-tl { top: -2px; left: -2px; border-top-width: 3px; border-left-width: 3px; }
        .hud-corner-tr { top: -2px; right: -2px; border-top-width: 3px; border-right-width: 3px; }
        .hud-corner-bl { bottom: -2px; left: -2px; border-bottom-width: 3px; border-left-width: 3px; }
        .hud-corner-br { bottom: -2px; right: -2px; border-bottom-width: 3px; border-right-width: 3px; }

        /* 启动屏 (Start Screen) */
        .start-overlay { position: fixed; inset: 0; z-index: 200; background: #030712; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .start-btn { position: relative; overflow: hidden; }
        .start-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: sweep 3s infinite; }
        @keyframes sweep { 100% { left: 200%; } }

        /* 故障与锁定特效 */
        .glitch-fx { animation: shake 0.2s infinite; filter: hue-rotate(90deg) brightness(1.5); }
        @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(2px, 1px); } 50% { transform: translate(-2px, -1px); } 75% { transform: translate(1px, 2px); } }
        .target-lock { position: absolute; width: 180px; height: 180px; border: 2px dashed #06b6d4; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 12; animation: rotateLock 6s linear infinite; border-radius: 50%; }
        @keyframes rotateLock { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        
        .terminal-font { font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body x-data="shipApp()" x-init="init()" @message.window="if($event.data.type === 'LANG_CHANGE') { lang = $event.data.lang; updateLang(); }" class="h-screen w-screen relative select-none" :class="isGlitching ? 'glitch-fx' : ''">

    <!-- 🚀 启动屏：强行获取用户交互，解锁声音权限 -->
    <div x-show="!missionStarted" class="start-overlay" :class="systemReady ? '' : 'cursor-wait'">
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMSIgZmlsbD0icmdiYSg2LCAxODIsIDIxMiwgMC4yKSIvPjwvc3ZnPg==')] opacity-30"></div>
        <div class="z-10 text-center flex flex-col items-center">
            <div class="text-6xl mb-8 animate-pulse text-cyan-500 filter drop-shadow-[0_0_20px_rgba(6,182,212,0.8)]">⎈</div>
            <h1 class="text-4xl font-black text-white tracking-[0.3em] mb-2" x-text="i18n[lang].sysName"></h1>
            <p class="text-cyan-600 font-mono text-xs mb-12 tracking-widest uppercase">Audio Systems & Neural Link Standby</p>
            
            <button x-show="systemReady" @click="startMission()" class="start-btn px-12 py-5 bg-cyan-600/20 border border-cyan-500 text-cyan-400 hover:bg-cyan-500 hover:text-white font-black tracking-widest text-lg transition-all shadow-[0_0_30px_rgba(6,182,212,0.3)]">
                <span x-text="i18n[lang].startBtn"></span>
            </button>
            
            <div x-show="!systemReady" class="flex flex-col items-center gap-3">
                <div class="w-8 h-8 border-2 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                <span class="text-cyan-500 font-mono text-[10px] tracking-widest" x-text="i18n[lang].linking"></span>
            </div>
        </div>
    </div>

    <!-- 视频底座：移除 loop 循环，移除 autoplay，由 JS 全权控制播放和定格 -->
    <div class="video-container">
        <video id="main-video" class="scene-video" :class="videoReady ? 'video-active' : ''"
               playsinline crossorigin="anonymous"
               @canplay="videoReady = true"
               @playing="videoReady = true"
               @timeupdate="handleTimeSync($event.target.currentTime)"
               @error="handleVideoError()">
        </video>
    </div>

    <div class="scanline"></div>
    <div class="hud-border">
        <div class="hud-corner hud-corner-tl"></div><div class="hud-corner hud-corner-tr"></div>
        <div class="hud-corner hud-corner-bl"></div><div class="hud-corner hud-corner-br"></div>
    </div>
    
    <div x-show="isLocking" x-transition.opacity.duration.1000ms class="target-lock">
        <div class="absolute -top-5 left-1/2 -translate-x-1/2 text-[10px] text-cyan-400 font-black tracking-widest bg-black/60 px-2 py-0.5 border border-cyan-500/30" x-text="i18n[lang].target"></div>
    </div>

    <!-- 🚀 交互 UI 层：仅在视频定格时 (showHUD = true) 才会显示 -->
    <main class="fixed inset-0 z-30 flex flex-col items-center justify-end pb-16 px-10 pointer-events-none">
        
        <!-- 对话面板 -->
        <div x-show="showHUD" x-cloak x-transition:enter="transition ease-out duration-700 transform" x-transition:enter-start="opacity-0 translate-y-10 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100" x-transition:leave="transition ease-in duration-300" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="w-full max-w-4xl mb-8 relative pointer-events-auto">
            <div class="tech-panel p-8 relative">
                <!-- 装饰线条 -->
                <div class="absolute top-0 right-0 w-32 h-1 bg-cyan-500 shadow-[0_0_10px_#06b6d4]"></div>
                <div class="absolute -top-3 left-8 bg-cyan-600 text-[10px] font-black px-4 py-1 uppercase tracking-widest text-white shadow-lg" x-text="i18n[lang].advisor"></div>
                
                <!-- 打字机特效文本 -->
                <p class="text-xl md:text-2xl font-bold leading-relaxed text-cyan-50 italic mt-3 terminal-font min-h-[4rem]" :class="isTyping ? 'typing-cursor' : ''" x-html="displayedText"></p>
            </div>
        </div>

        <!-- 选项按钮组 -->
        <div x-show="showHUD && !isTyping" x-cloak x-transition:enter="transition ease-out duration-500 delay-300 transform" x-transition:enter-start="opacity-0 translate-y-8" x-transition:enter-end="opacity-100 translate-y-0" class="flex flex-wrap justify-center gap-6 w-full max-w-5xl">
            <template x-for="(opt, idx) in currentOptions" :key="idx">
                <button @click="makeChoice(opt)" class="quantum-btn px-10 py-6 flex flex-col items-start gap-1 group relative">
                    <span class="text-[9px] text-cyan-500 font-mono uppercase tracking-widest" x-text="`${i18n[lang].inst} 0x0${idx+1}`"></span>
                    <span class="text-base font-black text-white group-hover:text-cyan-300 transition-colors tracking-wide" x-text="opt.text"></span>
                </button>
            </template>
        </div>
    </main>

    <!-- 熔断危机弹窗 -->
    <div x-show="showCrisis" x-cloak class="fixed inset-0 z-[120] bg-rose-950/90 backdrop-blur-2xl flex flex-col items-center justify-center p-10 text-center border-4 border-rose-900/50">
        <div class="w-24 h-24 bg-rose-600 rounded-none rotate-45 flex items-center justify-center mb-10 shadow-[0_0_100px_#ef4444] animate-pulse">
            <span class="text-5xl -rotate-45 text-white font-black">!</span>
        </div>
        <h2 class="text-5xl font-black text-white mb-4 tracking-tighter uppercase" x-text="i18n[lang].haltedTitle"></h2>
        <p class="text-rose-200 text-lg max-w-2xl mb-12 font-bold leading-relaxed" x-html="i18n[lang].haltedDesc"></p>
        <button @click="window.location.href='index.html'" class="px-12 py-5 bg-white text-rose-900 font-black text-xl hover:bg-rose-100 transition-all shadow-[0_0_30px_rgba(255,255,255,0.5)] cursor-pointer pointer-events-auto" style="clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);" x-text="i18n[lang].proBtn"></button>
    </div>

    <script>
        function shipApp() {
            return {
                lang: window.localStorage.getItem('xp_lang') || 'zh',
                step: 0, ageGroup: 'mid',
                
                systemReady: false,      // 系统是否加载完毕
                missionStarted: false,   // 用户是否点击了开始
                videoReady: false,       // 视频是否可以播放
                showHUD: false,          // 是否显示机甲交互界面 (视频定格时触发)
                
                isGlitching: false, isLocking: false, 
                currentStoryText: '', displayedText: '', currentOptions: [],
                isTyping: false, typeInterval: null,
                isPro: false, showCrisis: false, isThinking: false,
                failsafeTimer: null,

                i18n: {
                    zh: {
                        sysName: 'XUEPILOT 神经链路', startBtn: '⚡ 建立连接并授权音轨', linking: '核心模块加载中...',
                        target: 'TARGET_LOCKED', advisor: 'A.I. 战术顾问', inst: '指令集',
                        haltedTitle: '算力维度封锁', haltedDesc: '预制维度的算力已耗尽。前方高危区域需要解锁<br><span class="text-white underline underline-offset-8">量子 Pro 密钥</span> 才能继续推演。', proBtn: '获取 Pro 能量补给 ➔'
                    },
                    en: {
                        sysName: 'XUEPILOT NEURAL LINK', startBtn: '⚡ ENGAGE LINK & AUDIO', linking: 'Loading core modules...',
                        target: 'TARGET_LOCKED', advisor: 'A.I. Tactical Advisor', inst: 'EXEC',
                        haltedTitle: 'Engine Halted', haltedDesc: 'Compute power for this dimension depleted. The sector ahead requires a <br><span class="text-white underline underline-offset-8">Quantum PRO Key</span> to proceed.', proBtn: 'Acquire PRO Energy ➔'
                    }
                },

                get videoUrl() {
                    return `https://cywslfalbedraeeggryj.supabase.co/storage/v1/object/public/cinematics/${this.ageGroup}_step${this.step + 1}.mp4`;
                },

                scripts: {
                    zh: {
                        young: [
                            { ai: "小指挥官，前方有道气泡墙。如果不问出一个‘聪明的问题’，气泡就不会破。你想问什么？", options: [{ text: "气泡是用什么做的？" }, { text: "为什么它会挡住我们？" }] },
                            { ai: "精彩！气泡破了。但里面的彩虹桥断了，你需要用逻辑修补它。告诉我，修桥的目的是什么？", options: [{ text: "为了让数据流过去" }, { text: "为了不让星星掉下来" }] },
                            { ai: "🚨 致命警报！前方算力空间坍缩，糖果星球正在解体！", isCrisisVideo: true }
                        ],
                        mid: [
                            { ai: "指挥官，飞船已进入逻辑哨所范围。哨所守卫拒绝泊入，它说：‘我只在被质疑时展示真相’。请下达第一条指令：", options: [{ text: "分析守卫的逻辑漏洞" }, { text: "发射‘悖论’通信脉冲" }] },
                            { ai: "守卫由于逻辑冲突重启中。我们已进入中转舱。这里的数据碎片正在流失！你需要用一个问题固定它。你的问题是？", options: [{ text: "如果因果倒置，现在是过去吗？" }, { text: "碎片与整体的关系是什么？" }] },
                            { ai: "🚨 严重警告：算力引擎发生物理熔断！真实宇宙的因果律正在撕裂！", isCrisisVideo: true }
                        ],
                        old: [
                            { ai: "指挥官，我们正处于事件视界边缘。戴森球核心出现了引力动荡。为了稳定结构，我们需要确立逻辑奇点。你的决策是？", options: [{ text: "建立非欧几里得探测协议" }, { text: "同步高维算力扰动频率" }] },
                            { ai: "能量场暂时稳定。但空间板块出现了几何错误。这是由于底层代码的逻辑冗余造成的。请指出处理优先级：", options: [{ text: "重构第一性原理协议" }, { text: "隔离并分析冗余来源" }] },
                            { ai: "🚨 严重警告：多维空间正在发生灾难性降解！物理法则已失效！", isCrisisVideo: true }
                        ]
                    },
                    en: {
                        young: [
                            { ai: "Commander, there's a bubble wall ahead. Ask a smart question to break it.", options: [{ text: "What is the bubble made of?" }, { text: "Why is it blocking us?" }] },
                            { ai: "Brilliant! Bubble shattered. But the rainbow bridge is broken. What is the logical purpose of repairing it?", options: [{ text: "To allow data stream flow" }, { text: "To prevent stars from falling" }] },
                            { ai: "🚨 ALERT! Space collapsing, Candy Planet is disintegrating!", isCrisisVideo: true }
                        ],
                        mid: [
                            { ai: "Commander, approaching logic outpost. The guard denies entry, stating: 'I only reveal truth when questioned.' Your orders?", options: [{ text: "Analyze logical flaws" }, { text: "Emit paradox pulse" }] },
                            { ai: "Guard is rebooting. We're inside. Data fragments are leaking! Ask a conceptual question to anchor them.", options: [{ text: "If causality inverts, is now the past?" }, { text: "How do fragments relate to the whole?" }] },
                            { ai: "🚨 CRITICAL WARNING: Engine meltdown! Causality is tearing apart!", isCrisisVideo: true }
                        ],
                        old: [
                            { ai: "Commander, we are at the event horizon. The Dyson sphere core is unstable. We must establish a logic singularity to stabilize it.", options: [{ text: "Init non-Euclidean protocol" }, { text: "Sync hyper-dimensional freq" }] },
                            { ai: "Energy field stable. However, spatial plates show geometric errors due to redundant base code. Priority?", options: [{ text: "Refactor first principles" }, { text: "Isolate redundant sources" }] },
                            { ai: "🚨 CRITICAL WARNING: Multi-dimensional degradation detected!", isCrisisVideo: true }
                        ]
                    }
                },

                updateLang() {
                    const scene = this.scripts[this.lang][this.ageGroup][this.step];
                    if (scene) {
                        this.currentStoryText = scene.ai;
                        this.currentOptions = scene.options || [];
                    }
                },

                // 🚀 打字机特效引擎
                typewriterEffect(text) {
                    this.displayedText = '';
                    let i = 0;
                    this.isTyping = true;
                    clearInterval(this.typeInterval);
                    this.typeInterval = setInterval(() => {
                        this.displayedText += text.charAt(i);
                        i++;
                        if (i >= text.length) {
                            clearInterval(this.typeInterval);
                            this.isTyping = false;
                        }
                    }, 40); // 打字速度
                },

                init() {
                    try {
                        const params = new URLSearchParams(window.location.search);
                        this.ageGroup = params.get('age') || 'mid';
                        this.isPro = window.localStorage.getItem('xp_is_pro') === 'true';
                        
                        if (!this.scripts[this.lang][this.ageGroup]) this.ageGroup = 'mid';
                        const scene = this.scripts[this.lang][this.ageGroup][0];
                        this.currentStoryText = scene.ai;
                        this.currentOptions = scene.options || [];
                        
                        // 模拟系统自检，1秒后解锁 Start 按钮
                        setTimeout(() => { this.systemReady = true; }, 1000);

                    } catch (e) {
                        console.error("Init Error:", e);
                        this.systemReady = true;
                    }
                },

                // 🚀 用户点击启动：解锁声音！
                startMission() {
                    this.missionStarted = true;
                    
                    const v = document.getElementById('main-video');
                    if(v) {
                        v.src = this.videoUrl;
                        v.muted = false; // 完美解锁声音！因为这是在用户的 Click 事件中触发的。
                        v.load();
                        const playPromise = v.play();
                        if (playPromise !== undefined) playPromise.catch(e => console.warn("Audio block:", e));
                    }
                    this.startFailsafe();
                },

                startFailsafe() {
                    clearTimeout(this.failsafeTimer);
                    this.failsafeTimer = setTimeout(() => {
                        console.warn("Failsafe triggered");
                        this.triggerNodeAction();
                    }, 9000); // 9秒保底（比正常的 7.8 秒长）
                },

                handleVideoError() {
                    console.error("Video Load Error");
                    clearTimeout(this.failsafeTimer);
                    setTimeout(() => { this.triggerNodeAction(); }, 2000);
                },

                handleTimeSync(time) {
                    if (!this.missionStarted) return;
                    
                    if (time > 2.5 && time < 2.7) this.isGlitching = true; else this.isGlitching = false;
                    if (time > 5.0) this.isLocking = true; else this.isLocking = false;
                    
                    // 🚀 核心控制：当视频到达 7.8 秒时，定格画面，弹出 UI！
                    if (time > 7.8 && !this.showHUD) {
                        clearTimeout(this.failsafeTimer); 
                        
                        const v = document.getElementById('main-video');
                        if (v && !v.paused) v.pause(); // 瞬间定格！不再循环！

                        this.triggerNodeAction();
                    }
                },

                triggerNodeAction() {
                    const currentScene = this.scripts[this.lang][this.ageGroup][this.step];
                    if (currentScene && currentScene.isCrisisVideo) {
                        if (!this.showCrisis) this.triggerCrisisNow(); // 第3个视频播到尾声，强行拉闸！
                    } else {
                        if (!this.showHUD) {
                            this.showHUD = true; // 弹出极客风 UI
                            this.typewriterEffect(this.currentStoryText); // 开始打字
                        }
                    }
                },

                triggerCrisisNow() {
                    const v = document.getElementById('main-video');
                    if (v) v.pause(); 
                    
                    if (this.isPro) {
                        Swal.fire({
                            title: this.lang === 'zh' ? 'PRO 权限已验证' : 'PRO Access Verified', 
                            text: this.lang === 'zh' ? '正在为您生成实时宇宙...' : 'Generating real-time universe...', 
                            icon: 'success', background: '#030712', color: '#06b6d4'
                        }).then(() => { window.location.href = 'index.html'; });
                    } else {
                        this.showCrisis = true;
                    }
                },

                makeChoice(opt) {
                    if (this.isThinking) return;
                    this.isThinking = true;
                    
                    // 收起当前界面的 HUD
                    this.showHUD = false;
                    this.isTyping = false;
                    clearInterval(this.typeInterval);
                    this.videoReady = false; 
                    clearTimeout(this.failsafeTimer);

                    setTimeout(() => {
                        this.isThinking = false;
                        this.step++; // 推进剧本
                        
                        const nextScene = this.scripts[this.lang][this.ageGroup][this.step];
                        if (nextScene) {
                            this.currentStoryText = nextScene.ai;
                            this.currentOptions = nextScene.options || [];
                            
                            this.$nextTick(() => {
                                const v = document.getElementById('main-video');
                                if(v) {
                                    v.src = this.videoUrl;
                                    v.load(); 
                                    // 视频播放，带着声音，毫无阻力
                                    const playPromise = v.play();
                                    if (playPromise !== undefined) playPromise.catch(e => console.warn(e));
                                    
                                    this.startFailsafe(); 
                                }
                            });
                        }
                    }, 800); // 留一点时间让旧界面淡出
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>
</html>
